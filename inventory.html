<style>
  .inventory-table th { font-weight: bold; color: #64748b; font-size: 0.85rem; border-bottom: 2px solid #e2e8f0; padding: 12px; }
  .inventory-table td { padding: 12px; vertical-align: middle; border-bottom: 1px dashed #e2e8f0; }
  .custom-scrollbar::-webkit-scrollbar { width: 6px; } .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 10px; } .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
  .stock-low { color: #e11d48; font-weight: bold; background-color: #ffe4e6; padding: 2px 8px; border-radius: 12px; }
</style>

<div class="container-fluid py-4" style="max-width: 1400px; height: 100vh; display: flex; flex-direction: column;">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="fw-bold text-warning m-0"><i class="fa-solid fa-prescription-bottle-medical me-2"></i> คลังยาและเวชภัณฑ์ (Inventory)</h3>
    <button class="btn btn-outline-danger fw-bold rounded-pill px-4" onclick="closeModule()"><i class="fa-solid fa-xmark me-2"></i> ปิดหน้านี้</button>
  </div>

  <div class="row g-4 flex-grow-1" style="min-height: 0;">
    
    <!-- 📦 ฟอร์มเพิ่มสินค้าใหม่ -->
    <div class="col-lg-4 col-md-5 h-100">
      <div class="bg-white p-4 rounded-4 shadow-sm border h-100 d-flex flex-column">
        <h5 class="fw-bold m-0 mb-4 text-primary"><i class="fa-solid fa-box-open me-2"></i> เพิ่ม / แก้ไขสินค้า</h5>
        
        <form id="productForm" onsubmit="saveProduct(event)">
          <div class="mb-3">
            <label class="form-label fw-bold small text-muted">รหัสสินค้า (ID / Barcode) *</label>
            <input type="text" id="pd_id" class="form-control rounded-3" placeholder="เช่น BTX-001" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-bold small text-muted">ชื่อสินค้า / บริการ *</label>
            <input type="text" id="pd_name" class="form-control rounded-3" placeholder="เช่น โบท็อกซ์เกาหลี 100U" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-bold small text-muted">ประเภทหมวดหมู่</label>
            <select id="pd_type" class="form-select rounded-3">
              <option value="MEDICINE">ยาและเวชภัณฑ์</option>
              <option value="INJECTABLE">กลุ่มฉีด (Botox, Filler, Meso)</option>
              <option value="COURSE">คอร์ส / หัตถการเลเซอร์</option>
              <option value="SKINCARE">สกินแคร์ / ครีม</option>
            </select>
          </div>
          <div class="row mb-3">
            <div class="col-6">
              <label class="form-label fw-bold small text-muted">ราคาขาย (฿)</label>
              <input type="number" id="pd_price" class="form-control rounded-3" value="0">
            </div>
            <div class="col-6">
              <label class="form-label fw-bold small text-muted">จำนวนสต็อกตั้งต้น</label>
              <input type="number" id="pd_stock" class="form-control rounded-3" value="0" step="0.1">
            </div>
          </div>
          <div class="mb-4">
            <label class="form-label fw-bold small text-muted">หน่วยนับ</label>
            <input type="text" id="pd_unit" class="form-control rounded-3" placeholder="เช่น ยูนิต, CC, ขวด, ครั้ง" required>
          </div>
          
          <div class="d-flex gap-2 mt-auto">
            <button type="button" class="btn btn-light rounded-pill fw-bold shadow-sm w-50" onclick="document.getElementById('productForm').reset()">เคลียร์ฟอร์ม</button>
            <button type="submit" class="btn btn-primary rounded-pill fw-bold shadow-sm w-50"><i class="fa-solid fa-floppy-disk me-1"></i> บันทึก</button>
          </div>
        </form>
      </div>
    </div>

    <!-- 📊 ตารางแสดงคลังสินค้า -->
    <div class="col-lg-8 col-md-7 h-100">
      <div class="bg-white p-4 rounded-4 shadow-sm border h-100 d-flex flex-column">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h5 class="fw-bold m-0"><i class="fa-solid fa-boxes-stacked me-2 text-warning"></i> รายการสินค้าคงคลัง</h5>
          <div class="input-group" style="width: 250px;">
            <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
            <input type="text" id="searchInventory" class="form-control border-start-0 bg-light" placeholder="ค้นหาสินค้า..." onkeyup="filterInventory()">
          </div>
        </div>

        <div class="custom-scrollbar" style="overflow-y: auto; flex-grow: 1; padding-right: 5px;">
          <table class="table inventory-table w-100 mb-0" id="inventoryTable">
            <thead style="position: sticky; top: 0; background: white; z-index: 1;">
              <tr>
                <th width="15%">รหัส</th>
                <th width="30%">ชื่อสินค้า/บริการ</th>
                <th width="15%">ประเภท</th>
                <th width="15%" class="text-center">สต็อกคงเหลือ</th>
                <th width="25%" class="text-center">จัดการสต็อก</th>
              </tr>
            </thead>
            <tbody id="inventoryList">
              <tr><td colspan="5" class="text-center py-5 text-muted">กำลังโหลดข้อมูลคลังสินค้า...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
  var inventoryData = [];

  function initInventory() {
    loadInventory();
  }
  initInventory();

  async function loadInventory() {
    try {
      const res = await fetch('/api/inventory');
      const data = await res.json();
      if(data.status === 'success') {
        inventoryData = data.data;
        renderInventoryList(inventoryData);
      }
    } catch (e) {
      console.error(e);
    }
  }

  function renderInventoryList(items) {
    const list = document.getElementById('inventoryList');
    list.innerHTML = '';
    
    if(items.length === 0) {
      list.innerHTML = `<tr><td colspan="5" class="text-center py-5 text-muted">ยังไม่มีรายการสินค้าในคลัง</td></tr>`;
      return;
    }

    items.forEach(item => {
      let typeBadge = '';
      if(item.type === 'MEDICINE') typeBadge = '<span class="badge bg-secondary">ยา/เวชภัณฑ์</span>';
      else if(item.type === 'INJECTABLE') typeBadge = '<span class="badge bg-danger">กลุ่มฉีด</span>';
      else if(item.type === 'COURSE') typeBadge = '<span class="badge bg-info text-dark">คอร์สเลเซอร์</span>';
      else typeBadge = '<span class="badge bg-success">สกินแคร์</span>';

      let stockDisplay = item.stock <= 5 && item.type !== 'COURSE' 
        ? `<span class="stock-low">${item.stock} ${item.unit}</span>` 
        : `<span>${item.stock} ${item.unit}</span>`;

      list.innerHTML += `
        <tr>
          <td class="fw-bold text-muted small">${item.id}</td>
          <td>
            <a href="#" class="fw-bold text-primary text-decoration-none" onclick="editProduct('${item.id}')">${item.name}</a><br>
            <small class="text-muted">฿ ${item.price.toLocaleString()}</small>
          </td>
          <td>${typeBadge}</td>
          <td class="text-center fw-bold fs-6">${stockDisplay}</td>
          <td class="text-center">
            <button class="btn btn-sm btn-outline-success rounded-circle me-1" title="รับเข้าสต็อก" onclick="adjustStock('${item.id}', '${item.name}', 'add')"><i class="fa-solid fa-plus"></i></button>
            <button class="btn btn-sm btn-outline-warning rounded-circle me-3" title="เบิกออกสต็อก" onclick="adjustStock('${item.id}', '${item.name}', 'remove')"><i class="fa-solid fa-minus"></i></button>
            <button class="btn btn-sm btn-light text-danger rounded-circle" title="ลบสินค้า" onclick="deleteProduct('${item.id}')"><i class="fa-solid fa-trash"></i></button>
          </td>
        </tr>
      `;
    });
  }

  function filterInventory() {
    let search = document.getElementById('searchInventory').value.toLowerCase();
    let filtered = inventoryData.filter(i => i.name.toLowerCase().includes(search) || i.id.toLowerCase().includes(search));
    renderInventoryList(filtered);
  }

  async function saveProduct(e) {
    e.preventDefault();
    const payload = {
      id: document.getElementById('pd_id').value,
      name: document.getElementById('pd_name').value,
      type: document.getElementById('pd_type').value,
      price: parseFloat(document.getElementById('pd_price').value),
      stock: parseFloat(document.getElementById('pd_stock').value),
      unit: document.getElementById('pd_unit').value
    };

    Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
    try {
      await fetch('/api/inventory', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      Swal.fire({ icon: 'success', title: 'บันทึกสำเร็จ', toast: true, position: 'top-end', timer: 1500, showConfirmButton: false });
      document.getElementById('productForm').reset();
      loadInventory();
    } catch(e) { Swal.fire('Error', 'ไม่สามารถบันทึกได้', 'error'); }
  }

  function editProduct(id) {
    let item = inventoryData.find(i => i.id === id);
    if(item) {
      document.getElementById('pd_id').value = item.id;
      document.getElementById('pd_name').value = item.name;
      document.getElementById('pd_type').value = item.type;
      document.getElementById('pd_price').value = item.price;
      document.getElementById('pd_stock').value = item.stock;
      document.getElementById('pd_unit').value = item.unit;
    }
  }

  function adjustStock(id, name, mode) {
    let titleTxt = mode === 'add' ? 'รับเข้าสต็อก' : 'เบิกออกสต็อก (ลดจำนวน)';
    Swal.fire({
      title: titleTxt,
      text: `สินค้า: ${name}`,
      input: 'number',
      inputAttributes: { step: '0.1', min: '0.1' },
      showCancelButton: true,
      confirmButtonText: 'ยืนยัน',
      confirmButtonColor: mode === 'add' ? '#10b981' : '#f59e0b'
    }).then(async (result) => {
      if (result.isConfirmed && result.value) {
        let qty = parseFloat(result.value);
        if(mode === 'remove') qty = -Math.abs(qty); // ทำเป็นค่าติดลบถ้าเบิกออก

        Swal.fire({ title: 'กำลังอัปเดต...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
        await fetch(`/api/inventory/${id}/stock`, {
          method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ adjust_qty: qty })
        });
        Swal.fire({ icon: 'success', title: 'อัปเดตสต็อกเรียบร้อย', toast: true, position: 'top-end', timer: 1500, showConfirmButton: false });
        loadInventory();
      }
    });
  }

  async function deleteProduct(id) {
    if ((await Swal.fire({ title: 'ยืนยันลบสินค้านี้?', icon:'warning', showCancelButton: true, confirmButtonColor: '#e11d48' })).isConfirmed) {
      await fetch(`/api/inventory/${id}`, { method: 'DELETE' });
      loadInventory();
    }
  }
</script>
