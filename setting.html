<style>
  /* iPad Settings UI Style */
  .settings-container { height: calc(100vh - 40px); margin-top: 20px; background-color: #f8fafc; border-radius: 24px; box-shadow: 0 15px 35px rgba(0,0,0,0.05); overflow: hidden; border: 1px solid #e2e8f0; }
  .settings-sidebar { background-color: #ffffff; border-right: 1px solid #e2e8f0; height: 100%; padding: 20px; }
  .settings-content { background-color: #f8fafc; height: 100%; padding: 30px; overflow-y: auto; }
  
  .settings-menu-item { display: flex; align-items: center; padding: 14px 20px; border-radius: 12px; margin-bottom: 8px; color: #475569; font-weight: 600; cursor: pointer; transition: all 0.2s; }
  .settings-menu-item:hover { background-color: #f1f5f9; }
  .settings-menu-item.active { background-color: #3b82f6; color: #ffffff; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3); }
  
  .user-card { background: #ffffff; border-radius: 16px; padding: 20px; border: 1px solid #e2e8f0; transition: 0.2s; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .user-card:hover { border-color: #94a3b8; transform: translateY(-2px); box-shadow: 0 8px 15px rgba(0,0,0,0.03); }
  
  /* Modern Permission UI (ไม่ซ้อนทับแน่นอน) */
  .perm-box { border: 1px solid #cbd5e1; border-radius: 12px; padding: 12px 15px; background: #ffffff; cursor: pointer; transition: 0.2s; display: flex; align-items: center; height: 100%; }
  .perm-box:hover { background: #eff6ff; border-color: #93c5fd; }
  .perm-box input:checked + label { color: #1d4ed8 !important; }
</style>

<div class="container-fluid h-100" style="max-width: 1400px;">
  <div class="settings-container d-flex flex-row">
    
    <!-- เมนูด้านซ้าย (Sidebar) -->
    <div class="settings-sidebar col-3">
      <div class="d-flex align-items-center mb-4 pb-3 border-bottom">
        <h4 class="fw-bold m-0 text-dark"><i class="fa-solid fa-gear me-2 text-secondary"></i> การตั้งค่า</h4>
      </div>
      
      <div class="settings-menu-item active" onclick="switchSettingTab('users')">
        <i class="fa-solid fa-users-gear me-3 fs-5"></i> พนักงานและสิทธิ์ (Users)
      </div>
      <div class="settings-menu-item text-muted" onclick="Swal.fire('Coming Soon','กำลังพัฒนาระบบข้อมูลคลินิก','info')">
        <i class="fa-solid fa-house-medical me-3 fs-5"></i> ข้อมูลคลินิก / สาขา
      </div>
      
      <div class="settings-menu-item text-muted text-danger mt-auto border-top pt-3" style="position:absolute; bottom: 30px; width: calc(25% - 40px);" onclick="closeModule(); document.getElementById('userModal')?.remove();">
        <i class="fa-solid fa-arrow-right-from-bracket me-3 fs-5"></i> ออกจากการตั้งค่า
      </div>
    </div>

    <!-- รายละเอียดด้านขวา (Content) -->
    <div class="settings-content col-9 position-relative">
      <div id="tab-users" class="h-100 d-flex flex-column">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h4 class="fw-bold text-primary m-0">จัดการบัญชีพนักงาน</h4>
          <button class="btn btn-primary rounded-pill px-4 fw-bold shadow-sm" onclick="openUserModal()"><i class="fa-solid fa-plus me-1"></i> เพิ่มพนักงานใหม่</button>
        </div>
        
        <div class="custom-scrollbar" style="overflow-y: auto; flex-grow: 1; padding-right: 5px;" id="usersList">
          <div class="text-center text-muted py-5">กำลังโหลดข้อมูล...</div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 🌟 Modal เพิ่ม/แก้ไขพนักงาน (UI ใหม่) -->
<div class="modal fade" id="userModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content rounded-4 border-0 shadow-lg">
      <div class="modal-header border-bottom-0 bg-light rounded-top-4 p-4">
        <h5 class="modal-title fw-bold text-primary" id="userModalTitle"><i class="fa-solid fa-user-pen me-2"></i>สร้าง/แก้ไขพนักงาน</h5>
        <button type="button" class="btn-close" onclick="closeUserModal()"></button>
      </div>
      <div class="modal-body p-4 bg-light bg-opacity-50">
        <form id="userForm">
          <input type="hidden" id="u_id">
          
          <div class="bg-white p-3 rounded-4 shadow-sm border mb-4">
            <h6 class="fw-bold text-secondary mb-3 border-bottom pb-2">ข้อมูลทั่วไป</h6>
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label fw-bold small text-muted">ชื่อ - นามสกุล *</label>
                <input type="text" id="u_name" class="form-control rounded-3 border-primary" required>
              </div>
              <div class="col-md-3">
                <label class="form-label fw-bold small text-muted">PIN (ตัวเลข 4 หลัก) *</label>
                <input type="text" id="u_pin" class="form-control rounded-3 border-primary text-center fw-bold" maxlength="4" pattern="[0-9]{4}" required>
              </div>
              <div class="col-md-3">
                <label class="form-label fw-bold small text-muted">ตำแหน่ง (Role) *</label>
                <select id="u_role" class="form-select rounded-3">
                  <option value="ADMIN">ผู้บริหาร (Admin)</option>
                  <option value="DOCTOR">แพทย์ (Doctor)</option>
                  <option value="STAFF">พนักงาน (Staff)</option>
                </select>
              </div>
            </div>
          </div>

          <div class="bg-white p-3 rounded-4 shadow-sm border">
            <h6 class="fw-bold text-secondary mb-3 border-bottom pb-2">สิทธิ์การเข้าใช้งานเมนู</h6>
            
            <div class="form-check mb-3 bg-danger bg-opacity-10 p-3 rounded-3 border border-danger d-flex align-items-center">
              <input class="form-check-input ms-1 me-3" type="checkbox" id="perm_all" onchange="toggleAllPerms(this)" style="transform: scale(1.3);">
              <label class="form-check-label fw-bold text-danger m-0" for="perm_all">ผู้ดูแลระบบ (Admin) - เข้าถึงได้ทุกเมนูโดยอัตโนมัติ</label>
            </div>
            
            <div class="row g-2">
              <div class="col-md-6">
                <div class="perm-box">
                  <input class="form-check-input perm-cb me-3 m-0" type="checkbox" value="BOOKING" id="cb_1">
                  <label class="form-check-label w-100 text-secondary fw-bold" for="cb_1">1. นัดหมาย & คิว</label>
                </div>
              </div>
              <div class="col-md-6">
                <div class="perm-box">
                  <input class="form-check-input perm-cb me-3 m-0" type="checkbox" value="PATIENT_1" id="cb_2">
                  <label class="form-check-label w-100 text-secondary fw-bold" for="cb_2">2. ลงทะเบียน & คัดกรอง</label>
                </div>
              </div>
              <div class="col-md-6">
                <div class="perm-box">
                  <input class="form-check-input perm-cb me-3 m-0" type="checkbox" value="PATIENT_2" id="cb_3">
                  <label class="form-check-label w-100 text-secondary fw-bold" for="cb_3">3. ห้องตรวจแพทย์</label>
                </div>
              </div>
              <div class="col-md-6">
                <div class="perm-box">
                  <input class="form-check-input perm-cb me-3 m-0" type="checkbox" value="POS" id="cb_4">
                  <label class="form-check-label w-100 text-secondary fw-bold" for="cb_4">4. ขาย & ชำระเงิน (POS)</label>
                </div>
              </div>
              <div class="col-md-6">
                <div class="perm-box">
                  <input class="form-check-input perm-cb me-3 m-0" type="checkbox" value="STOCK" id="cb_5">
                  <label class="form-check-label w-100 text-secondary fw-bold" for="cb_5">5. คลังยา (Inventory)</label>
                </div>
              </div>
              <div class="col-md-6">
                <div class="perm-box">
                  <input class="form-check-input perm-cb me-3 m-0" type="checkbox" value="DASH" id="cb_6">
                  <label class="form-check-label w-100 text-secondary fw-bold" for="cb_6">6. รายงานยอดขาย (Reports)</label>
                </div>
              </div>
              <div class="col-md-12">
                <div class="perm-box">
                  <input class="form-check-input perm-cb me-3 m-0" type="checkbox" value="PATIENT_3" id="cb_7">
                  <label class="form-check-label w-100 text-secondary fw-bold" for="cb_7">7. ฐานข้อมูลรายชื่อคนไข้</label>
                </div>
              </div>
            </div>
          </div>

        </form>
      </div>
      <div class="modal-footer border-top-0 bg-white rounded-bottom-4 p-3 border-top">
        <button type="button" class="btn btn-light rounded-pill px-4 fw-bold" onclick="closeUserModal()">ยกเลิก</button>
        <button type="button" class="btn btn-primary rounded-pill px-4 fw-bold shadow-sm" onclick="saveUser()"><i class="fa-solid fa-floppy-disk me-1"></i> บันทึกข้อมูลพนักงาน</button>
      </div>
    </div>
  </div>
</div>

<script>
  var allUsers = [];
  var userModal = null; 

  function initSettings() { loadUsers(); }
  initSettings();

  async function loadUsers() {
    try {
      const res = await fetch('/api/users');
      const data = await res.json();
      allUsers = data.data;
      renderUsers();
    } catch(e) { console.error(e); }
  }

  function renderUsers() {
    const list = document.getElementById('usersList');
    list.innerHTML = '';
    
    // ดึง ID ของคนที่กำลังใช้งานระบบอยู่ (จาก Session)
    const currentUserId = parseInt(sessionStorage.getItem('currentUserId'));

    allUsers.forEach(u => {
      let roleColor = u.role === 'ADMIN' ? 'danger' : (u.role === 'DOCTOR' ? 'info' : 'success');
      let isAllPerm = u.permissions.includes('ADMIN');
      let permBadge = isAllPerm ? `<span class="badge bg-danger bg-opacity-10 text-danger border border-danger rounded-pill">เข้าถึงได้ทุกเมนู (Full Access)</span>` : `<span class="badge bg-secondary bg-opacity-10 text-secondary border rounded-pill">กำหนดสิทธิ์เฉพาะส่วน</span>`;
      
      // 🌟 ดักจับ: ถ้าเป็น ID ของตัวเอง ให้เปลี่ยนปุ่มลบเป็นไอคอนห้าม
      let deleteBtnHtml = '';
      if (u.id === currentUserId) {
        deleteBtnHtml = `<button class="btn btn-sm btn-light text-muted rounded-circle" title="บัญชีของคุณ" onclick="Swal.fire('แจ้งเตือน', 'ไม่สามารถลบบัญชีของตัวเองขณะกำลังใช้งานได้', 'warning')"><i class="fa-solid fa-ban"></i></button>`;
      } else {
        deleteBtnHtml = `<button class="btn btn-sm btn-light text-danger rounded-circle" onclick="deleteUser(${u.id}, '${u.name}')"><i class="fa-solid fa-trash"></i></button>`;
      }

      list.innerHTML += `
        <div class="user-card">
          <div class="d-flex align-items-center">
            <div class="bg-${roleColor} bg-opacity-10 text-${roleColor} rounded-circle d-flex justify-content-center align-items-center fw-bold me-3" style="width: 50px; height: 50px; font-size: 1.2rem;">
              ${u.name.substring(0, 1)}
            </div>
            <div>
              <h6 class="fw-bold m-0 text-dark mb-1">${u.name} <span class="badge bg-${roleColor} ms-2">${u.role}</span></h6>
              <div class="small">
                <span class="text-muted me-3"><i class="fa-solid fa-key me-1"></i> PIN: <b>${u.pin}</b></span>
                ${permBadge}
              </div>
            </div>
          </div>
          <div>
            <button class="btn btn-sm btn-outline-primary rounded-circle me-1" onclick="openUserModal(${u.id})"><i class="fa-solid fa-pen"></i></button>
            ${deleteBtnHtml}
          </div>
        </div>
      `;
    });
  }

  function toggleAllPerms(checkbox) {
    document.querySelectorAll('.perm-cb').forEach(cb => { cb.checked = checkbox.checked; cb.disabled = checkbox.checked; });
  }

  function openUserModal(id = null) {
    const modalEl = document.getElementById('userModal');
    if (modalEl && modalEl.parentNode !== document.body) { document.body.appendChild(modalEl); }

    document.getElementById('userForm').reset();
    document.querySelectorAll('.perm-cb').forEach(cb => { cb.checked = false; cb.disabled = false; });
    
    if(id) {
      document.getElementById('userModalTitle').innerHTML = '<i class="fa-solid fa-user-pen me-2"></i>แก้ไขพนักงาน';
      let u = allUsers.find(x => x.id === id);
      document.getElementById('u_id').value = u.id;
      document.getElementById('u_name').value = u.name;
      document.getElementById('u_pin').value = u.pin;
      document.getElementById('u_role').value = u.role;
      
      if(u.permissions.includes('ADMIN')) {
        document.getElementById('perm_all').checked = true;
        toggleAllPerms(document.getElementById('perm_all'));
      } else {
        const perms = u.permissions.split(',');
        document.querySelectorAll('.perm-cb').forEach(cb => { if(perms.includes(cb.value)) cb.checked = true; });
      }
    } else {
      document.getElementById('userModalTitle').innerHTML = '<i class="fa-solid fa-user-plus me-2"></i>เพิ่มพนักงานใหม่';
      document.getElementById('u_id').value = '';
    }

    let existingModal = bootstrap.Modal.getInstance(modalEl);
    if (existingModal) existingModal.dispose();
    
    userModal = new bootstrap.Modal(modalEl, { backdrop: 'static' });
    userModal.show();
  }

  function closeUserModal() {
    if(userModal) {
       userModal.hide();
       document.querySelectorAll('.modal-backdrop').forEach(el => el.remove());
       document.body.classList.remove('modal-open');
       document.body.style.overflow = '';
       document.body.style.paddingRight = '';
    }
  }

  async function saveUser() {
    let id = document.getElementById('u_id').value;
    let name = document.getElementById('u_name').value;
    let pin = document.getElementById('u_pin').value;
    let role = document.getElementById('u_role').value;
    
    if(!name || pin.length !== 4) return Swal.fire('ข้อมูลไม่ครบ', 'กรุณากรอกชื่อและรหัส PIN 4 หลัก', 'warning');

    let permissions = [];
    if(document.getElementById('perm_all').checked) {
      permissions = ['ADMIN'];
    } else {
      document.querySelectorAll('.perm-cb:checked').forEach(cb => permissions.push(cb.value));
    }
    if(permissions.length === 0) return Swal.fire('สิทธิ์ไม่ถูกต้อง', 'กรุณาเลือกสิทธิ์อย่างน้อย 1 เมนู', 'warning');

    let payload = { name, pin, role, permissions: permissions.join(',') };
    let method = id ? 'PUT' : 'POST';
    let url = id ? `/api/users/${id}` : '/api/users';

    Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
    
    try {
      const response = await fetch(url, { method: method, headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
      const data = await response.json(); 
      
      if(data.status === 'success') {
        Swal.fire({ icon: 'success', title: 'บันทึกสำเร็จ', toast: true, position: 'top-end', timer: 1500, showConfirmButton: false });
        closeUserModal(); 
        loadUsers();
      } else {
        Swal.fire('ข้อผิดพลาด', data.message, 'error'); 
      }
    } catch(e) { Swal.fire('Error', 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้', 'error'); }
  }

  async function deleteUser(id, name) {
    if ((await Swal.fire({ title: `ลบพนักงาน ${name}?`, icon:'warning', showCancelButton: true, confirmButtonColor: '#e11d48' })).isConfirmed) {
      await fetch(`/api/users/${id}`, { method: 'DELETE' });
      loadUsers();
    }
  }
</script>
