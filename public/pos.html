<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>แคชเชียร์และห้องยา - Clinic POS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; }
    .sidebar { width: 250px; background: #1e293b; min-height: 100vh; color: white; }
    .nav-link { color: #cbd5e1; transition: 0.3s; margin-bottom: 5px; border-radius: 8px; }
    .nav-link:hover, .nav-link.active { background: #3b82f6; color: white; }
    .content-area { flex-grow: 1; padding: 20px; height: 100vh; overflow-y: auto; }
    .card { border: none; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
    .queue-item { cursor: pointer; transition: 0.2s; border-left: 4px solid transparent; }
    .queue-item:hover { background-color: #f1f5f9; border-left: 4px solid #3b82f6; }
    .queue-item.active { background-color: #eff6ff; border-left: 4px solid #2563eb; }
    .summary-box { background: linear-gradient(135deg, #1e40af, #3b82f6); color: white; }
  </style>
</head>
<body class="d-flex">

  <!-- เมนูด้านข้าง -->
  <div class="sidebar p-3 d-none d-md-block">
    <div class="text-center mb-4 mt-2">
      <h4 class="fw-bold text-white"><i class="fa-solid fa-hospital-user text-primary"></i> Clinic POS</h4>
    </div>
    <ul class="nav flex-column">
      <li class="nav-item"><a class="nav-link" href="/dashboard"><i class="fa-solid fa-chart-pie me-2"></i> เมนูหลัก</a></li>
      <li class="nav-item"><a class="nav-link" href="/patients"><i class="fa-solid fa-users me-2"></i> ประวัติคนไข้</a></li>
      <li class="nav-item"><a class="nav-link" href="/queue"><i class="fa-solid fa-clipboard-list me-2"></i> ระบบคิว</a></li>
      <li class="nav-item"><a class="nav-link" href="/doctor"><i class="fa-solid fa-stethoscope me-2"></i> ห้องตรวจ</a></li>
      <li class="nav-item"><a class="nav-link active" href="/pos"><i class="fa-solid fa-cash-register me-2"></i> แคชเชียร์/ห้องยา</a></li>
    </ul>
  </div>

  <!-- พื้นที่แคชเชียร์ -->
  <div class="content-area">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h3 class="fw-bold text-dark"><i class="fa-solid fa-cash-register text-warning me-2"></i> แคชเชียร์และห้องยา</h3>
      <button class="btn btn-outline-primary" onclick="loadPendingPayments()"><i class="fa-solid fa-rotate me-1"></i> รีเฟรชคิว</button>
    </div>

    <div class="row g-3 h-100">
      
      <!-- ฝั่งซ้าย: คิวรอชำระเงิน -->
      <div class="col-lg-4">
        <div class="card p-3 h-100 bg-white">
          <h6 class="fw-bold text-dark border-bottom pb-2"><i class="fa-solid fa-users text-primary"></i> คิวรอรับยาและชำระเงิน</h6>
          <div id="queueList" class="mt-2 overflow-auto" style="max-height: 70vh;">
            <!-- รายการคิวจะมาแสดงตรงนี้ -->
            <div class="text-center text-muted mt-4"><i class="fa-solid fa-spinner fa-spin"></i> กำลังโหลด...</div>
          </div>
        </div>
      </div>

      <!-- ฝั่งขวา: รายละเอียดบิล -->
      <div class="col-lg-8">
        <div class="card p-3 h-100 bg-white d-flex flex-column">
          
          <div id="emptyBill" class="text-center text-muted mt-5 pt-5">
            <i class="fa-solid fa-file-invoice-dollar fa-4x mb-3 text-light"></i>
            <h5>เลือกลูกค้าจากคิวเพื่อดูรายละเอียดค่ารักษา</h5>
          </div>

          <div id="billPanel" style="display: none;" class="d-flex flex-column h-100">
            <div class="d-flex justify-content-between border-bottom pb-2 mb-3">
              <div>
                <h5 class="fw-bold text-primary mb-0" id="billPatientName">นายสมชาย ใจดี</h5>
                <small class="text-muted">HN: <span id="billPatientHN">HN-001</span></small>
              </div>
            </div>

            <!-- ตารางรายการยาและบริการ -->
            <div class="flex-grow-1 overflow-auto border rounded mb-3">
              <table class="table table-hover align-middle mb-0 small">
                <thead class="table-light sticky-top">
                  <tr>
                    <th>รายการยา / บริการ</th>
                    <th>วิธีใช้</th>
                    <th class="text-center">จำนวน</th>
                    <th class="text-end">ราคา/หน่วย</th>
                    <th class="text-end pe-3">รวม</th>
                  </tr>
                </thead>
                <tbody id="billTableBody">
                  <!-- รายการจะถูกใส่ที่นี่ -->
                </tbody>
              </table>
            </div>

            <!-- สรุปยอดและรับเงิน -->
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label fw-bold text-muted small">ส่วนลด (บาท)</label>
                <input type="number" id="discountInput" class="form-control text-danger fw-bold" value="0" min="0" onchange="calculateTotal()">
              </div>
              <div class="col-md-6">
                <div class="summary-box p-3 rounded-4 shadow-sm text-end">
                  <span class="d-block small opacity-75">ยอดสุทธิ (Net Total)</span>
                  <h2 class="fw-bold m-0" id="netTotalDisplay">฿0.00</h2>
                </div>
              </div>
              <div class="col-12 mt-3">
                <div class="d-flex gap-2">
                  <button class="btn btn-success flex-fill py-3 fw-bold rounded-3 shadow-sm" onclick="processPayment('เงินสด')">
                    <i class="fa-solid fa-money-bill-wave me-2"></i> รับเงินสด
                  </button>
                  <button class="btn btn-info text-white flex-fill py-3 fw-bold rounded-3 shadow-sm" onclick="processPayment('โอนเงิน')">
                    <i class="fa-solid fa-qrcode me-2"></i> โอนเงิน / QR
                  </button>
                </div>
              </div>
            </div>

          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    let pendingList = [];
    let productPrices = {}; // เก็บราคายาจากคลัง
    let currentBill = null;
    let subTotalAmount = 0;

    // 1. ดึงราคายาและโหลดคิวตอนเปิดหน้า
    document.addEventListener("DOMContentLoaded", () => {
      // ดึงข้อมูลราคายาจากระบบคลัง
      fetch('/api/products').then(res => res.json()).then(data => {
        data.forEach(p => { productPrices[p.id] = p.price; });
        loadPendingPayments();
      });
    });

    // 2. ดึงรายการรอชำระเงิน
    function loadPendingPayments() {
      fetch('/api/pending-payments').then(res => res.json()).then(data => {
        pendingList = data;
        const queueList = document.getElementById('queueList');
        queueList.innerHTML = '';

        if(data.length === 0) {
          queueList.innerHTML = `<div class="text-center text-muted mt-4">ไม่มีคิวรอชำระเงิน</div>`;
          return;
        }

        data.forEach((item, index) => {
          queueList.innerHTML += `
            <div class="queue-item p-3 border-bottom" onclick="selectBill(${index}, this)">
              <div class="fw-bold text-dark">${item.patient_name}</div>
              <div class="text-muted small">HN: ${item.hn_code} | คิวที่: ${item.treatment_id}</div>
            </div>
          `;
        });
      });
    }

    // 3. เลือกบิลเพื่อเตรียมคิดเงิน
    function selectBill(index, element) {
      // จัดการ UI ไฮไลท์แถวที่เลือก
      document.querySelectorAll('.queue-item').forEach(el => el.classList.remove('active'));
      if(element) element.classList.add('active');

      currentBill = pendingList[index];
      document.getElementById('emptyBill').style.display = 'none';
      document.getElementById('billPanel').style.display = 'flex';
      
      document.getElementById('billPatientName').innerText = currentBill.patient_name;
      document.getElementById('billPatientHN').innerText = currentBill.hn_code;
      document.getElementById('discountInput').value = 0;

      // แปลงข้อมูลยาที่หมอสั่ง
      let rxArray = [];
      try { rxArray = JSON.parse(currentBill.prescriptions); } catch(e) {}
      
      const tbody = document.getElementById('billTableBody');
      tbody.innerHTML = '';
      subTotalAmount = 0;

      if(rxArray && rxArray.length > 0) {
        rxArray.forEach(rx => {
          // ดึงราคาจาก productPrices ถ้าไม่มีให้เป็น 0
          const price = productPrices[rx.id] || 0; 
          const lineTotal = price * rx.qty;
          subTotalAmount += lineTotal;

          tbody.innerHTML += `
            <tr>
              <td class="fw-bold">${rx.name}</td>
              <td class="text-muted">${rx.usage || '-'}</td>
              <td class="text-center">${rx.qty}</td>
              <td class="text-end">฿${price.toLocaleString()}</td>
              <td class="text-end pe-3 text-primary fw-bold">฿${lineTotal.toLocaleString()}</td>
            </tr>
          `;
        });
      } else {
        tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted py-3">ไม่มีรายการยา/บริการ</td></tr>`;
      }

      calculateTotal();
    }

    // 4. คำนวณยอดเงินรวม
    function calculateTotal() {
      let discount = parseFloat(document.getElementById('discountInput').value) || 0;
      let netTotal = subTotalAmount - discount;
      if (netTotal < 0) netTotal = 0;
      document.getElementById('netTotalDisplay').innerText = `฿${netTotal.toLocaleString()}`;
    }

    // 5. บันทึกรับชำระเงินและตัดสต็อก
    function processPayment(method) {
      if(!currentBill) return;

      let discount = parseFloat(document.getElementById('discountInput').value) || 0;
      let netTotal = subTotalAmount - discount;
      if (netTotal < 0) netTotal = 0;

      let rxArray = [];
      try { rxArray = JSON.parse(currentBill.prescriptions); } catch(e) {}

      const payload = {
        treatment_id: currentBill.treatment_id,
        patient_id: currentBill.patient_id,
        total_amount: netTotal,
        payment_method: method,
        items: rxArray // ส่ง array ยาไปเพื่อตัดสต็อก
      };

      Swal.fire({
        title: 'ยืนยันรับชำระเงิน',
        text: `รับชำระด้วย ${method} ยอดสุทธิ ฿${netTotal.toLocaleString()}`,
        icon: 'question',
        showCancelButton: true,
        confirmButtonText: 'ยืนยันรับเงิน',
        cancelButtonText: 'ยกเลิก',
        confirmButtonColor: '#22c55e'
      }).then((result) => {
        if (result.isConfirmed) {
          
          fetch('/api/checkout', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          }).then(res => res.json()).then(data => {
            if(data.status === 'success') {
              Swal.fire({ icon: 'success', title: 'ชำระเงินเรียบร้อย!', text: 'ใบเสร็จเลขที่: ' + data.receipt_no, timer: 2000, showConfirmButton: false });
              
              // ซ่อนแผงบิลและรีเฟรชคิว
              document.getElementById('emptyBill').style.display = 'block';
              document.getElementById('billPanel').style.display = 'none';
              currentBill = null;
              loadPendingPayments();
              
            } else {
              Swal.fire('Error', data.message, 'error');
            }
          });

        }
      });
    }
  </script>
</body>
</html>
