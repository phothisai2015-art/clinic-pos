<script>
  var currentPosPatient = null;
  var currentPatientBills = []; // จะเก็บข้อมูลบิลที่จัดกลุ่มแล้ว
  var currentInventory = [];
  var selectedBill = null;
  var selectedMethod = 'CASH';

  // 🌟 โหลดข้อมูลคลังสินค้าไว้เพื่อดูรายละเอียดในโปรโมชั่น (Bundle items)
  async function loadInventoryForPos() {
    try {
      const res = await fetch('/api/inventory');
      const data = await res.json();
      currentInventory = data.data || [];
    } catch(e) {}
  }
  loadInventoryForPos();

  function clearPosSearch() {
    document.getElementById('posSearchInput').value = '';
    currentPosPatient = null;
    currentPatientBills = [];
    selectedBill = null;
    
    document.getElementById('posPatientSummary').style.display = 'none';
    document.getElementById('billBoxesGrid').style.display = 'none';
    document.getElementById('emptyBoxesState').style.display = 'block';
    document.getElementById('billCountBadge').innerText = 'รอค้นหาคนไข้';
    
    resetPaymentPanel();
  }

  // 🌟 1. ค้นหาคนไข้ (แก้ไขให้มี Pop-up ให้เลือกกรณีเจอหลายคน)
  async function searchPosPatientNew() {
    let searchVal = document.getElementById('posSearchInput').value.trim();
    if(!searchVal) return;
    
    Swal.fire({ title: 'กำลังค้นหา...', didOpen: () => Swal.showLoading() });
    try {
      // ค้นหารายชื่อคนไข้ทั้งหมดที่ตรงกับคำค้นหา
      const res = await fetch(`/api/patients?search=${encodeURIComponent(searchVal)}`);
      const data = await res.json();
      
      if (data.data.length === 0) {
        Swal.fire('ไม่พบข้อมูล', 'ไม่พบประวัติคนไข้รายนี้ในระบบ', 'warning');
      } else if (data.data.length === 1) {
        // ถ้าเจอคนเดียว โหลดบิลเลย
        selectPatientForPos(data.data[0].id);
      } else {
        // ถ้าเจอหลายคน เด้งหน้าต่างให้เลือก
        Swal.close();
        let html = '<div class="list-group text-start mt-3 custom-scrollbar" style="max-height:300px; overflow-y:auto;">';
        data.data.forEach(p => {
          html += `<button class="list-group-item list-group-item-action py-3 border-bottom" onclick="selectPatientForPos('${p.id}')">
                     <div class="d-flex w-100 justify-content-between"><h6 class="mb-1 fw-bold text-primary">${p.full_name}</h6><span class="badge bg-light text-dark border">${p.id}</span></div>
                     <small class="text-muted"><i class="fa-solid fa-phone me-1"></i>${p.phone || '-'}</small>
                   </button>`;
        });
        html += '</div>';
        Swal.fire({ title: 'พบหลายรายการ', html: html, showConfirmButton: false, showCloseButton: true });
      }
    } catch(e) { Swal.fire('Error', 'การเชื่อมต่อผิดพลาด', 'error'); }
  }

  // 🌟 ฟังก์ชันดึงประวัติบิลและ "จับกลุ่มยาเข้ากล่องคอร์ส"
  async function selectPatientForPos(hn) {
    Swal.fire({ title: 'กำลังดึงข้อมูลบิล...', didOpen: () => Swal.showLoading() });
    try {
      const res = await fetch(`/api/pos/patient-search?search=${encodeURIComponent(hn)}`);
      const data = await res.json();
      Swal.close();
      
      if (data.status === 'success' && data.patient) {
        currentPosPatient = data.patient;
        let rawBills = data.data || [];
        
        // --- 🌟 ระบบจับกลุ่มบิล (Bill Bundling) ---
        let groupedBoxes = [];
        let medBills = rawBills.filter(b => b.type === 'MEDICINE' || b.type === 'SKINCARE');
        let mainBills = rawBills.filter(b => b.type !== 'MEDICINE' && b.type !== 'SKINCARE');

        // เอายาไปยัดใส่กล่องคอร์สหลักของวันนั้นๆ
        mainBills.forEach(main => {
           main.attached_meds = [];
           // หายาที่สั่งในวันเดียวกัน (bill_date)
           let medsForThisDate = medBills.filter(m => m.bill_date === main.bill_date && !m.attached);
           medsForThisDate.forEach(m => {
              main.attached_meds.push(m);
              m.attached = true; // ทำเครื่องหมายว่ายานี้ถูกจับลงกล่องแล้ว
           });
           groupedBoxes.push(main);
        });

        // ถ้ายามีบิลยาที่ไม่ได้ถูกจับลงกล่อง (เช่น มาซื้อยาอย่างเดียว) ให้สร้างกล่องแยกให้
        medBills.filter(m => !m.attached).forEach(m => {
           m.attached_meds = [];
           groupedBoxes.push(m);
        });

        currentPatientBills = groupedBoxes;
        // ----------------------------------------
        
        document.getElementById('posSearchInput').value = currentPosPatient.id;
        document.getElementById('posPatientSummary').style.display = 'block';
        document.getElementById('p_summary_name').innerText = currentPosPatient.full_name;
        document.getElementById('p_summary_hn').innerText = currentPosPatient.id;
        document.getElementById('p_summary_phone').innerText = currentPosPatient.phone || '-';
        
        renderBillBoxes();
        resetPaymentPanel();
      }
    } catch(e) { Swal.fire('Error', 'การเชื่อมต่อผิดพลาด', 'error'); }
  }

  // 🌟 2. แสดงผลกล่องที่รวมยาเรียบร้อยแล้ว
  function renderBillBoxes() {
    const grid = document.getElementById('billBoxesGrid');
    const emptyState = document.getElementById('emptyBoxesState');
    
    document.getElementById('billCountBadge').innerText = `${currentPatientBills.length} กล่อง`;

    if (currentPatientBills.length === 0) {
      grid.style.display = 'none';
      emptyState.style.display = 'block';
      return;
    }

    grid.style.display = 'flex';
    emptyState.style.display = 'none';
    grid.innerHTML = '';

    currentPatientBills.forEach((bill, index) => {
      // คำนวณยอดรวมของกล่อง (คอร์ส + ยา)
      let boxTotalPrice = bill.total_price + bill.attached_meds.reduce((sum, m) => sum + m.total_price, 0);
      let boxPaidAmount = bill.paid_amount + bill.attached_meds.reduce((sum, m) => sum + m.paid_amount, 0);
      let balance = boxTotalPrice - boxPaidAmount;
      
      let statusClass = '';
      let statusBadge = '';
      let isPayable = true;

      if (balance <= 0) {
        statusClass = 'status-paid bg-light opacity-75';
        statusBadge = '<span class="badge bg-success"><i class="fa-solid fa-check-circle me-1"></i> จ่ายครบแล้ว</span>';
        isPayable = false;
      } else if (boxPaidAmount > 0) {
        statusClass = 'status-partial';
        statusBadge = '<span class="badge bg-warning text-dark"><i class="fa-solid fa-clock-rotate-left me-1"></i> จ่ายบางส่วน</span>';
      } else {
        statusClass = 'status-unpaid';
        statusBadge = '<span class="badge bg-danger"><i class="fa-solid fa-circle-exclamation me-1"></i> ค้างชำระ</span>';
      }

      let typeIcon = bill.type === 'PROMOTION' ? 'fa-gift text-primary' : 'fa-wand-magic-sparkles text-info';
      
      // แสดงรายการยาในกล่องเล็กๆ ใต้ชื่อคอร์ส
      let medsHtml = '';
      if (bill.attached_meds.length > 0) {
        medsHtml = '<div class="mt-2 pt-2 border-top border-light">';
        bill.attached_meds.forEach(m => {
           medsHtml += `<div class="small text-muted mb-1"><i class="fa-solid fa-pills me-1 text-danger opacity-75"></i> ${m.item_name} (+฿${m.total_price.toLocaleString()})</div>`;
        });
        medsHtml += '</div>';
      }

      grid.innerHTML += `
        <div class="col-md-6">
          <div class="bill-card ${statusClass}" id="bill_box_${index}" onclick="${isPayable ? `selectBillToPay(${index})` : 'showPaidAlert()'}">
            <div class="bill-card-header">
              <span class="small fw-bold text-muted">บิล #${bill.id}</span>
              ${statusBadge}
            </div>
            <div class="bill-card-body pb-2">
              <h6 class="fw-bold text-dark mb-0"><i class="fa-solid ${typeIcon} me-2"></i> ${bill.item_name}</h6>
              ${medsHtml}
            </div>
            <div class="px-4 pb-2">
              <div class="d-flex justify-content-between align-items-center mb-1 small text-muted">
                <span>ราคาเต็มรวม:</span> <span>฿${boxTotalPrice.toLocaleString()}</span>
              </div>
              <div class="d-flex justify-content-between align-items-center mb-1 small text-success fw-bold">
                <span>ชำระแล้วรวม:</span> <span>฿${boxPaidAmount.toLocaleString()}</span>
              </div>
            </div>
            <div class="bill-card-footer d-flex justify-content-between align-items-center">
              <span class="fw-bold text-secondary small">ยอดที่ต้องจ่าย:</span>
              <span class="fw-bold fs-5 ${balance > 0 ? 'text-danger' : 'text-muted'}">฿${balance > 0 ? balance.toLocaleString() : '0.00'}</span>
            </div>
          </div>
        </div>`;
    });
  }

  function showPaidAlert() {
    Swal.fire({ icon: 'info', title: 'รายการนี้ชำระครบแล้ว', text: 'ไม่มียอดค้างชำระสำหรับกล่องนี้', toast: true, position: 'top-end', timer: 2000, showConfirmButton: false });
  }

  // 🌟 3. โหลดรายละเอียดกล่องที่เลือกลงแถบชำระเงินขวามือ
  function selectBillToPay(index) {
    document.querySelectorAll('.bill-card').forEach(card => card.classList.remove('selected'));
    document.getElementById(`bill_box_${index}`).classList.add('selected');

    selectedBill = currentPatientBills[index];
    
    let boxTotalPrice = selectedBill.total_price + selectedBill.attached_meds.reduce((sum, m) => sum + m.total_price, 0);
    let boxPaidAmount = selectedBill.paid_amount + selectedBill.attached_meds.reduce((sum, m) => sum + m.paid_amount, 0);
    let balance = boxTotalPrice - boxPaidAmount;

    document.getElementById('paymentEmptyState').style.display = 'none';
    document.getElementById('paymentActiveState').style.display = 'flex';

    document.getElementById('pay_bill_id').innerText = `บิล #${selectedBill.id}`;
    document.getElementById('pay_item_name').innerText = selectedBill.item_name;
    document.getElementById('pay_item_type').innerText = selectedBill.type === 'PROMOTION' ? 'โปรโมชั่น / เซ็ต' : 'คอร์สเดี่ยว / บริการ';
    document.getElementById('pay_item_full_price').innerText = `฿${boxTotalPrice.toLocaleString()}`;
    
    document.getElementById('pay_already_paid').innerText = `฿${boxPaidAmount.toLocaleString()}`;
    document.getElementById('pay_balance').innerText = `฿${balance.toLocaleString()}`;
    
    let inputEl = document.getElementById('pay_input_amount');
    inputEl.value = balance;
    inputEl.setAttribute('max', balance);
    
    // ดึงรายละเอียดโปรโมชั่น (แถมอะไรบ้าง)
    let prodDef = currentInventory.find(p => p.id === selectedBill.product_id);
    let detailsHtml = '';
    if (prodDef && prodDef.type === 'PROMOTION' && prodDef.bundle_items) {
       try {
         let items = JSON.parse(prodDef.bundle_items);
         detailsHtml += '<div class="fw-bold text-primary mt-3 mb-1"><i class="fa-solid fa-list-check me-1"></i> รายการในเซ็ตโปรโมชั่น:</div>';
         items.forEach(i => {
           detailsHtml += `<div class="d-flex justify-content-between pb-1 border-bottom border-light"><span>- ${i.name}</span> <span class="fw-bold">x${i.qty}</span></div>`;
         });
       } catch(e) {}
    }

    // แสดงรายละเอียดบิลยาที่รวมมาด้วย
    if (selectedBill.attached_meds && selectedBill.attached_meds.length > 0) {
      detailsHtml += '<div class="fw-bold text-danger mt-3 mb-1"><i class="fa-solid fa-pills me-1"></i> รายการยาที่สั่งจ่ายร่วมด้วย:</div>';
      selectedBill.attached_meds.forEach(m => {
         let mBalance = m.total_price - m.paid_amount;
         let mStatus = mBalance <= 0 ? '(จ่ายแล้ว)' : '';
         detailsHtml += `<div class="d-flex justify-content-between pb-1 border-bottom border-light">
                           <span>- ${m.item_name} <small class="text-success">${mStatus}</small></span> 
                           <span class="fw-bold">฿${m.total_price.toLocaleString()}</span>
                         </div>`;
      });
    }

    document.getElementById('pay_item_details').innerHTML = detailsHtml;
    calculatePreview();
  }

  function calculatePreview() {
    let inputEl = document.getElementById('pay_input_amount');
    let val = parseFloat(inputEl.value) || 0;
    let max = parseFloat(inputEl.getAttribute('max')) || 0;
    
    if (val > max) { val = max; inputEl.value = max; }
    if (val < 0) { val = 0; inputEl.value = 0; }
    
    document.getElementById('pay_btn_amount').innerText = `฿${val.toLocaleString()}`;
  }

  function selectMethodNew(method) {
    selectedMethod = method;
    document.querySelectorAll('.pay-method-btn').forEach(btn => btn.classList.remove('selected')); 
    if(method === 'CASH') document.getElementById('pay_cash').classList.add('selected');
    if(method === 'QR') document.getElementById('pay_qr').classList.add('selected');
    if(method === 'CREDIT') document.getElementById('pay_credit').classList.add('selected');
  }

  function resetPaymentPanel() {
    selectedBill = null;
    document.getElementById('paymentEmptyState').style.display = 'flex';
    document.getElementById('paymentActiveState').style.display = 'none';
    document.querySelectorAll('.bill-card').forEach(card => card.classList.remove('selected'));
  }

  // 🌟 4. ยืนยันการรับชำระเงิน (กระจายยอดจ่ายให้บิลหลักและบิลยาอัตโนมัติ)
  async function submitSinglePayment() {
    if (!selectedBill || !currentPosPatient) return;
    
    let payAmount = parseFloat(document.getElementById('pay_input_amount').value) || 0;
    if (payAmount <= 0) return Swal.fire('ข้อมูลไม่ถูกต้อง', 'กรุณาระบุยอดชำระที่มากกว่า 0', 'warning');

    Swal.fire({
      title: 'ยืนยันรับชำระเงิน?',
      html: `รายการ: <b>${selectedBill.item_name} ${selectedBill.attached_meds.length > 0 ? '(รวมยา)' : ''}</b><br>ยอดชำระ: <b class="text-success fs-5">฿${payAmount.toLocaleString()}</b><br>ช่องทาง: <b>${selectedMethod}</b>`,
      icon: 'question',
      showCancelButton: true,
      confirmButtonText: 'ยืนยัน',
      cancelButtonText: 'ยกเลิก',
      confirmButtonColor: '#3b82f6'
    }).then(async (result) => {
      if (result.isConfirmed) {
        Swal.fire({ title: 'กำลังบันทึกข้อมูล...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
        
        let remainingPay = payAmount;
        let paymentsPayload = [];

        // 1. นำยอดไปตัดบิลคอร์สหลักก่อน
        let mainBalance = selectedBill.total_price - selectedBill.paid_amount;
        let payForMain = Math.min(mainBalance, remainingPay);
        if (payForMain > 0) {
            paymentsPayload.push({ bill_id: selectedBill.id, pay_amount: payForMain, payment_method: selectedMethod });
            remainingPay -= payForMain;
        }

        // 2. ถ้าเงินยังเหลือ นำยอดไปทยอยตัดบิลยาทุกตัวในกล่อง
        if (selectedBill.attached_meds && selectedBill.attached_meds.length > 0) {
            for (let m of selectedBill.attached_meds) {
                if (remainingPay <= 0) break;
                let mBalance = m.total_price - m.paid_amount;
                let payForMed = Math.min(mBalance, remainingPay);
                if (payForMed > 0) {
                    paymentsPayload.push({ bill_id: m.id, pay_amount: payForMed, payment_method: selectedMethod });
                    remainingPay -= payForMed;
                }
            }
        }
        
        // ส่ง Payload เป็น Array ไปให้ API ทำการบันทึกลง Database
        let payload = {
          sales_rep: '-',
          payment_method: selectedMethod,
          payments: paymentsPayload,
          new_items: []
        };

        try {
          const res = await fetch('/api/pos/pay/' + currentPosPatient.id, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const data = await res.json();

          if (data.status === 'success') {
            Swal.fire({ icon: 'success', title: 'รับชำระเงินสำเร็จ!', text: `อัปเดตประวัติของ ${currentPosPatient.full_name} แล้ว`, timer: 2000, showConfirmButton: false });
            // โหลดกล่องใหม่ เพื่ออัปเดตตัวเลขแบบ Realtime
            selectPatientForPos(currentPosPatient.id);
          } else {
            Swal.fire('Error', data.message || 'บันทึกล้มเหลว', 'error');
          }
        } catch(e) {
          Swal.fire('Error', 'ไม่สามารถเชื่อมต่อระบบได้', 'error');
        }
      }
    });
  }
</script>
