<style>
  /* 🌟 Compact POS UI Styles (ย่อขนาดลง) */
  .search-hero { background: linear-gradient(135deg, #0f172a, #1e293b); color: #fff; border-radius: 15px; padding: 15px 20px; margin-bottom: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
  
  .bill-card { border: 2px solid #e2e8f0; border-radius: 12px; background-color: #ffffff; cursor: pointer; transition: all 0.2s ease; height: 100%; display: flex; flex-direction: column; overflow: hidden; }
  .bill-card:hover { border-color: #93c5fd; transform: translateY(-3px); box-shadow: 0 8px 15px rgba(0,0,0,0.05); }
  .bill-card.selected { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); }
  
  /* ลดขนาดช่องว่างต่างๆ ในกล่อง */
  .bill-card-header { padding: 10px 15px; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; }
  .bill-card-body { padding: 12px 15px; flex-grow: 1; }
  .bill-card-body h6 { font-size: 0.95rem !important; }
  .bill-card-footer { padding: 10px 15px; background-color: #f8fafc; border-top: 1px solid #f1f5f9; }

  .status-paid { border-left: 4px solid #10b981 !important; }
  .status-partial { border-left: 4px solid #f59e0b !important; }
  .status-unpaid { border-left: 4px solid #ef4444 !important; }

  .payment-panel { background: #ffffff; border-radius: 15px; padding: 15px; border: 1px solid #e2e8f0; box-shadow: 0 10px 25px rgba(0,0,0,0.03); height: 100%; display: flex; flex-direction: column; }
  .payment-panel h5 { font-size: 1rem !important; }
  .total-display { font-size: 1.8rem; font-weight: 800; color: #0f172a; text-align: right; line-height: 1; margin: 5px 0; }
  
  .pay-method-btn { border: 2px solid #e2e8f0; border-radius: 10px; background: #fff; color: #64748b; font-weight: bold; transition: all 0.2s ease; padding: 8px; font-size: 0.85rem; }
  .pay-method-btn:hover { border-color: #93c5fd; color: #3b82f6; background: #f8fafc; }
  .pay-method-btn.selected { border-color: #3b82f6; background: #3b82f6; color: #fff; box-shadow: 0 4px 10px rgba(59,130,246,0.3); }

  .custom-scrollbar::-webkit-scrollbar { width: 5px; }
  .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
  .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
  
  /* บังคับลดขนาด Bootstrap Padding พื้นฐานในหน้านี้ */
  .p-4 { padding: 1rem !important; }
  .py-4 { padding-top: 1rem !important; padding-bottom: 1rem !important; }
  
  /* ========================================================= */
  /* 🌙 แก้ไขโหมดมืดหน้า POS ( SweetAlert2 & พื้นหลัง) */
  /* ========================================================= */

  /* 1. ป๊อปอัปแจ้งเตือน ยืนยัน และโหลดข้อมูล (SweetAlert2) */
  body.dark-theme .swal2-popup {
    background-color: #1e293b !important;
    color: #f8fafc !important;
    border: 1px solid #334155 !important;
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6) !important;
  }
  body.dark-theme .swal2-title,
  body.dark-theme .swal2-html-container,
  body.dark-theme .swal2-content {
    color: #f8fafc !important;
  }
  body.dark-theme .swal2-html-container b,
  body.dark-theme .swal2-html-container strong {
    color: #60a5fa !important;
  }

  /* 2. พื้นหลังกล่องรายการบิล/คอร์ส ฝั่งซ้าย */
  body.dark-theme .col-lg-7 .bg-white {
    background-color: #1e293b !important;
    border-color: #334155 !important;
  }
  body.dark-theme #emptyBoxesState .bg-light {
    background-color: #0f172a !important;
  }

  /* 3. กล่องประวัติ EMR ที่แสดงแทรกในแผงรายละเอียดฝั่งขวา */
  body.dark-theme #pay_item_details .bg-white {
    background-color: #0f172a !important;
    border-color: #0284c7 !important;
    color: #f8fafc !important;
  }
  body.dark-theme #pay_item_details .text-dark {
    color: #f8fafc !important;
  }
  body.dark-theme #pay_item_details .text-muted {
    color: #cbd5e1 !important;
  }

  /* 4. ป๊อปอัปรายชื่อคนไข้กรณีค้นหาเจอหลายคน (List Group) */
  body.dark-theme .swal2-html-container .list-group-item {
    background-color: #0f172a !important;
    border-color: #334155 !important;
    color: #f8fafc !important;
  }
  body.dark-theme .swal2-html-container .list-group-item:hover {
    background-color: #1e293b !important;
  }
  body.dark-theme .swal2-html-container .list-group-item .bg-light {
    background-color: #1e293b !important;
    color: #f8fafc !important;
    border-color: #475569 !important;
  }
  /* 5. ป้ายแสดงจำนวนกล่องบิล/คอร์ส (#billCountBadge) */
  body.dark-theme #billCountBadge {
    background-color: #0f172a !important; /* เปลี่ยนพื้นหลังเป็นสีเข้ม */
    color: #f8fafc !important; /* เปลี่ยนตัวหนังสือเป็นสีสว่าง */
    border-color: #334155 !important; /* เปลี่ยนสีกรอบ */
  }
  /* 📱 ปรับปุ่มปิดหน้า POS ให้แสดงเฉพาะไอคอน X ในจอมือถือ */
  @media (max-width: 768px) {
    button[onclick="closeModule()"] {
      width: 38px !important;
      height: 38px !important;
      padding: 0 !important;
      border-radius: 50% !important;
      display: inline-flex !important;
      justify-content: center;
      align-items: center;
    }
    button[onclick="closeModule()"] span {
      display: none !important; /* ซ่อนข้อความ ปิดหน้านี้ ในมือถือ */
    }
    button[onclick="closeModule()"] i {
      font-size: 1.2rem !important;
      margin: 0 !important;
    }
  }

  /* 🌟 แสงออร่าด้านหลัง (Ambient Orbs) */
  .ambient-orb { position: fixed; border-radius: 50%; filter: blur(80px); z-index: -1; opacity: 0.5; animation: floatOrb 20s infinite alternate ease-in-out; pointer-events: none; }
  .orb-1 { width: 400px; height: 400px; background: #bae6fd; top: -100px; left: -100px; }
  .orb-2 { width: 450px; height: 450px; background: #ddd6fe; bottom: -100px; right: -50px; animation-delay: -5s; }
  .orb-3 { width: 300px; height: 300px; background: #fbcfe8; top: 30%; left: 30%; animation-delay: -10s; opacity: 0.3; }
  
  body.dark-theme .orb-1 { background: #1e3a8a; opacity: 0.3; }
  body.dark-theme .orb-2 { background: #312e81; opacity: 0.4; }
  body.dark-theme .orb-3 { background: #4c1d95; opacity: 0.3; }
  
  @keyframes floatOrb { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(30px, 50px) scale(1.1); } }

  /* ปรับพื้นหลังกล่องให้เป็นกระจกฝ้าเพื่อให้เห็นแสงออร่า */
  .bg-white, .payment-panel, .bill-card {
      background-color: rgba(255, 255, 255, 0.85) !important;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
  }
  body.dark-theme .bg-white, 
  body.dark-theme .payment-panel, 
  body.dark-theme .bill-card {
      background-color: rgba(30, 41, 59, 0.85) !important;
  }
</style>

<!-- 🌟 Ambient Orbs Background -->
<div class="ambient-orb orb-1"></div>
<div class="ambient-orb orb-2"></div>
<div class="ambient-orb orb-3"></div>

<div class="container-fluid py-2 px-lg-4" style="max-width: 1600px; height: 100vh; display: flex; flex-direction: column; position: relative; z-index: 1;">
  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center mb-2">
    <h4 class="fw-bold text-success m-0"><i class="fa-solid fa-cash-register me-2"></i> ระบบชำระเงิน (POS)</h4>
    <button class="btn btn-outline-danger fw-bold rounded-pill px-4 shadow-sm" onclick="closeModule()">
      <i class="fa-solid fa-xmark me-2"></i><span>ปิดหน้านี้</span>
    </button>
  </div>

  <!-- 🔍 1. กล่องค้นหา (บีบขนาด) -->
  <div class="search-hero">
    <div class="row align-items-center">
      <div class="col-md-5">
        <div class="fw-bold text-white mb-2 fs-6"><i class="fa-solid fa-magnifying-glass me-2 text-info"></i> ค้นหาคนไข้เพื่อชำระเงิน</div>
        <div class="input-group shadow-sm rounded-3 overflow-hidden border-0">
          <input type="text" id="posSearchInput" class="form-control border-0 bg-white" placeholder="พิมพ์ชื่อ, HN หรือเบอร์โทร..." onkeypress="if(event.key === 'Enter') searchPosPatientNew()">
          <button class="btn btn-primary px-3 fw-bold" onclick="searchPosPatientNew()">ค้นหา</button>
        </div>
      </div>
      
      <div class="col-md-7 ps-md-4 mt-3 mt-md-0" id="posPatientSummary" style="display: none; border-left: 1px solid rgba(255,255,255,0.2);">
        <div class="text-white opacity-75" style="font-size: 0.75rem;">กำลังทำรายการให้:</div>
        <div class="d-flex justify-content-between align-items-start">
          <div>
            <h5 class="fw-bold text-white m-0 mb-1" id="p_summary_name">-</h5>
            <div class="d-flex gap-3 text-white opacity-75 small">
              <span><i class="fa-solid fa-address-card me-1 text-info"></i> <span id="p_summary_hn">-</span></span>
              <span><i class="fa-solid fa-phone me-1 text-info"></i> <span id="p_summary_phone">-</span></span>
            </div>
          </div>
          <div class="d-flex gap-2 mt-1">
            <button class="btn btn-sm btn-info text-white rounded-pill px-3 shadow-sm fw-bold" style="font-size: 0.75rem;" onclick="openPaymentHistoryModal()"><i class="fa-solid fa-clock-rotate-left me-1"></i> ประวัติจ่ายเงิน</button>
            <button class="btn btn-sm btn-outline-light rounded-pill px-3" style="font-size: 0.75rem;" onclick="clearPosSearch()">ล้างข้อมูล</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="row g-3 flex-grow-1" style="min-height: 0;">
    
    <!-- 📦 2. ฝั่งซ้าย: กล่องโปรโมชั่นและคอร์ส -->
    <div class="col-lg-7 col-md-6 h-100 d-flex flex-column">
      <div class="bg-white p-3 rounded-3 shadow-sm border h-100 flex-grow-1 custom-scrollbar" style="overflow-y: auto;">
        
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h6 class="fw-bold m-0 text-dark"><i class="fa-solid fa-boxes-stacked me-2 text-primary"></i> รายการบิล / คอร์ส</h6>
          <span class="badge bg-light text-dark border px-2 py-1" id="billCountBadge">รอค้นหาคนไข้</span>
        </div>

        <div id="emptyBoxesState" class="text-center py-4 mt-4">
          <div class="bg-light rounded-circle d-flex justify-content-center align-items-center mx-auto mb-3" style="width: 70px; height: 70px;">
            <i class="fa-solid fa-box-open fa-lg text-muted opacity-50"></i>
          </div>
          <h6 class="fw-bold text-secondary">ยังไม่มีรายการ</h6>
        </div>

        <div class="row g-2" id="billBoxesGrid" style="display: none;"></div>
      </div>
    </div>

    <!-- 💳 3. ฝั่งขวา: แผงรับชำระเงิน -->
    <div class="col-lg-5 col-md-6 h-100">
      <div class="payment-panel position-relative">
        
        <div id="paymentActiveState" style="display: flex; flex-direction: column; height: 100%;">
          
          <div class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-2">
            <h6 class="fw-bold text-primary m-0"><i class="fa-solid fa-file-invoice-dollar me-2"></i> สรุปยอดชำระ</h6>
            <span class="badge bg-light text-dark border" id="pay_bill_id">-</span>
          </div>

          <!-- 🌟 รายละเอียดคอร์ส/โปร -->
          <div class="bg-light p-2 rounded-3 border mb-3 d-flex flex-column flex-grow-1" style="min-height: 0;">
            <div class="fw-bold text-dark fs-6 mb-1" id="pay_item_name">ยังไม่ได้เลือกรายการ</div>
            <div class="d-flex justify-content-between text-muted small mb-1" style="font-size: 0.8rem;">
              <span>ประเภท:</span><span id="pay_item_type" class="fw-bold">-</span>
            </div>
            <div class="d-flex justify-content-between text-muted small border-bottom pb-1 mb-1" style="font-size: 0.8rem;">
              <span>ราคาเต็มตามแพคเกจ:</span><span id="pay_item_full_price" class="fw-bold text-dark">฿0.00</span>
            </div>
            <div id="pay_item_details" class="text-secondary mt-1 custom-scrollbar flex-grow-1" style="font-size: 0.8rem; overflow-y: auto;"></div>
          </div>

          <!-- 4. ส่วนคำนวณและแบ่งจ่าย -->
          <div>
            <div class="d-flex justify-content-between align-items-center mb-1">
              <span class="fw-bold text-secondary small">ยอดชำระแล้วรวม:</span>
              <span class="fw-bold text-success" id="pay_already_paid">฿0.00</span>
            </div>
            <div class="d-flex justify-content-between align-items-center mb-2 p-2 bg-danger bg-opacity-10 border border-danger rounded-2">
              <span class="fw-bold text-danger small">ยอดคงเหลือ:</span>
              <span class="fw-bold text-danger fs-5" id="pay_balance">฿0.00</span>
            </div>

            <div class="mb-3">
              <label class="fw-bold text-dark mb-1 small">ระบุยอดชำระรอบนี้ (฿)</label>
              <input type="number" id="pay_input_amount" class="form-control text-end fw-bold text-primary border-primary shadow-sm" value="0" min="0" oninput="calculatePreview()" disabled>
            </div>
          </div>

          <!-- วิธีชำระ & ปุ่มยืนยัน -->
          <div class="border-top pt-3">
            <label class="fw-bold text-muted mb-1" style="font-size: 0.8rem;">วิธีชำระเงิน:</label>
            <div class="d-flex gap-2 mb-3">
              <button class="btn pay-method-btn flex-grow-1 selected" id="pay_cash" onclick="selectMethodNew('CASH')"><i class="fa-solid fa-money-bill-wave d-block fs-6 mb-1"></i> เงินสด</button>
              <button class="btn pay-method-btn flex-grow-1" id="pay_qr" onclick="selectMethodNew('QR')"><i class="fa-solid fa-qrcode d-block fs-6 mb-1"></i> โอน/QR</button>
              <button class="btn pay-method-btn flex-grow-1" id="pay_credit" onclick="selectMethodNew('CREDIT')"><i class="fa-solid fa-credit-card d-block fs-6 mb-1"></i> เครดิต</button>
            </div>
            
            <button id="pay_submit_btn" class="btn btn-secondary w-100 py-2 rounded-3 fw-bold shadow-sm" onclick="submitSinglePayment()" disabled>
              <i class="fa-solid fa-check-circle me-1"></i> รับชำระเงิน <span id="pay_btn_amount">฿0.00</span>
            </button>
          </div>

        </div>
      </div>
    </div>

  </div>
</div>

<!-- 🌟 Modal ดูประวัติการชำระเงิน -->
<div class="modal fade" id="paymentHistoryModal" tabindex="-1" aria-hidden="true" style="z-index: 1060;">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content rounded-4 border-0 shadow-lg">
      <div class="modal-header bg-info text-white rounded-top-4 py-3">
        <h5 class="modal-title fw-bold m-0"><i class="fa-solid fa-receipt me-2"></i> ประวัติการชำระเงิน: <span id="paymentHistoryModalName"></span></h5>
        <button type="button" class="btn-close btn-close-white" onclick="closePaymentHistoryModal()"></button>
      </div>
      <div class="modal-body p-4 bg-light">
        <!-- ตัวกรอง -->
        <div class="mb-4 bg-white p-3 rounded-3 shadow-sm border border-info">
          <label class="fw-bold text-info small mb-2"><i class="fa-solid fa-filter me-1"></i> ตัวกรองโปรโมชั่น / คอร์ส</label>
          <select id="paymentHistoryFilter" class="form-select border-info bg-light fw-bold text-dark" onchange="renderPaymentHistory()">
            <option value="ALL">-- ดูประวัติการชำระเงินทั้งหมด --</option>
          </select>
        </div>
        <!-- รายการชำระเงิน -->
        <div class="custom-scrollbar bg-white p-3 border rounded-4 shadow-sm" id="paymentHistoryList" style="height: 50vh; overflow-y: auto;">
          <div class="text-center py-4 text-muted">กำลังโหลดข้อมูล...</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  var currentPosPatient = null;
  var currentPatientBills = [];
  var currentPatientEmr = []; // 🌟 เพิ่มตัวแปรเก็บประวัติ EMR
  var currentInventory = [];
  var selectedBill = null;
  var selectedMethod = 'CASH';
  var allPatientBillsHistory = []; // 🌟 เพิ่มตัวแปรใหม่เก็บประวัติทั้งหมด

  // โหลดคลังสินค้า
  async function loadInventoryForPos() {
    try {
      const res = await fetch('/api/inventory');
      const data = await res.json();
      currentInventory = data.data || [];
    } catch(e) {}
  }
  loadInventoryForPos();

  function clearPosSearch() {
    document.getElementById('posSearchInput').value = '';
    currentPosPatient = null;
    currentPatientBills = [];
    selectedBill = null;
    
    document.getElementById('posPatientSummary').style.display = 'none';
    document.getElementById('billBoxesGrid').style.display = 'none';
    document.getElementById('emptyBoxesState').style.display = 'block';
    document.getElementById('billCountBadge').innerText = 'รอค้นหา';
    resetPaymentPanel();
  }

  async function searchPosPatientNew() {
    let searchVal = document.getElementById('posSearchInput').value.trim();
    if(!searchVal) return;
    
    Swal.fire({ title: 'กำลังค้นหา...', didOpen: () => Swal.showLoading() });
    try {
      const res = await fetch(`/api/patients?search=${encodeURIComponent(searchVal)}`);
      const data = await res.json();
      
      if (data.data.length === 0) {
        Swal.fire('ไม่พบข้อมูล', 'ไม่พบประวัติ', 'warning');
      } else if (data.data.length === 1) {
        selectPatientForPos(data.data[0].id);
      } else {
        Swal.close();
        let html = '<div class="list-group text-start mt-3 custom-scrollbar" style="max-height:250px; overflow-y:auto;">';
        data.data.forEach(p => {
          html += `<button class="list-group-item list-group-item-action py-2 border-bottom" onclick="selectPatientForPos('${p.id}')">
                     <div class="d-flex w-100 justify-content-between"><span class="fw-bold text-primary">${p.full_name}</span><span class="badge bg-light text-dark border">${p.id}</span></div>
                   </button>`;
        });
        html += '</div>';
        Swal.fire({ title: 'พบหลายรายการ', html: html, showConfirmButton: false, showCloseButton: true });
      }
    } catch(e) {}
  }

// 🌟 ฟังก์ชันดึงประวัติบิลและจับกลุ่ม (อัปเดตให้ดึงบิลทุกวันและเช็คแท็กชื่อเป๊ะๆ 100%)
  async function selectPatientForPos(hn) {
    Swal.fire({ title: 'กำลังดึงบิล...', didOpen: () => Swal.showLoading() });
    try {
      // 🌟 อัปเดต: ดึงประวัติ EMR มาด้วยเพื่อดูว่าทำอะไรไปบ้างในแต่ละครั้ง
      const [pRes, bRes, emrRes] = await Promise.all([
          fetch(`/api/patients/${hn}`),
          fetch(`/api/pos/bill/${hn}`),
          fetch(`/api/emr/${hn}`)
      ]);
      const pData = await pRes.json();
      const bData = await bRes.json();
      const emrData = await emrRes.json();
      
      currentPatientEmr = emrData.status === 'success' ? emrData.data : []; // 🌟 เก็บประวัติลงตัวแปร
      Swal.close();

      if (pData.status === 'success' && pData.data) {
        currentPosPatient = pData.data;
        let rawBills = bData.data || []; // บิลทั้งหมดทุกวัน
		allPatientBillsHistory = rawBills; // 🌟 เก็บประวัติบิลลงตัวแปรสำหรับป๊อปอัป

        // --- 🌟 ระบบจับกลุ่มบิลแบบเจาะจงคอร์ส (แม่นยำ 100%) ---
        let groupedBoxes = [];
        let medBills = rawBills.filter(b => b.type === 'MEDICINE' || b.type === 'SKINCARE');
        let mainBills = rawBills.filter(b => b.type !== 'MEDICINE' && b.type !== 'SKINCARE');

        mainBills.forEach(main => {
           main.attached_meds = [];
           // ค้นหายาที่มีคำว่า (ในคอร์ส: ชื่อโปรเป๊ะๆ) เท่านั้น ไม่เอาวันที่มาเกี่ยวแล้ว
           let medsForThisMain = medBills.filter(m => {
             if (m.attached) return false;
             let tagMatch = m.item_name.match(/\(ในคอร์ส:\s*(.*?)\)/);
             if (tagMatch && tagMatch[1].trim() === main.item_name.trim()) return true;
             return false;
           });

           medsForThisMain.forEach(m => {
              main.attached_meds.push(m);
              m.attached = true; 
           });
           groupedBoxes.push(main);
        });

        // ถ้ายามีหลงเหลือ (ไม่ได้สั่งในคอร์ส หรือซื้อแยก) ให้แยกกล่องต่างหาก
        medBills.filter(m => !m.attached).forEach(m => {
           m.attached_meds = [];
           groupedBoxes.push(m);
        });

        // 🌟 เรียงลำดับตามเวลาสร้างบิล (id เก่าไปใหม่) และรันเลข 1, 2, 3... ให้คนไข้คนนี้
        groupedBoxes.sort((a, b) => a.id - b.id);
        groupedBoxes.forEach((box, i) => box.display_id = i + 1);

        // 🌟 เอาตัวกรองที่ซ่อนบิลจ่ายแล้วออก เพื่อให้โชว์บิลทั้งหมด
        currentPatientBills = groupedBoxes;
        
        // 🌟 เรียงลำดับ: ให้กล่องที่ "ค้างชำระ" อยู่ด้านบนสุด และ "จ่ายครบแล้ว" ไปอยู่ล่างสุด
        currentPatientBills.sort((a, b) => {
           let aTotal = a.total_price + a.attached_meds.reduce((sum, m) => sum + m.total_price, 0);
           let aPaid = a.paid_amount + a.attached_meds.reduce((sum, m) => sum + m.paid_amount, 0);
           let aBalance = aTotal - aPaid;

           let bTotal = b.total_price + b.attached_meds.reduce((sum, m) => sum + m.total_price, 0);
           let bPaid = b.paid_amount + b.attached_meds.reduce((sum, m) => sum + m.paid_amount, 0);
           let bBalance = bTotal - bPaid;

           if (aBalance > 0 && bBalance <= 0) return -1;
           if (aBalance <= 0 && bBalance > 0) return 1;
           return 0; 
        });
        
        document.getElementById('posSearchInput').value = currentPosPatient.id;
        document.getElementById('posPatientSummary').style.display = 'block';
        document.getElementById('p_summary_name').innerText = currentPosPatient.full_name;
        document.getElementById('p_summary_hn').innerText = currentPosPatient.id;
        document.getElementById('p_summary_phone').innerText = currentPosPatient.phone || '-';
        
        renderBillBoxes();
        
        // 🌟 Auto-Select: เลือกลายการแรกที่ "ค้างชำระ" ให้ทันที
        if (currentPatientBills.length > 0) {
          let firstPayable = currentPatientBills.findIndex(b => {
            let boxTotal = b.total_price + b.attached_meds.reduce((sum, m) => sum + m.total_price, 0);
            let boxPaid = b.paid_amount + b.attached_meds.reduce((sum, m) => sum + m.paid_amount, 0);
            return (boxTotal - boxPaid) > 0;
          });
          
          if(firstPayable !== -1) {
            selectBillToPay(firstPayable);
          } else {
            selectBillToPay(0);
          }
        } else {
          resetPaymentPanel();
        }

      }
    } catch(e) { Swal.fire('Error', 'การเชื่อมต่อผิดพลาด', 'error'); }
  }

      }

      let medsHtml = '';

        medsHtml = '<div class="mt-1 pt-1 border-top border-light">';

           let cleanMedName = m.item_name.split(' (ในคอร์ส:')[0];
           medsHtml += `<div class="text-muted mb-0" style="font-size:0.75rem;"><i class="fa-solid fa-pills me-1 text-danger opacity-75"></i> ${cleanMedName} (+฿${m.total_price.toLocaleString()})</div>`;
        });

      grid.innerHTML += `

            <div class="bill-card-header">

            </div>
            <div class="bill-card-body pb-1">
              <h6 class="fw-bold text-dark mb-0" style="font-size: 0.9rem;"><i class="fa-solid ${typeIcon} me-1"></i> ${bill.item_name}</h6>
              ${medsHtml}
            </div>
            <div class="px-3 pb-2" style="font-size: 0.75rem;">
              <div class="d-flex justify-content-between text-muted"><span>ราคาเต็ม:</span> <span>฿${boxTotalPrice.toLocaleString()}</span></div>
              <div class="d-flex justify-content-between text-success fw-bold"><span>ชำระแล้ว:</span> <span>฿${boxPaidAmount.toLocaleString()}</span></div>
            </div>
            <div class="bill-card-footer d-flex justify-content-between align-items-center">
              <span class="fw-bold text-secondary" style="font-size: 0.8rem;">ต้องจ่าย:</span>
              <span class="fw-bold ${balance > 0 ? 'text-danger' : 'text-muted'}">฿${balance > 0 ? balance.toLocaleString() : '0'}</span>
            </div>

  function selectBillToPay(index) {
    document.querySelectorAll('.bill-card').forEach(card => card.classList.remove('selected'));
    document.getElementById(`bill_box_${index}`).classList.add('selected');

    selectedBill = currentPatientBills[index];
    let boxTotalPrice = selectedBill.total_price + selectedBill.attached_meds.reduce((sum, m) => sum + m.total_price, 0);
    let boxPaidAmount = selectedBill.paid_amount + selectedBill.attached_meds.reduce((sum, m) => sum + m.paid_amount, 0);
    let balance = boxTotalPrice - boxPaidAmount;

    document.getElementById('pay_bill_id').innerText = `รายการที่ #${selectedBill.display_id}`;
    let cleanMainName = selectedBill.item_name.split(' (ในคอร์ส:')[0];
    document.getElementById('pay_item_name').innerText = cleanMainName;
    document.getElementById('pay_item_type').innerText = selectedBill.type === 'PROMOTION' ? 'โปร / เซ็ต' : 'คอร์ส / บริการ';
    
    // 🌟 อัปเดต: เปลี่ยนจาก boxTotalPrice เป็น selectedBill.total_price เพื่อให้โชว์เฉพาะราคาคอร์ส
    document.getElementById('pay_item_full_price').innerText = `฿${selectedBill.total_price.toLocaleString()}`; 
    
    document.getElementById('pay_already_paid').innerText = `฿${boxPaidAmount.toLocaleString()}`;
    document.getElementById('pay_balance').innerText = `฿${balance.toLocaleString()}`;
    // 🌟 โค้ดส่วนที่หายไป (ใช้ปลดล็อคช่องกรอกเงินและปุ่ม)
    let inputEl = document.getElementById('pay_input_amount');
    inputEl.disabled = false; inputEl.value = balance; inputEl.setAttribute('max', balance);
    
    let submitBtn = document.getElementById('pay_submit_btn');
    submitBtn.disabled = false; submitBtn.classList.remove('btn-secondary'); submitBtn.classList.add('btn-success');
    // 🌟 ซ่อน/แสดง แผงรับชำระเงินตามสถานะยอดคงเหลือ
    let paymentSection1 = document.getElementById('pay_input_amount').parentElement.parentElement;
    let paymentSection2 = document.getElementById('pay_submit_btn').parentElement;
    
    if (balance <= 0) {
        paymentSection1.style.display = 'none';
        paymentSection2.style.display = 'none';
    } else {
        paymentSection1.style.display = 'block';
        paymentSection2.style.display = 'block';
    }
    
    let prodDef = currentInventory.find(p => p.id === selectedBill.product_id);
    let detailsHtml = '';
    if (prodDef && prodDef.type === 'PROMOTION' && prodDef.bundle_items) {
       try {
         let items = JSON.parse(prodDef.bundle_items);
         detailsHtml += '<div class="fw-bold text-primary mt-2 mb-1">รายการในเซ็ต:</div>';
         items.forEach(i => { detailsHtml += `<div class="d-flex justify-content-between pb-1 border-bottom"><span>- ${i.name}</span> <b>x${i.qty}</b></div>`; });
       } catch(e) {}
    }

    if (selectedBill.attached_meds && selectedBill.attached_meds.length > 0) {
      detailsHtml += '<div class="fw-bold text-danger mt-2 mb-1">ยาที่สั่งพ่วง:</div>';
      selectedBill.attached_meds.forEach(m => {
         let mBalance = m.total_price - m.paid_amount;
         let mStatus = mBalance <= 0 ? '(จ่ายแล้ว)' : '';
         let cleanMedName = m.item_name.split(' (ในคอร์ส:')[0];
         detailsHtml += `<div class="d-flex justify-content-between pb-1 border-bottom"><span>- ${cleanMedName} <small class="text-success">${mStatus}</small></span> <b>฿${m.total_price.toLocaleString()}</b></div>`;
      });
    }
	
	// 🌟 ดึงประวัติการใช้บริการจาก EMR ที่ตรงกับชื่อคอร์สนี้
    let relatedEmr = currentPatientEmr.filter(log => {
      let cc = log.symptoms || '';
      return cc.includes(cleanMainName); // ตรวจสอบว่าในประวัติมีชื่อคอร์ส/บิล นี้ไหม
    });
    
    // เรียงวันที่จากเก่าไปใหม่ (ครั้งที่ 1, 2, 3...)
    relatedEmr.sort((a,b) => new Date(a.visit_date) - new Date(b.visit_date));

    if (relatedEmr.length > 0) {
      detailsHtml += '<div class="fw-bold text-info mt-3 mb-2"><i class="fa-solid fa-clock-rotate-left"></i> ประวัติการเข้าใช้บริการ:</div>';
      relatedEmr.forEach((log, i) => {
         let dateStr = new Date(log.visit_date).toLocaleDateString('th-TH');
         let txDetails = log.treatment_details ? log.treatment_details.replace(/\n/g, '<br>') : 'ไม่มีรายละเอียด';
         
         detailsHtml += `
           <div class="p-2 mb-2 bg-white border border-info rounded-3 shadow-sm">
             <div class="fw-bold text-dark mb-1" style="font-size: 0.8rem;">
               <span class="badge bg-info text-dark me-1">ครั้งที่ ${i+1}</span> 
               วันที่: ${dateStr}
             </div>
             <div class="text-muted" style="font-size: 0.75rem;">${txDetails}</div>
           </div>`;
      });
    }

    document.getElementById('pay_item_details').innerHTML = detailsHtml;
    calculatePreview();
  }

 // 🌟 ยืนยันการรับชำระเงิน (พร้อมเก็บ Log และเด้งถามเรื่องพิมพ์ใบเสร็จแบบใหม่)
  async function submitSinglePayment() {
    if (!selectedBill || !currentPosPatient) return;
    let payAmount = parseFloat(document.getElementById('pay_input_amount').value) || 0;
    if (payAmount <= 0) return Swal.fire('ไม่ถูกต้อง', 'กรุณาระบุยอดชำระ', 'warning');

    let cleanMainName = selectedBill.item_name.split(' (ในคอร์ส:')[0];
    Swal.fire({
      title: 'ยืนยันรับชำระ?', html: `<b>${cleanMainName}</b><br>ยอดชำระ: <b class="text-success fs-5">฿${payAmount.toLocaleString()}</b><br>ช่องทาง: <b>${selectedMethod}</b>`,
      showCancelButton: true, confirmButtonText: 'ยืนยัน', confirmButtonColor: '#3b82f6'
    }).then(async (result) => {
      if (result.isConfirmed) {
        Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
        let remainingPay = payAmount; let paymentsPayload = [];
        let mainBalance = selectedBill.total_price - selectedBill.paid_amount;
        let payForMain = Math.min(mainBalance, remainingPay);
        if (payForMain > 0) { paymentsPayload.push({ bill_id: selectedBill.id, pay_amount: payForMain, payment_method: selectedMethod }); remainingPay -= payForMain; }

        if (selectedBill.attached_meds && selectedBill.attached_meds.length > 0) {
            for (let m of selectedBill.attached_meds) {
                if (remainingPay <= 0) break;
                let mBalance = m.total_price - m.paid_amount;
                let payForMed = Math.min(mBalance, remainingPay);
                if (payForMed > 0) { paymentsPayload.push({ bill_id: m.id, pay_amount: payForMed, payment_method: selectedMethod }); remainingPay -= payForMed; }
            }
        }
        
        try {
          const res = await fetch('/api/pos/pay/' + currentPosPatient.id, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ sales_rep: '-', payment_method: selectedMethod, payments: paymentsPayload, new_items: [] }) });
          const data = await res.json();
          
          if (data.status === 'success') {
            // ส่งประวัติเข้า System Logs
            let staff = document.getElementById('display-staff-name') ? document.getElementById('display-staff-name').innerText : 'พนักงาน';
            fetch('/api/logs', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ user_name: staff, action: 'POS', details: `รับชำระเงินจาก ${currentPosPatient.full_name} (${currentPosPatient.id}) จำนวน ฿${payAmount.toLocaleString()} ผ่าน ${selectedMethod}` }) });

            // เด้งป๊อปอัปถามหลังจ่ายเงินเสร็จ ว่าจะพิมพ์อะไรไหม
            Swal.fire({
              icon: 'success',
              title: 'รับชำระเงินสำเร็จ!',
              html: 'คุณต้องการพิมพ์เอกสารหรือไม่?',
              showCancelButton: true,
              showDenyButton: true,
              confirmButtonText: '<i class="fa-solid fa-print me-1"></i> ใบเสร็จ',
              cancelButtonText: '<i class="fa-solid fa-file-medical me-1"></i> ใบรับรองแพทย์',
              denyButtonText: 'ปิดหน้าต่าง',
              confirmButtonColor: '#3b82f6',
              cancelButtonColor: '#10b981',
              denyButtonColor: '#64748b',
            }).then((resAlert) => {
              // 🌟 ดึงชื่อพนักงานและคนไข้เพื่อส่งไปพิมพ์
              let staffName = document.getElementById('display-staff-name') ? document.getElementById('display-staff-name').innerText.split('|').pop().trim() : 'พนักงาน';
              let pName = currentPosPatient.full_name;

              if (resAlert.isConfirmed) {
                // พิมพ์ใบเสร็จ
                window.open(`/print.html?type=receipt&hn=${currentPosPatient.id}&pname=${encodeURIComponent(pName)}&course=${encodeURIComponent(cleanMainName)}&amount=${payAmount}&method=${selectedMethod}&date=${encodeURIComponent(new Date().toISOString())}&staff=${encodeURIComponent(staffName)}`, '_blank');
              } else if (resAlert.dismiss === Swal.DismissReason.cancel) {
                // พิมพ์ใบรับรองแพทย์
                promptMedicalCertificate(currentPosPatient.id);
              }
              // โหลดหน้าจอ POS ใหม่เพื่ออัปเดตยอดเงิน
              selectPatientForPos(currentPosPatient.id); 
            });
            
          } else { 
            Swal.fire('Error', data.message, 'error'); 
          }
        } catch(e) {}
      }
    });
  }

function renderPaymentHistory() {
    const filter = document.getElementById('paymentHistoryFilter').value;
    const container = document.getElementById('paymentHistoryList');
    let allPayments = [];

    // 🌟 สร้าง Map จำเลขลำดับรายการ (1, 2, 3...) ของคนไข้คนนี้
    let displayIdMap = {};
    currentPatientBills.forEach(b => {
        displayIdMap[b.id] = b.display_id;
        if (b.attached_meds) {
            b.attached_meds.forEach(m => displayIdMap[m.id] = b.display_id);
        }
    });

    allPatientBillsHistory.forEach(bill => {
      let itemName = bill.item_name || '';
      let match = itemName.match(/\(ในคอร์ส:\s*(.*?)\)/);
      let courseName = match ? match[1].trim() : itemName.trim();
      
      if (filter !== 'ALL' && courseName !== filter) return;

      let history = [];
      try { history = JSON.parse(bill.payment_history || '[]'); } catch(e) {}

      let isFullyPaid = bill.paid_amount >= bill.total_price;
      let displayId = displayIdMap[bill.id] || '-'; // ดึงเลขลำดับรายการมาใช้

      history.forEach(h => {
        allPayments.push({
          date: h.date, amount: h.amount, method: h.method || 'CASH', courseName: courseName, displayId: displayId, isFullyPaid: isFullyPaid
        });
      });
    });

    let groupedPayments = {};
    allPayments.forEach(p => {
        let safeDate = p.date ? String(p.date) : new Date().toISOString();
        let timeKey = safeDate.substring(0, 16); 
        
        let key = p.courseName + '_' + timeKey + '_' + p.method + '_' + p.displayId; 
        if (!groupedPayments[key]) {
            groupedPayments[key] = { date: safeDate, courseName: p.courseName, method: p.method, amount: 0, displayId: p.displayId, isFullyPaid: p.isFullyPaid };
        }
        groupedPayments[key].amount += (parseFloat(p.amount) || 0);
    });

    let finalPayments = Object.values(groupedPayments);
    finalPayments.sort((a, b) => new Date(b.date) - new Date(a.date));

    if (finalPayments.length === 0) {
      container.innerHTML = '<div class="text-muted text-center py-5"><i class="fa-solid fa-receipt fa-3x mb-3 opacity-25"></i><br>ไม่พบประวัติการชำระเงิน</div>';
      return;
    }

    let html = '';
    finalPayments.forEach(p => {
      const dateObj = new Date(p.date);
      const dateStr = dateObj.toLocaleDateString('th-TH', { year:'numeric', month:'short', day:'numeric' });
      const timeStr = dateObj.toLocaleTimeString('th-TH', { hour:'2-digit', minute:'2-digit' });

      let mColor = p.method === 'CASH' ? 'success' : (p.method === 'QR' ? 'primary' : 'warning text-dark');
      let mIcon = p.method === 'CASH' ? 'fa-money-bill-wave' : (p.method === 'QR' ? 'fa-qrcode' : 'fa-credit-card');

      let statusBadge = p.isFullyPaid 
        ? '<span class="badge bg-success ms-2" style="font-size: 0.65rem;"><i class="fa-solid fa-check-circle"></i> บิลนี้จ่ายครบแล้ว</span>'
        : '<span class="badge bg-danger ms-2" style="font-size: 0.65rem;"><i class="fa-solid fa-triangle-exclamation"></i> บิลนี้ยังค้างชำระ</span>';

      let staffName = document.getElementById('display-staff-name') ? document.getElementById('display-staff-name').innerText.split('|').pop().trim() : 'พนักงาน';
      let pName = currentPosPatient ? currentPosPatient.full_name : '';

      html += `
        <div class="border-start border-4 border-${mColor} ps-3 pb-2 pt-2 mb-3 bg-white rounded-end shadow-sm">
          <div class="d-flex justify-content-between align-items-center mb-1">
             <span class="fw-bold text-dark"><i class="fa-solid fa-calendar-day me-1 text-muted"></i> ${dateStr} เวลา ${timeStr} น.</span>
             <span class="badge bg-${mColor}"><i class="fa-solid ${mIcon} me-1"></i> ${p.method}</span>
          </div>
          <div class="fw-bold text-primary mt-1" style="font-size: 0.9rem;">
             ${p.courseName} <span class="text-muted small fw-normal ms-1">(รายการที่ #${p.displayId})</span> ${statusBadge}
          </div>
          
          <div class="d-flex justify-content-between align-items-end mt-2 pt-2 border-top">
             <div>
               <button class="btn btn-sm btn-outline-primary rounded-pill px-3 shadow-sm me-1" onclick="window.open('/print.html?type=receipt&hn=${currentPosPatient.id}&pname=${encodeURIComponent(pName)}&course=${encodeURIComponent(p.courseName)}&amount=${p.amount}&method=${p.method}&date=${encodeURIComponent(p.date)}&staff=${encodeURIComponent(staffName)}', '_blank')"><i class="fa-solid fa-print"></i> ใบเสร็จ</button>
               <button class="btn btn-sm btn-outline-success rounded-pill px-3 shadow-sm" onclick="promptMedicalCertificate('${currentPosPatient.id}')"><i class="fa-solid fa-file-medical"></i> ใบรับรองแพทย์</button>
             </div>
             <div class="text-end">
               <span class="text-muted small me-2">ยอดโอน/ชำระ:</span>
               <span class="fw-bold text-success fs-5">฿${p.amount.toLocaleString()}</span>
             </div>
          </div>
        </div>`;
    });

    container.innerHTML = html;
  }
  // 🌟 ฟังก์ชันรับข้อมูลเพิ่มเติมสำหรับใบรับรองแพทย์ (มีช่องให้กรอก Dx/Tx เพิ่ม)
  function promptMedicalCertificate(hn) {
    Swal.fire({
      title: 'ออกใบรับรองแพทย์',
      html: `
        <div class="text-start">
          <label class="form-label fw-bold small text-muted">ผลการตรวจวินิจฉัย (Dx)</label>
          <input type="text" id="cert_dx" class="form-control border-primary mb-2" placeholder="เช่น สิวอักเสบ (เว้นว่างเพื่อดึงจากระบบ)">
          
          <label class="form-label fw-bold small text-muted">การรักษา / หัตถการที่ทำ (Tx)</label>
          <input type="text" id="cert_tx" class="form-control border-primary mb-2" placeholder="เช่น เลเซอร์ (เว้นว่างเพื่อดึงจากระบบ)">

          <label class="form-label fw-bold small text-muted">ความเห็นแพทย์ / อาการป่วย</label>
          <input type="text" id="cert_reason" class="form-control border-primary mb-2" value="มารับบริการตรวจรักษาผิวพรรณและความงาม">
          
          <label class="form-label fw-bold small text-muted">เห็นสมควรให้พักรักษาตัว (วัน)</label>
          <input type="number" id="cert_rest_days" class="form-control border-primary text-center" value="0" min="0">
        </div>
      `,
      showCancelButton: true,
      confirmButtonText: '<i class="fa-solid fa-print me-1"></i> พิมพ์ใบรับรอง',
      cancelButtonText: 'ยกเลิก',
      confirmButtonColor: '#10b981',
      preConfirm: () => {
        return {
          dx: document.getElementById('cert_dx').value,
          tx: document.getElementById('cert_tx').value,
          reason: document.getElementById('cert_reason').value,
          days: document.getElementById('cert_rest_days').value
        }
      }
    }).then((res) => {
      if(res.isConfirmed) {
        let pName = currentPosPatient.full_name;
        // ส่งแนบ URL Parameter ให้หน้า Print
        window.open(`/print.html?type=certificate&hn=${hn}&pname=${encodeURIComponent(pName)}&dx=${encodeURIComponent(res.value.dx)}&tx=${encodeURIComponent(res.value.tx)}&reason=${encodeURIComponent(res.value.reason)}&days=${res.value.days}`, '_blank');
      }
    });
  }
  
  
</script>
