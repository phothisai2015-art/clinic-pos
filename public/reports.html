<style>
  /* 🌟 Reports Dashboard UI Styles */
  .report-kpi-card { border: 1px solid #e2e8f0; border-radius: 16px; background: #fff; padding: 20px; transition: 0.2s; height: 100%; display: flex; flex-direction: column; justify-content: center; position: relative; overflow: hidden; }
  .report-kpi-card:hover { transform: translateY(-4px); box-shadow: 0 10px 25px rgba(0,0,0,0.05); border-color: #3b82f6; }
  .kpi-icon { position: absolute; right: -10px; bottom: -20px; font-size: 5rem; opacity: 0.05; color: #334155; transform: rotate(-15deg); }
  
  .chart-container { background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 20px; height: 350px; box-shadow: 0 5px 15px rgba(0,0,0,0.02); }
  .table-container { background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.02); height: 100%; }
  
  .filter-btn.active { background-color: #3b82f6; color: white; border-color: #3b82f6; }
  
  .custom-scrollbar::-webkit-scrollbar { width: 6px; }
  .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
  .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

  /* 🌙 Dark Mode */
  body.dark-theme .report-kpi-card, body.dark-theme .chart-container, body.dark-theme .table-container { background-color: #1e293b; border-color: #334155; }
  body.dark-theme .kpi-icon { color: #f8fafc; opacity: 0.05; }
  body.dark-theme .text-dark { color: #f8fafc !important; }
  body.dark-theme .text-muted { color: #94a3b8 !important; }
  body.dark-theme .table { color: #f8fafc; }
  body.dark-theme .table td { border-bottom-color: #334155; }
  body.dark-theme .table thead th { border-bottom-color: #475569; background-color: #0f172a; color: #cbd5e1; }
</style>

<div class="container-fluid py-4 px-lg-4" style="max-width: 1600px; height: 100vh; display: flex; flex-direction: column;">
  <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
    <h3 class="fw-bold text-secondary m-0"><i class="fa-solid fa-chart-pie me-2"></i> สถิติและรายงานยอดขาย</h3>
    <button class="btn btn-outline-danger fw-bold rounded-pill px-4 shadow-sm" onclick="closeModule()">
      <i class="fa-solid fa-xmark me-2"></i> ปิดหน้านี้
    </button>
  </div>

  <div class="flex-grow-1 custom-scrollbar" style="overflow-y: auto; padding-right: 5px;">
    <!-- ตัวกรองวันที่ -->
    <div class="bg-white p-3 rounded-4 border shadow-sm mb-4 d-flex flex-wrap align-items-center justify-content-between gap-3">
      <div class="d-flex align-items-center gap-2">
        <h6 class="fw-bold m-0 text-muted me-2"><i class="fa-solid fa-filter"></i> ช่วงเวลา:</h6>
        <input type="date" id="rep_start" class="form-control form-control-sm text-primary fw-bold" style="width: 140px;">
        <span class="text-muted">-</span>
        <input type="date" id="rep_end" class="form-control form-control-sm text-primary fw-bold" style="width: 140px;">
        <button class="btn btn-sm btn-primary fw-bold px-3 ms-2" onclick="loadDashboardData()">ดูรายงาน</button>
      </div>
      <div class="d-flex gap-2">
        <button class="btn btn-sm btn-outline-secondary filter-btn fw-bold px-3" onclick="setDateFilter('today')">วันนี้</button>
        <button class="btn btn-sm btn-outline-secondary filter-btn fw-bold px-3" onclick="setDateFilter('week')">สัปดาห์นี้</button>
        <button class="btn btn-sm btn-outline-secondary filter-btn fw-bold px-3" onclick="setDateFilter('month')">เดือนนี้</button>
      </div>
    </div>

    <!-- KPI Cards -->
    <div class="row g-4 mb-4">
      <div class="col-xl-3 col-md-6">
        <div class="report-kpi-card border-primary">
          <i class="fa-solid fa-vault kpi-icon"></i>
          <h6 class="text-muted fw-bold mb-1">รายได้รวมทั้งหมด</h6>
          <h3 class="text-primary fw-bold m-0" id="kpi_total">฿ 0</h3>
        </div>
      </div>
      <div class="col-xl-3 col-md-6">
        <div class="report-kpi-card border-success">
          <i class="fa-solid fa-money-bill-wave kpi-icon"></i>
          <h6 class="text-muted fw-bold mb-1">เงินสด (CASH)</h6>
          <h3 class="text-success fw-bold m-0" id="kpi_cash">฿ 0</h3>
        </div>
      </div>
      <div class="col-xl-3 col-md-6">
        <div class="report-kpi-card border-info">
          <i class="fa-solid fa-qrcode kpi-icon"></i>
          <h6 class="text-muted fw-bold mb-1">โอนเงิน (QR)</h6>
          <h3 class="text-info fw-bold m-0" id="kpi_qr">฿ 0</h3>
        </div>
      </div>
      <div class="col-xl-3 col-md-6">
        <div class="report-kpi-card border-warning">
          <i class="fa-solid fa-credit-card kpi-icon"></i>
          <h6 class="text-muted fw-bold mb-1">บัตรเครดิต (CREDIT)</h6>
          <h3 class="text-warning text-dark fw-bold m-0" id="kpi_credit">฿ 0</h3>
        </div>
      </div>
    </div>

    <div class="row g-4 mb-4">
      <!-- กราฟรายได้ -->
      <div class="col-lg-8">
        <div class="chart-container d-flex flex-column">
          <h6 class="fw-bold text-dark mb-3"><i class="fa-solid fa-chart-line text-primary me-2"></i> แนวโน้มรายได้รายวัน</h6>
          <div class="flex-grow-1 position-relative">
            <canvas id="revenueChart"></canvas>
          </div>
        </div>
      </div>
      
      <!-- Top Sellers -->
      <div class="col-lg-4">
        <div class="table-container d-flex flex-column">
          <h6 class="fw-bold text-dark mb-3"><i class="fa-solid fa-trophy text-warning me-2"></i> 5 อันดับ สินค้า/คอร์ส ขายดี</h6>
          <div class="custom-scrollbar flex-grow-1" style="overflow-y: auto;">
            <table class="table table-sm table-borderless align-middle mb-0">
              <tbody id="topSellersTable">
                <tr><td class="text-center text-muted py-4">ไม่มีข้อมูล</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <div class="row g-4 mb-4">
      <!-- Unpaid -->
      <div class="col-lg-6">
        <div class="table-container d-flex flex-column" style="max-height: 400px;">
          <h6 class="fw-bold text-danger mb-3"><i class="fa-solid fa-triangle-exclamation me-2"></i> รายการค้างชำระ</h6>
          <div class="custom-scrollbar flex-grow-1" style="overflow-y: auto;">
            <table class="table table-hover align-middle mb-0">
              <thead class="sticky-top bg-white">
                <tr><th>คนไข้</th><th>รายการ</th><th class="text-end">ยอดค้าง</th></tr>
              </thead>
              <tbody id="unpaidTable">
                <tr><td colspan="3" class="text-center text-muted py-4">ไม่มีข้อมูล</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- บิลล่าสุด -->
      <div class="col-lg-6">
        <div class="table-container d-flex flex-column" style="max-height: 400px;">
          <h6 class="fw-bold text-success mb-3"><i class="fa-solid fa-clock-rotate-left me-2"></i> ประวัติรับเงินล่าสุด</h6>
          <div class="custom-scrollbar flex-grow-1" style="overflow-y: auto;">
            <table class="table table-hover align-middle mb-0">
              <thead class="sticky-top bg-white">
                <tr><th>เวลา</th><th>คนไข้</th><th>ช่องทาง</th><th class="text-end">จำนวนเงิน</th></tr>
              </thead>
              <tbody id="logsTable">
                <tr><td colspan="4" class="text-center text-muted py-4">ไม่มีข้อมูล</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
  let revenueChartInstance = null;

  function initReports() {
    setDateFilter('month');
  }

  function setDateFilter(type) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');

    const today = new Date();
    let start = new Date();
    let end = new Date();

    if (type === 'today') {
      // ใช้วันนี้
    } else if (type === 'week') {
      const first = today.getDate() - today.getDay() + 1; // เริ่มวันจันทร์
      start = new Date(today.setDate(first));
      end = new Date(start);
      end.setDate(end.getDate() + 6); // ถึงวันอาทิตย์
    } else if (type === 'month') {
      start = new Date(today.getFullYear(), today.getMonth(), 1);
      end = new Date(today.getFullYear(), today.getMonth() + 1, 0);
    }

    // แปลง YYYY-MM-DD แบบปลอดภัยไม่โดน Timezone shift
    const formatTimezone = (d) => {
        let local = new Date(d);
        local.setMinutes(d.getMinutes() - d.getTimezoneOffset());
        return local.toJSON().slice(0, 10);
    };

    document.getElementById('rep_start').value = formatTimezone(start);
    document.getElementById('rep_end').value = formatTimezone(end);
    loadDashboardData();
  }

  async function loadDashboardData() {
    const start = document.getElementById('rep_start').value;
    const end = document.getElementById('rep_end').value;
    if (!start || !end) return;

    try {
      const res = await fetch(`/api/reports/dashboard?start_date=${start}&end_date=${end}`);
      const data = await res.json();
      
      if (data.status === 'success') {
        renderKPI(data);
        renderChart(data.chart_data);
        renderTopSellers(data.top_sellers);
        renderUnpaid(data.unpaid_patients);
        renderLogs(data.bill_logs);
      }
    } catch(e) { console.error('Dashboard Error:', e); }
  }

  function renderKPI(data) {
    const formatNum = (num) => num.toLocaleString('th-TH', {minimumFractionDigits: 0});
    document.getElementById('kpi_total').innerText = '฿ ' + formatNum(data.total_revenue);
    document.getElementById('kpi_cash').innerText = '฿ ' + formatNum(data.methods.CASH || 0);
    document.getElementById('kpi_qr').innerText = '฿ ' + formatNum(data.methods.QR || 0);
    document.getElementById('kpi_credit').innerText = '฿ ' + formatNum(data.methods.CREDIT || 0);
  }

  function renderChart(chartData) {
    const ctx = document.getElementById('revenueChart').getContext('2d');
    if (revenueChartInstance) revenueChartInstance.destroy();

    const labels = chartData.map(d => {
        let [y,m,day] = d.date.split('-');
        return `${day}/${m}`;
    });
    const values = chartData.map(d => d.revenue);

    const isDark = document.body.classList.contains('dark-theme');
    const gridColor = isDark ? '#334155' : '#f1f5f9';
    const textColor = isDark ? '#94a3b8' : '#64748b';

    revenueChartInstance = new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [{
          label: 'รายได้ (฿)',
          data: values,
          borderColor: '#3b82f6',
          backgroundColor: 'rgba(59, 130, 246, 0.1)',
          borderWidth: 3,
          pointBackgroundColor: '#fff',
          pointBorderColor: '#3b82f6',
          pointRadius: 4,
          fill: true,
          tension: 0.4
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { grid: { display: false, color: gridColor }, ticks: { color: textColor } },
          y: { grid: { color: gridColor }, ticks: { color: textColor, callback: (v) => '฿' + v.toLocaleString() } }
        }
      }
    });
  }

  function renderTopSellers(items) {
    const tbody = document.getElementById('topSellersTable');
    if(items.length === 0) { tbody.innerHTML = '<tr><td class="text-center text-muted">ไม่มีข้อมูล</td></tr>'; return; }
    
    let html = '';
    // เอาแค่ Top 5
    items.slice(0, 5).forEach((item, index) => {
        let badgeColor = index === 0 ? 'bg-warning text-dark' : (index === 1 ? 'bg-secondary' : 'bg-primary');
        html += `
          <tr class="border-bottom">
            <td width="10%"><span class="badge ${badgeColor} rounded-circle p-2">${index+1}</span></td>
            <td>
              <div class="fw-bold text-dark text-truncate" style="max-width: 180px;">${item.name}</div>
              <small class="text-muted">${item.type}</small>
            </td>
            <td class="text-end">
              <div class="fw-bold text-success">฿${item.revenue.toLocaleString()}</div>
              <small class="text-muted">${item.qty} ชิ้น/ครั้ง</small>
            </td>
          </tr>`;
    });
    tbody.innerHTML = html;
  }

  function renderUnpaid(items) {
    const tbody = document.getElementById('unpaidTable');
    if(items.length === 0) { tbody.innerHTML = '<tr><td colspan="3" class="text-center text-muted py-4"><i class="fa-solid fa-check-circle text-success me-2"></i>ไม่มีค้างชำระ</td></tr>'; return; }
    
    let html = '';
    items.forEach(item => {
        html += `
          <tr>
            <td class="fw-bold text-primary">${item.name}</td>
            <td><div class="text-truncate" style="max-width: 150px;">${item.item}</div></td>
            <td class="text-end fw-bold text-danger">฿${item.balance.toLocaleString()}</td>
          </tr>`;
    });
    tbody.innerHTML = html;
  }

  function renderLogs(logs) {
    const tbody = document.getElementById('logsTable');
    if(logs.length === 0) { tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted py-4">ไม่มีประวัติ</td></tr>'; return; }
    
    let html = '';
    logs.slice(0, 50).forEach(log => {
        const timeStr = new Date(log.time).toLocaleTimeString('th-TH', {hour:'2-digit', minute:'2-digit'});
        const dateStr = new Date(log.time).toLocaleDateString('th-TH', {day:'numeric', month:'short'});
        
        let methodBadge = log.method === 'CASH' ? '<span class="badge bg-success">เงินสด</span>' : (log.method === 'QR' ? '<span class="badge bg-info">QR</span>' : '<span class="badge bg-warning text-dark">เครดิต</span>');

        html += `
          <tr>
            <td class="text-muted small">${dateStr}<br>${timeStr} น.</td>
            <td>
               <div class="fw-bold text-dark">${log.patient_name}</div>
               <div class="text-muted small text-truncate" style="max-width: 150px;">${log.item_name}</div>
            </td>
            <td>${methodBadge}</td>
            <td class="text-end fw-bold text-success">฿${log.amount.toLocaleString()}</td>
          </tr>`;
    });
    tbody.innerHTML = html;
  }

  initReports();
</script>
