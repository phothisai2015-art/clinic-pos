<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>ระบบคิว - Clinic POS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; }
    .sidebar { width: 250px; background: #1e293b; min-height: 100vh; color: white; }
    .nav-link { color: #cbd5e1; transition: 0.3s; margin-bottom: 5px; border-radius: 8px; }
    .nav-link:hover, .nav-link.active { background: #3b82f6; color: white; }
    .content-area { flex-grow: 1; padding: 30px; height: 100vh; overflow-y: auto; }
    .card { border: none; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    /* สีสถานะคิว */
    .status-1 { background-color: #f3f4f6; color: #475569; border: 1px solid #cbd5e1; } /* รอซักประวัติ */
    .status-2 { background-color: #fff7ed; color: #ea580c; border: 1px solid #fdba74; } /* รอตรวจ */
    .status-3 { background-color: #eff6ff; color: #2563eb; border: 1px solid #93c5fd; } /* กำลังตรวจ */
    .status-4 { background-color: #f0fdf4; color: #16a34a; border: 1px solid #86efac; } /* รอชำระเงิน */
  </style>
</head>
<body class="d-flex">

  <!-- เมนูด้านข้าง -->
  <div class="sidebar p-3 d-none d-md-block">
    <div class="text-center mb-4 mt-2">
      <h4 class="fw-bold text-white"><i class="fa-solid fa-hospital-user text-primary"></i> Clinic POS</h4>
    </div>
    <ul class="nav flex-column">
      <li class="nav-item"><a class="nav-link" href="/dashboard"><i class="fa-solid fa-chart-pie me-2"></i> เมนูหลัก</a></li>
      <li class="nav-item"><a class="nav-link" href="/patients"><i class="fa-solid fa-users me-2"></i> ประวัติคนไข้</a></li>
      <li class="nav-item"><a class="nav-link active" href="/queue"><i class="fa-solid fa-clipboard-list me-2"></i> ระบบคิว</a></li>
      <li class="nav-item"><a class="nav-link" href="/doctor"><i class="fa-solid fa-stethoscope me-2"></i> ห้องตรวจ</a></li>
      <li class="nav-item"><a class="nav-link" href="/pos"><i class="fa-solid fa-cash-register me-2"></i> แคชเชียร์/ห้องยา</a></li>
      <li class="nav-item"><a class="nav-link" href="/inventory"><i class="fa-solid fa-box-open me-2"></i> คลังยา</a></li>
    </ul>
  </div>

  <!-- พื้นที่หลัก -->
  <div class="content-area">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h3 class="fw-bold text-dark"><i class="fa-solid fa-clipboard-list text-warning me-2"></i> ระบบกระดานคิว (Queue Board)</h3>
      <button class="btn btn-outline-primary fw-bold px-4 rounded-pill shadow-sm" onclick="loadQueue()">
        <i class="fa-solid fa-rotate me-1"></i> รีเฟรชคิว
      </button>
    </div>

    <!-- ตารางแสดงคิว -->
    <div class="card p-0 overflow-hidden">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th class="ps-4 text-center">หมายเลขคิว</th>
            <th>รหัส HN</th>
            <th>ชื่อคนไข้</th>
            <th>เวลาที่เข้าคิว</th>
            <th class="text-center">สถานะปัจจุบัน</th>
            <th class="text-center">เปลี่ยนสถานะ</th>
          </tr>
        </thead>
        <tbody id="queueTableBody">
          <!-- ข้อมูลคิวจะมาโผล่ตรงนี้ -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", loadQueue);

    // ดึงข้อมูลคิว
    function loadQueue() {
      fetch('/api/queue')
        .then(res => res.json())
        .then(data => {
          const tbody = document.getElementById('queueTableBody');
          tbody.innerHTML = '';
          
          if(data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted py-5"><i class="fa-solid fa-mug-hot fa-2x mb-2 text-light"></i><br>ไม่มีคนไข้ในคิวขณะนี้</td></tr>`;
            return;
          }

          data.forEach(q => {
            let badgeClass = '';
            if (q.status === 'รอซักประวัติ') badgeClass = 'status-1';
            else if (q.status === 'รอตรวจ') badgeClass = 'status-2';
            else if (q.status === 'กำลังตรวจ') badgeClass = 'status-3';
            else if (q.status === 'รอชำระเงิน') badgeClass = 'status-4';

            // ดึงเวลาแบบสั้น (ตัดวันที่ออก เอาแค่ ชม:นาที)
            let timeOnly = q.created_at.split(' ')[1] || q.created_at;

            tbody.innerHTML += `
              <tr>
                <td class="ps-4 text-center"><h5 class="fw-bold text-primary m-0">Q-${q.queue_id.toString().padStart(3, '0')}</h5></td>
                <td class="text-muted fw-bold">${q.hn_code}</td>
                <td class="fw-bold text-dark">${q.name}</td>
                <td class="text-muted"><i class="fa-regular fa-clock"></i> ${timeOnly}</td>
                <td class="text-center">
                  <span class="badge ${badgeClass} rounded-pill px-3 py-2 fw-bold">${q.status}</span>
                </td>
                <td class="text-center">
                  <select class="form-select form-select-sm d-inline-block w-auto fw-bold" onchange="updateQueueStatus(${q.queue_id}, this.value)">
                    <option value="" disabled selected>เปลี่ยนสถานะ...</option>
                    <option value="รอซักประวัติ">1. รอซักประวัติ</option>
                    <option value="รอตรวจ">2. รอตรวจ</option>
                    <option value="กำลังตรวจ">3. กำลังตรวจ</option>
                    <option value="รอชำระเงิน">4. รอชำระเงิน</option>
                    <option value="เสร็จสิ้น">5. เสร็จสิ้น (นำออกจากกระดาน)</option>
                  </select>
                </td>
              </tr>
            `;
          });
        })
        .catch(err => console.error(err));
    }

    // อัปเดตสถานะคิว
    function updateQueueStatus(queueId, newStatus) {
      if (!newStatus) return;

      Swal.fire({
        title: 'ยืนยันเปลี่ยนสถานะ?',
        text: `เปลี่ยนเป็น: ${newStatus}`,
        icon: 'question',
        showCancelButton: true,
        confirmButtonColor: '#3b82f6',
        cancelButtonColor: '#94a3b8',
        confirmButtonText: 'ยืนยัน',
        cancelButtonText: 'ยกเลิก'
      }).then((result) => {
        if (result.isConfirmed) {
          fetch(`/api/queue/${queueId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status: newStatus })
          })
          .then(res => res.json())
          .then(data => {
            if (data.status === 'success') {
              Swal.fire({ icon: 'success', title: 'เปลี่ยนสถานะแล้ว', showConfirmButton: false, timer: 1000 });
              loadQueue(); // รีเฟรชตาราง
            } else {
              Swal.fire('ข้อผิดพลาด', data.message, 'error');
            }
          });
        } else {
          loadQueue(); // ถ้ายกเลิก ให้โหลดค่าเดิมกลับมา
        }
      });
    }
  </script>
</body>
</html>
