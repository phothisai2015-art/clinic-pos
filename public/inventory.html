<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>คลังยาและบริการ - Clinic POS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <style>
    body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; }
    .sidebar { width: 250px; background: #1e293b; min-height: 100vh; color: white; }
    .nav-link { color: #cbd5e1; transition: 0.3s; margin-bottom: 5px; border-radius: 8px; }
    .nav-link:hover, .nav-link.active { background: #3b82f6; color: white; }
    .content-area { flex-grow: 1; padding: 30px; height: 100vh; overflow-y: auto; }
    .card { border: none; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
  </style>
</head>
<body class="d-flex">

  <!-- เมนูด้านข้าง -->
  <div class="sidebar p-3 d-none d-md-block">
    <div class="text-center mb-4 mt-2">
      <h4 class="fw-bold text-white"><i class="fa-solid fa-hospital-user text-primary"></i> Clinic POS</h4>
    </div>
    <ul class="nav flex-column">
      <li class="nav-item"><a class="nav-link" href="/dashboard"><i class="fa-solid fa-chart-pie me-2"></i> เมนูหลัก</a></li>
      <li class="nav-item"><a class="nav-link" href="/patients"><i class="fa-solid fa-users me-2"></i> ประวัติคนไข้</a></li>
      <li class="nav-item"><a class="nav-link" href="/queue"><i class="fa-solid fa-clipboard-list me-2"></i> ระบบคิว</a></li>
      <li class="nav-item"><a class="nav-link" href="/doctor"><i class="fa-solid fa-stethoscope me-2"></i> ห้องตรวจ</a></li>
      <li class="nav-item"><a class="nav-link" href="/pos"><i class="fa-solid fa-cash-register me-2"></i> แคชเชียร์/ห้องยา</a></li>
      <li class="nav-item"><a class="nav-link active" href="/inventory"><i class="fa-solid fa-box-open me-2"></i> คลังยา</a></li>
    </ul>
  </div>

  <!-- พื้นที่หลัก -->
  <div class="content-area">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h3 class="fw-bold text-dark"><i class="fa-solid fa-box-open text-teal me-2" style="color: #14b8a6;"></i> คลังยาและบริการ</h3>
      <button class="btn btn-primary fw-bold px-4 rounded-pill shadow-sm" onclick="openProductModal('add')">
        <i class="fa-solid fa-plus me-1"></i> เพิ่มรายการใหม่
      </button>
    </div>

    <!-- กล่องค้นหา -->
    <div class="card p-3 mb-4">
      <div class="input-group">
        <span class="input-group-text bg-white border-end-0"><i class="fa-solid fa-search text-muted"></i></span>
        <input type="text" id="searchInput" class="form-control border-start-0" placeholder="ค้นหาด้วยรหัส หรือชื่อรายการ..." onkeyup="filterTable()">
      </div>
    </div>

    <!-- ตารางแสดงข้อมูล -->
    <div class="card p-0 overflow-hidden">
      <table class="table table-hover align-middle mb-0" id="productTable">
        <thead class="table-light">
          <tr>
            <th class="ps-4">รหัส</th>
            <th>ชื่อรายการ</th>
            <th>ประเภท</th>
            <th class="text-end">ราคาขาย</th>
            <th class="text-center">สต็อกคงเหลือ</th>
            <th class="text-center">จัดการ</th>
          </tr>
        </thead>
        <tbody id="inventoryTableBody">
          <!-- ข้อมูลจะถูกดึงมาใส่ตรงนี้ด้วย JS -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- Modal สำหรับเพิ่ม/แก้ไขยา -->
  <div class="modal fade" id="productModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content rounded-4 border-0">
        <div class="modal-header bg-light border-0 rounded-top-4">
          <h5 class="modal-title fw-bold text-primary" id="modalTitle"><i class="fa-solid fa-pills me-2"></i> เพิ่มรายการใหม่</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4">
          <form id="productForm">
            <!-- ซ่อนไว้เช็คโหมดแก้ไข -->
            <input type="hidden" id="editMode" value="false">
            <input type="hidden" id="oldProductId" value="">

            <div class="mb-3">
              <label class="form-label fw-bold text-muted small">รหัส (SKU/Barcode) <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="prodId" required placeholder="เช่น MED-001">
            </div>
            <div class="mb-3">
              <label class="form-label fw-bold text-muted small">ชื่อรายการ (ยา / หัตถการ) <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="prodName" required placeholder="เช่น Paracetamol 500mg">
            </div>
            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label fw-bold text-muted small">ประเภท</label>
                <select class="form-select" id="prodType">
                  <option value="medicine">ยา / เวชภัณฑ์</option>
                  <option value="service">ค่าบริการ / หัตถการ</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-bold text-muted small">ราคาขาย (บาท) <span class="text-danger">*</span></label>
                <input type="number" class="form-control" id="prodPrice" required min="0" value="0">
              </div>
              <div class="col-md-6">
                <label class="form-label fw-bold text-muted small">จำนวนสต็อก <span class="text-danger">*</span></label>
                <input type="number" class="form-control" id="prodStock" required min="0" value="0">
              </div>
              <div class="col-md-6">
                <label class="form-label fw-bold text-muted small">หน่วยนับ</label>
                <input type="text" class="form-control" id="prodUnit" placeholder="เช่น เม็ด, แผง, ครั้ง" value="เม็ด">
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer border-0 bg-light rounded-bottom-4">
          <button type="button" class="btn btn-secondary px-4 rounded-pill" data-bs-dismiss="modal">ยกเลิก</button>
          <button type="button" class="btn btn-primary px-4 fw-bold rounded-pill" onclick="saveProduct()">บันทึกข้อมูล</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let globalProducts = [];

    // ดึงข้อมูลเมื่อเปิดหน้าเว็บ
    document.addEventListener("DOMContentLoaded", loadInventory);

    // โหลดข้อมูลคลัง
    function loadInventory() {
      fetch('/api/products')
        .then(res => res.json())
        .then(data => {
          globalProducts = data;
          renderTable(data);
        })
        .catch(err => console.error(err));
    }

    // วาดตาราง
    function renderTable(data) {
      const tbody = document.getElementById('inventoryTableBody');
      tbody.innerHTML = '';
      
      if(data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted py-4">ไม่มีรายการในคลัง</td></tr>`;
        return;
      }

      data.forEach(p => {
        const typeBadge = p.type === 'medicine' 
          ? `<span class="badge bg-success bg-opacity-10 text-success border border-success">ยา/เวชภัณฑ์</span>` 
          : `<span class="badge bg-primary bg-opacity-10 text-primary border border-primary">บริการ/หัตถการ</span>`;
        
        const stockDisplay = p.type === 'service' 
          ? `<span class="text-muted">-</span>` 
          : (p.stock <= 10 ? `<span class="fw-bold text-danger">${p.stock} ${p.unit}</span>` : `<span class="fw-bold text-dark">${p.stock} ${p.unit}</span>`);

        tbody.innerHTML += `
          <tr>
            <td class="ps-4 fw-bold text-muted">${p.id}</td>
            <td class="fw-bold text-dark">${p.name}</td>
            <td>${typeBadge}</td>
            <td class="text-end fw-bold text-primary">฿${parseFloat(p.price).toLocaleString()}</td>
            <td class="text-center">${stockDisplay}</td>
            <td class="text-center">
              <button class="btn btn-sm btn-outline-primary rounded-circle" onclick="openProductModal('edit', '${p.id}')" title="แก้ไข"><i class="fa-solid fa-pen"></i></button>
              <button class="btn btn-sm btn-outline-danger rounded-circle ms-1" onclick="deleteProduct('${p.id}')" title="ลบ"><i class="fa-solid fa-trash-can"></i></button>
            </td>
          </tr>
        `;
      });
    }

    // ระบบค้นหา Table ฝั่ง Client
    function filterTable() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = globalProducts.filter(p => p.name.toLowerCase().includes(query) || p.id.toLowerCase().includes(query));
      renderTable(filtered);
    }

    // เปิด Modal (รองรับทั้งโหมดเพิ่ม และ แก้ไข)
    function openProductModal(mode, id = null) {
      const form = document.getElementById('productForm');
      const title = document.getElementById('modalTitle');
      const editMode = document.getElementById('editMode');
      const oldIdInput = document.getElementById('oldProductId');
      const idField = document.getElementById('prodId');

      form.reset();

      if(mode === 'add') {
        title.innerHTML = '<i class="fa-solid fa-pills me-2"></i> เพิ่มรายการใหม่';
        editMode.value = "false";
        oldIdInput.value = "";
        idField.readOnly = false;
      } else {
        title.innerHTML = '<i class="fa-solid fa-pen-to-square me-2"></i> แก้ไขรายการ';
        editMode.value = "true";
        oldIdInput.value = id;
        idField.readOnly = true; // ไม่ให้แก้ ID หลัก
        
        // ค้นหาข้อมูลเดิมมาเติมลงช่อง
        const product = globalProducts.find(p => p.id === id);
        if(product) {
          idField.value = product.id;
          document.getElementById('prodName').value = product.name;
          document.getElementById('prodType').value = product.type;
          document.getElementById('prodPrice').value = product.price;
          document.getElementById('prodStock').value = product.stock;
          document.getElementById('prodUnit').value = product.unit;
        }
      }

      new bootstrap.Modal(document.getElementById('productModal')).show();
    }

    // บันทึก (แยก Insert / Update)
    function saveProduct() {
      const isEdit = document.getElementById('editMode').value === "true";
      const id = document.getElementById('prodId').value.trim();
      const payload = {
        id: id,
        name: document.getElementById('prodName').value.trim(),
        type: document.getElementById('prodType').value,
        price: parseFloat(document.getElementById('prodPrice').value) || 0,
        stock: parseInt(document.getElementById('prodStock').value) || 0,
        unit: document.getElementById('prodUnit').value.trim()
      };

      if(!payload.id || !payload.name) {
        return Swal.fire('ข้อมูลไม่ครบ', 'กรุณากรอกรหัสและชื่อรายการ', 'warning');
      }

      const url = isEdit ? `/api/products/${id}` : `/api/products`;
      const method = isEdit ? 'PUT' : 'POST';

      fetch(url, {
        method: method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(data => {
        if(data.status === 'success') {
          Swal.fire({ icon: 'success', title: 'บันทึกสำเร็จ', showConfirmButton: false, timer: 1500 });
          bootstrap.Modal.getInstance(document.getElementById('productModal')).hide();
          loadInventory(); // รีเฟรชตาราง
        } else {
          Swal.fire('ข้อผิดพลาด', data.message, 'error');
        }
      });
    }

    // ลบรายการ
    function deleteProduct(id) {
      Swal.fire({
        title: 'ยืนยันการลบ?',
        text: `คุณต้องการลบรายการรหัส ${id} ใช่หรือไม่?`,
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#ef4444',
        cancelButtonColor: '#6c757d',
        confirmButtonText: 'ลบทิ้ง',
        cancelButtonText: 'ยกเลิก'
      }).then((result) => {
        if (result.isConfirmed) {
          fetch(`/api/products/${id}`, { method: 'DELETE' })
          .then(res => res.json())
          .then(data => {
            if(data.status === 'success') {
              Swal.fire({ icon: 'success', title: 'ลบสำเร็จ', showConfirmButton: false, timer: 1500 });
              loadInventory();
            } else {
              Swal.fire('ข้อผิดพลาด', data.message, 'error');
            }
          });
        }
      });
    }
  </script>
</body>
</html>
