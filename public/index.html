<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clinic Management System</title>
  
  <!-- Libraries พื้นฐาน -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; color: #334155; overflow-x: hidden; transition: 0.3s; }
    body.dark-theme { background-color: #0f172a; color: #f1f5f9; }
    
    /* Lock Screen & Numpad */
    #lock-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #f1f5f9 0%, #cbd5e1 100%); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
    body.dark-theme #lock-screen { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); }
    .numpad-container { background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.8); box-shadow: 0 30px 60px rgba(0,0,0,0.15); border-radius: 40px; padding: 40px 30px; width: 90%; max-width: 380px; }
    body.dark-theme .numpad-container { background: rgba(30, 41, 59, 0.65); border-color: rgba(255,255,255,0.1); box-shadow: 0 30px 60px rgba(0,0,0,0.5); }
    .pin-dot { width: 18px; height: 18px; border-radius: 50%; background: rgba(0,0,0,0.1); transition: 0.3s; }
    .pin-dot.filled { background: #3b82f6; transform: scale(1.3); }
    body.dark-theme .pin-dot.filled { background: #60a5fa; }
    .numpad-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .num-btn { background: rgba(255, 255, 255, 0.85); border: 1px solid rgba(255,255,255,0.5); border-radius: 20px; height: 70px; font-size: 26px; font-weight: 800; color: #334155; cursor: pointer; transition: 0.2s; }
    .num-btn:hover { background: #fff; transform: translateY(-4px); box-shadow: 0 10px 20px rgba(59,130,246,0.15); border-color: #3b82f6; color: #3b82f6; }
    body.dark-theme .num-btn { background: rgba(30,41,59,0.8); color: #f1f5f9; border-color: rgba(255,255,255,0.05); }

    /* Main Menu */
    .menu-card-btn { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 24px; padding: 30px 20px; text-align: center; transition: 0.3s; box-shadow: 0 10px 20px rgba(0,0,0,0.02); display: flex; flex-direction: column; align-items: center; cursor: pointer; }
    .menu-card-btn:hover { transform: translateY(-8px); box-shadow: 0 20px 40px rgba(0,0,0,0.08); border-color: #cbd5e1; }
    body.dark-theme .menu-card-btn { background: #1e293b; border-color: #334155; color: #fff; }
    .menu-icon-wrap { width: 70px; height: 70px; border-radius: 20px; display: flex; justify-content: center; align-items: center; font-size: 30px; transition: 0.3s; }
    
    .theme-toggle-btn { position: fixed; bottom: 25px; right: 25px; width: 54px; height: 54px; border-radius: 50%; background: linear-gradient(135deg, #1e40af, #3b82f6); color: #fff; border: none; box-shadow: 0 10px 25px rgba(59,130,246,0.4); z-index: 10000; cursor: pointer; font-size: 20px; }

    /* 🌟 เพิ่ม Class สำหรับเปลี่ยนสี Version เป็นสีดำในโหมดสว่าง และสีขาวในโหมดมืด */
    .version-text { color: #000000; }
    body.dark-theme .version-text { color: #cbd5e1; }
  </style>
</head>
<body>

  <!-- ปุ่มสลับโหมด -->
  <button class="theme-toggle-btn" onclick="toggleTheme()"><i id="theme-icon" class="fa-solid fa-moon"></i></button>

  <!-- 🔒 Numpad Lock Screen -->
  <div id="lock-screen">
    <div class="numpad-container">
      <div class="text-center mb-4">
        <i class="fa-solid fa-user-doctor fa-3x text-primary mb-3"></i>
        <h4 class="fw-bold text-primary">กรุณาใส่รหัสพนักงาน</h4>
        <div class="d-flex justify-content-center gap-3 mt-4" id="pin-display">
          <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
        </div>
      </div>
      <div class="numpad-grid">
        <button class="num-btn" onclick="pressNum('1')">1</button><button class="num-btn" onclick="pressNum('2')">2</button><button class="num-btn" onclick="pressNum('3')">3</button>
        <button class="num-btn" onclick="pressNum('4')">4</button><button class="num-btn" onclick="pressNum('5')">5</button><button class="num-btn" onclick="pressNum('6')">6</button>
        <button class="num-btn" onclick="pressNum('7')">7</button><button class="num-btn" onclick="pressNum('8')">8</button><button class="num-btn" onclick="pressNum('9')">9</button>
        <button class="num-btn text-danger" onclick="pressNum('del')"><i class="fa-solid fa-delete-left"></i></button>
        <button class="num-btn" onclick="pressNum('0')">0</button>
        <button class="num-btn text-secondary fs-6" onclick="pressNum('clear')">C</button>
      </div>
    </div>
  </div>

  <!-- 🏠 Main Menu -->
  <div class="container py-5" id="main-menu" style="display: none; max-width: 800px;">
    <div class="text-center mb-5">
      <h2 class="fw-bold"><i class="fa-solid fa-hospital text-primary me-2"></i> Clinic Management System</h2>
      <div class="d-inline-flex align-items-center bg-white px-4 py-2 mt-2 rounded-pill shadow-sm border dark-bg-fix">
        <div class="bg-success rounded-circle me-2" style="width: 10px; height: 10px;"></div>
        <span class="text-muted fw-bold small me-2">แพทย์/พนักงาน:</span> 
        <span id="display-staff-name" class="fw-bold text-primary">Admin</span>
      </div>
    </div>

    <div class="row g-4">
      <div class="col-6 col-md-4">
        <button class="menu-card-btn w-100 h-100" onclick="openModule('booking.html')">
          <div class="menu-icon-wrap bg-primary bg-opacity-10 text-primary"><i class="fa-solid fa-calendar-check"></i></div>
          <h6 class="fw-bold mt-3 mb-1">นัดหมาย & คิว</h6>
        </button>
      </div>
      <div class="col-6 col-md-4">
        <button class="menu-card-btn w-100 h-100" onclick="openModule('reception.html')">
          <div class="menu-icon-wrap bg-info bg-opacity-10 text-info"><i class="fa-solid fa-clipboard-user"></i></div>
          <h6 class="fw-bold mt-3 mb-1">ลงทะเบียน & คัดกรอง</h6>
        </button>
      </div>
      <div class="col-6 col-md-4">
        <button class="menu-card-btn w-100 h-100" onclick="openModule('doctor.html')">
          <div class="menu-icon-wrap bg-danger bg-opacity-10 text-danger"><i class="fa-solid fa-stethoscope"></i></div>
          <h6 class="fw-bold mt-3 mb-1">ห้องตรวจแพทย์</h6>
        </button>
      </div>
      <div class="col-6 col-md-4">
        <button class="menu-card-btn w-100 h-100" onclick="openModule('pos.html')">
          <div class="menu-icon-wrap bg-success bg-opacity-10 text-success"><i class="fa-solid fa-cash-register"></i></div>
          <h6 class="fw-bold mt-3 mb-1">ขาย & ชำระเงิน</h6>
        </button>
      </div>
      <div class="col-6 col-md-4">
        <button class="menu-card-btn w-100 h-100" onclick="openModule('inventory.html')">
          <div class="menu-icon-wrap bg-warning bg-opacity-10 text-warning"><i class="fa-solid fa-prescription-bottle-medical"></i></div>
          <h6 class="fw-bold mt-3 mb-1">คลังยา (Inventory)</h6>
        </button>
      </div>

<!-- ปุ่มที่ 6 (รายงาน) -->
      <div class="col-6 col-md-4">
        <button class="menu-card-btn w-100 h-100" onclick="openModule('reports.html')">
          <div class="menu-icon-wrap bg-secondary bg-opacity-10 text-secondary"><i class="fa-solid fa-chart-line"></i></div>
          <h6 class="fw-bold mt-3 mb-1">รายงาน (Reports)</h6>
        </button>
      </div>

      <!-- 🌟 ปุ่มที่ 7 ฐานข้อมูลคนไข้ (ต้องอยู่ก่อนแท็ก </div> ปิด row) -->
      <div class="col-6 col-md-4">
        <button class="menu-card-btn w-100 h-100" onclick="openModule('patients_list.html')">
          <div class="menu-icon-wrap bg-dark bg-opacity-10 text-dark"><i class="fa-solid fa-users"></i></div>
          <h6 class="fw-bold mt-3 mb-1">ฐานข้อมูลคนไข้</h6>
        </button>
      </div>

    </div> <!-- 👈 นี่คือ </div> ปิดของ <div class="row g-4"> ต้องอยู่ล่างสุดเสมอ -->

  <!-- 🌟 แถบเมนูด้านล่าง (ติดขอบจอ) -->
  <div class="fixed-bottom pb-4 d-flex justify-content-center align-items-center" style="z-index: 1000;" id="footer-menu">
    <span class="fw-bold version-text">Version 1.0.1</span>
    <span class="mx-3 text-muted opacity-50">|</span>
    
    <!-- 🌟 ปุ่มตั้งค่าที่เพิ่มเข้ามา -->
    <button class="btn btn-link text-secondary fw-bold p-0 text-decoration-none me-3" onclick="openModule('setting.html')" style="font-size: 1.05rem;">
      <i class="fa-solid fa-gear me-1"></i> ตั้งค่า
    </button>

    <button class="btn btn-link text-danger fw-bold p-0 text-decoration-none" onclick="lockSystem()" style="font-size: 1.05rem;">
      <i class="fa-solid fa-lock me-1"></i> ล็อกหน้าจอ
    </button>
  </div>

  <!-- Container สำหรับโหลดหน้าต่างๆ (Module) -->
  <div id="module-container" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: #f8fafc; z-index: 1050; overflow-y: auto;"></div>

  <script>
    let currentPin = "";
    
    function pressNum(val) {
      if(val === 'clear') currentPin = "";
      else if(val === 'del') currentPin = currentPin.slice(0, -1);
      else if(currentPin.length < 4) currentPin += val;
      
      updatePinDisplay();
      
      // เมื่อกดครบ 4 ตัว ให้ส่งไปเช็คกับ Server
      if(currentPin.length === 4) {
        Swal.fire({ title: 'กำลังตรวจสอบ...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

        fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pin: currentPin })
        })
        .then(res => res.json())
        .then(data => {
          if (data.status === 'success') {
            Swal.fire({ icon: 'success', title: 'ยินดีต้อนรับ ' + data.user.name, toast: true, position: 'top-end', showConfirmButton: false, timer: 1500 });
            
            // เปลี่ยนชื่อบนหน้าจอ
            document.getElementById('display-staff-name').innerText = data.user.name;
            
            // สลับหน้าจอ
            document.getElementById('lock-screen').style.display = 'none';
            document.getElementById('main-menu').style.display = 'block';
            document.getElementById('footer-menu').style.display = 'flex'; // แสดงแถบด้านล่าง
            
            // นำสิทธิ์การใช้งาน (Permissions) ไปปลดล็อกปุ่มเมนู
            applyPermissions(data.user.permissions);

          } else {
            Swal.fire({ icon: 'error', title: 'รหัสผิดพลาด', text: data.message, toast: true, position: 'top-end', showConfirmButton: false, timer: 1500 });
          }
          currentPin = "";
          updatePinDisplay();
        })
        .catch(err => {
          Swal.fire({ icon: 'error', title: 'เซิร์ฟเวอร์ไม่ตอบสนอง', text: 'โปรดตรวจสอบการเชื่อมต่อ', toast: true, position: 'top-end', showConfirmButton: false, timer: 2000 });
          currentPin = "";
          updatePinDisplay();
        });
      }
    }

    // เมื่อเปิดหน้าเว็บมา ให้เช็คก่อนว่ามีพนักงานในระบบหรือยัง
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById('footer-menu').style.display = 'none';
      checkFirstSetup();
    });

    async function checkFirstSetup() {
      try {
        const res = await fetch('/api/check-setup');
        const data = await res.json();
        
        // ถ้าเป็นแอปเปล่าๆ (ไม่มีพนักงานเลย)
        if (data.needsSetup) {
          Swal.fire({
            title: '<h4 class="text-primary fw-bold"><i class="fa-solid fa-crown me-2"></i>สร้างผู้ดูแลระบบ</h4>',
            html: `
              <p class="text-muted small">ระบบตรวจพบว่ายังไม่มีผู้ใช้งาน<br>กรุณาสร้างบัญชี Admin เพื่อเริ่มต้นใช้งานระบบ</p>
              <input type="text" id="setup_name" class="form-control mb-3 rounded-3" placeholder="ชื่อ - นามสกุล">
              <input type="text" id="setup_pin" class="form-control mb-2 rounded-3 text-center fs-4 fw-bold" placeholder="ตั้งรหัส PIN 4 หลัก" maxlength="4" pattern="[0-9]*">
            `,
            allowOutsideClick: false,
            allowEscapeKey: false,
            confirmButtonText: 'บันทึกข้อมูล',
            confirmButtonColor: '#3b82f6',
            preConfirm: () => {
              const name = document.getElementById('setup_name').value.trim();
              const pin = document.getElementById('setup_pin').value.trim();
              if (!name || pin.length !== 4 || isNaN(pin)) {
                Swal.showValidationMessage('กรุณากรอกชื่อ และตั้งรหัส PIN เป็นตัวเลข 4 หลัก');
                return false;
              }
              return { name, pin };
            }
          }).then(async (result) => {
            if (result.isConfirmed) {
              Swal.fire({ title: 'กำลังสร้างระบบ...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
              
              const setupRes = await fetch('/api/setup-admin', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(result.value)
              });
              const setupData = await setupRes.json();
              
              if (setupData.status === 'success') {
                Swal.fire({ 
                  icon: 'success', 
                  title: 'ตั้งค่าสำเร็จ!', 
                  text: 'กรุณาใช้รหัส PIN ที่คุณตั้งไว้ เพื่อเข้าสู่ระบบได้เลยครับ', 
                  confirmButtonText: 'ตกลง' 
                });
              } else {
                Swal.fire('เกิดข้อผิดพลาด', setupData.message, 'error');
              }
            }
          });
        }
      } catch(e) {
        console.error('Error checking setup', e);
      }
    }

    function updatePinDisplay() {
      let html = "";
      for(let i=0; i<4; i++) {
        html += i < currentPin.length ? '<div class="pin-dot filled"></div>' : '<div class="pin-dot"></div>';
      }
      document.getElementById('pin-display').innerHTML = html;
    }

    function lockSystem() {
      document.getElementById('main-menu').style.display = 'none';
      document.getElementById('footer-menu').style.display = 'none'; // ซ่อนแถบด้านล่างตอนล็อกหน้าจอ
      document.getElementById('lock-screen').style.display = 'flex';
    }

    function toggleTheme() {
      document.body.classList.toggle('dark-theme');
      const icon = document.getElementById('theme-icon');
      icon.className = document.body.classList.contains('dark-theme') ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
      
      // ปรับสีกล่องชื่อพนักงานให้เข้ากับ Dark Mode
      const nameBox = document.querySelector('.dark-bg-fix');
      if(document.body.classList.contains('dark-theme')) {
        nameBox.classList.remove('bg-white'); nameBox.classList.add('bg-dark');
      } else {
        nameBox.classList.remove('bg-dark'); nameBox.classList.add('bg-white');
      }
    }

    // ฟังก์ชันโหลด Module แบบ SPA (ดึงไฟล์ HTML อื่นมาแปะหน้าจอ)
    async function openModule(pageUrl) {
      Swal.fire({ title: 'กำลังโหลด...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
      try {
        const response = await fetch('/' + pageUrl);
        const html = await response.text();
        const container = document.getElementById('module-container');
        container.innerHTML = html;
        container.style.display = 'block';
        
        // รัน Script ที่ติดมากับไฟล์ HTML ย่อย
        const scripts = container.querySelectorAll('script');
        scripts.forEach(script => {
          const newScript = document.createElement('script');
          newScript.innerHTML = script.innerHTML;
          document.body.appendChild(newScript);
        });
        Swal.close();
      } catch (e) {
        Swal.fire('Error', 'ไม่สามารถโหลดหน้าจอได้', 'error');
      }
    }

    function closeModule() {
      // 🛑 หยุดระบบ Auto-refresh ของทุกหน้าเมื่อกดปิด ป้องกันเน็ตเวิร์คทำงานซ้ำซ้อน
      if(window.bookingInterval) clearInterval(window.bookingInterval);
      if(window.emrQueueInterval) clearInterval(window.emrQueueInterval);
      if(window.posQueueInterval) clearInterval(window.posQueueInterval);

      document.getElementById('module-container').innerHTML = '';
      document.getElementById('module-container').style.display = 'none';
    }
  </script>
</body>
</html>
