<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>เข้าสู่ระบบ - SaaS POS System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    * { font-family: 'Kanit', sans-serif; }
    body {
      background: linear-gradient(135deg, #f5f7fc 0%, #eef2f9 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin: 0;
      padding: 20px;
    }
    .login-card {
      background: #ffffff;
      border-radius: 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.04), 0 10px 20px rgba(79, 101, 246, 0.05);
      width: 100%;
      max-width: 420px;
      padding: 40px 32px 30px 32px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.8);
    }
    .logo-box {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, #4f75ff 0%, #3a54d6 100%);
      border-radius: 22px;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 32px;
      box-shadow: 0 10px 20px rgba(79, 117, 255, 0.35);
      margin-bottom: 20px;
      transform: rotate(-5deg);
    }
    .input-custom-group {
      background-color: #eaf0fa;
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 14px;
      border: 1px solid transparent;
      transition: all 0.2s ease;
    }
    .input-custom-group:focus-within {
      border-color: #4f75ff;
      background-color: #e4ecf9;
    }
    .input-custom-group .input-group-text {
      background: transparent;
      border: none;
      color: #334155;
      padding-left: 18px;
      padding-right: 12px;
    }
    .input-custom-group .form-control {
      background: transparent;
      border: none;
      padding: 14px 16px 14px 0;
      font-size: 16px;
      color: #1e293b;
    }
    .input-custom-group .form-control:focus {
      box-shadow: none;
    }
    .btn-login {
      background: linear-gradient(135deg, #4f75ff 0%, #3b52e2 100%);
      color: white;
      border: none;
      border-radius: 16px;
      padding: 14px;
      font-size: 18px;
      font-weight: 500;
      width: 100%;
      margin-top: 8px;
      box-shadow: 0 8px 20px rgba(79, 117, 255, 0.3);
      transition: all 0.2s ease;
    }
    .btn-login:hover {
      transform: translateY(-2deg);
      box-shadow: 0 12px 24px rgba(79, 117, 255, 0.4);
      color: white;
    }
    .sub-links {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 24px;
      font-size: 14px;
    }
    .sub-links a {
      color: #0284c7;
      text-decoration: none;
      font-weight: 400;
    }
    .sub-links a:hover {
      text-decoration: underline;
    }
    .line-btn {
      color: #00b900;
      font-weight: 500;
      text-decoration: none;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .line-btn:hover {
      color: #009900;
      text-decoration: underline;
    }
    .footer-text {
      margin-top: 30px;
      color: #94a3b8;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <!-- โลโก้สายฟ้า -->
    <div class="logo-box">
      <i class="fa-solid fa-bolt"></i>
    </div>

    <!-- หัวข้อ -->
    <h3 class="fw-bold text-dark mb-1">SaaS POS System</h3>
    <p class="text-muted small mb-4">เข้าสู่ระบบจัดการร้านค้าของคุณ</p>

    <!-- ฟอร์มเข้าสู่ระบบ -->
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="input-custom-group d-flex align-items-center">
        <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
        <input type="text" id="contactInput" class="form-control" placeholder="อีเมล / เบอร์โทรศัพท์" required autocomplete="off">
      </div>

      <div class="input-custom-group d-flex align-items-center">
        <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
        <input type="password" id="passwordInput" class="form-control" placeholder="รหัสผ่าน" required autocomplete="off">
      </div>

      <button type="submit" class="btn btn-login">
        เข้าสู่ระบบ <i class="fa-solid fa-arrow-right ms-1"></i>
      </button>
    </form>

    <!-- ลิงก์ย่อย -->
    <div class="sub-links">
      <a href="/download"><i class="fa-brand fa-android text-success me-1"></i> ดาวน์โหลดแอป</a>
      <a href="#" onclick="alert('กรุณาติดต่อแอดมินเพื่อรีเซ็ตรหัสผ่าน')"><i class="fa-solid fa-key text-warning me-1"></i> ลืมรหัส</a>
      <a href="#" onclick="alert('ระบบลงทะเบียนปิดปรับปรุงชั่วคราว')"><i class="fa-solid fa-user-plus text-info me-1"></i> สมัครฟรี</a>
    </div>

    <hr class="my-3 opacity-25">

    <!-- ปุ่มไลน์ติดต่อ -->
    <div>
      <a href="https://line.me" target="_blank" class="line-btn">
        <i class="fa-brands fa-line fs-5"></i> ติดต่อแอดมิน / แจ้งปัญหา
      </a>
    </div>
  </div>

  <div class="footer-text">
    © 2026 POS Management System
  </div>

  <script>
    function handleLogin(e) {
      e.preventDefault();
      const contact = document.getElementById('contactInput').value.trim();
      const password = document.getElementById('passwordInput').value.trim();

      Swal.fire({
        title: 'กำลังตรวจสอบข้อมูล...',
        allowOutsideClick: false,
        didOpen: () => { Swal.showLoading(); }
      });

      fetch('/api/login-shop', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contact, password })
      })
      .then(res => res.json())
      .then(data => {
        if (data.status === 'success') {
          sessionStorage.setItem('pos_sheet_id', data.sheetId);
          sessionStorage.setItem('pos_shop_name', data.shopName);
          window.location.href = '/shop';
        } else if (data.status === 'superadmin') {
          sessionStorage.setItem('superadmin_token', data.token);
          window.location.href = '/superadmin';
        } else {
          Swal.fire('เข้าสู่ระบบไม่สำเร็จ', data.message || 'ข้อมูลไม่ถูกต้อง', 'error');
        }
      })
      .catch(err => {
        Swal.fire('ข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้', 'error');
      });
    }
  </script>
</body>
</html>
