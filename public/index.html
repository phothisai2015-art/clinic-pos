<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign In - Smart Clinic POS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    * { font-family: 'Kanit', sans-serif; }
    body {
      background: linear-gradient(135deg, #f5f7fc 0%, #eef2f9 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin: 0;
      padding: 20px;
    }
    .login-card {
      background: #ffffff;
      border-radius: 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.04), 0 10px 20px rgba(79, 101, 246, 0.05);
      width: 100%;
      max-width: 420px;
      padding: 45px 32px 40px 32px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.8);
    }
    .logo-box {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, #4f75ff 0%, #3a54d6 100%);
      border-radius: 22px;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 32px;
      box-shadow: 0 10px 20px rgba(79, 117, 255, 0.35);
      margin-bottom: 24px;
      transform: rotate(-5deg);
    }
    .input-custom-group {
      background-color: #eaf0fa;
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 16px;
      border: 1px solid transparent;
      transition: all 0.2s ease;
    }
    .input-custom-group:focus-within {
      border-color: #4f75ff;
      background-color: #e4ecf9;
    }
    .input-custom-group .input-group-text {
      background: transparent;
      border: none;
      color: #334155;
      padding-left: 18px;
      padding-right: 12px;
    }
    .input-custom-group .form-control {
      background: transparent;
      border: none;
      padding: 14px 16px 14px 0;
      font-size: 16px;
      color: #1e293b;
    }
    .input-custom-group .form-control:focus {
      box-shadow: none;
    }
    .btn-login {
      background: linear-gradient(135deg, #4f75ff 0%, #3b52e2 100%);
      color: white;
      border: none;
      border-radius: 16px;
      padding: 14px;
      font-size: 18px;
      font-weight: 500;
      width: 100%;
      margin-top: 10px;
      box-shadow: 0 8px 20px rgba(79, 117, 255, 0.3);
      transition: all 0.2s ease;
    }
    .btn-login:hover {
      transform: translateY(-2deg);
      box-shadow: 0 12px 24px rgba(79, 117, 255, 0.4);
      color: white;
    }
    .footer-text {
      margin-top: 30px;
      color: #94a3b8;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <!-- Clinic Logo Icon -->
    <div class="logo-box">
      <i class="fa-solid fa-hospital-user"></i>
    </div>

    <!-- Title for Clinic System -->
    <h3 class="fw-bold text-dark mb-4">Smart Clinic POS</h3>

    <!-- Login Form -->
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="input-custom-group d-flex align-items-center">
        <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
        <input type="text" id="contactInput" class="form-control" placeholder="Email or Phone Number" required autocomplete="off">
      </div>

      <div class="input-custom-group d-flex align-items-center">
        <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
        <input type="password" id="passwordInput" class="form-control" placeholder="Password" required autocomplete="off">
      </div>

      <button type="submit" class="btn btn-login">
        Sign In <i class="fa-solid fa-arrow-right ms-1"></i>
      </button>
    </form>
  </div>

  <div class="footer-text">
    © 2026 Smart Clinic System. All rights reserved.
  </div>

  <script>
    function handleLogin(e) {
      e.preventDefault();
      const contact = document.getElementById('contactInput').value.trim();
      const password = document.getElementById('passwordInput').value.trim();

      Swal.fire({
        title: 'Authenticating...',
        allowOutsideClick: false,
        didOpen: () => { Swal.showLoading(); }
      });

      fetch('/api/login-shop', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contact, password })
      })
      .then(res => res.json())
      .then(data => {
        if (data.status === 'success') {
          sessionStorage.setItem('pos_sheet_id', data.sheetId);
          sessionStorage.setItem('pos_shop_name', data.shopName);
          window.location.href = '/shop';
        } else if (data.status === 'superadmin') {
          sessionStorage.setItem('superadmin_token', data.token);
          window.location.href = '/superadmin';
        } else {
          Swal.fire('Login Failed', data.message || 'Invalid credentials', 'error');
        }
      })
      .catch(err => {
        Swal.fire('Error', 'Unable to connect to server', 'error');
      });
    }
	
	function handleLogin(e) {
      e.preventDefault();
      // ดึงค่าจากช่องกรอก
      const contact = document.getElementById('contactInput').value.trim();
      const password = document.getElementById('passwordInput').value.trim();

      Swal.fire({
        title: 'Authenticating...',
        allowOutsideClick: false,
        didOpen: () => { Swal.showLoading(); }
      });

      // เปลี่ยนมาเรียกใช้ /api/login ให้ตรงกับ server.js
      fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: contact, password: password }) // ส่งค่า username และ password
      })
      .then(res => res.json())
      .then(data => {
        if (data.status === 'success') {
          // เก็บข้อมูล User ไว้ในระบบ
          sessionStorage.setItem('user_name', data.user.name);
          sessionStorage.setItem('user_role', data.user.role);
          
          Swal.fire({
            icon: 'success',
            title: 'Welcome!',
            text: 'เข้าสู่ระบบสำเร็จ',
            timer: 1500,
            showConfirmButton: false
          }).then(() => {
            // วิ่งไปที่หน้า dashboard ของคลินิก
            window.location.href = '/dashboard';
          });
        } else {
          Swal.fire('Login Failed', data.message || 'Invalid credentials', 'error');
        }
      })
      .catch(err => {
        Swal.fire('Error', 'Unable to connect to server', 'error');
      });
    }
	
  </script>
</body>
</html>
