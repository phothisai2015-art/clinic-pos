<div id="page-emr" style="display: none; background: #f8fafc; height: 100vh; position: absolute; top: 0; left: 0; width: 100%; z-index: 1040; overflow-y: auto;">
  <div class="d-flex justify-content-between align-items-center mb-3 mt-2 px-4">
    <h3 class="fw-bold text-primary m-0"><i class="fa-solid fa-clipboard-user me-2"></i> ทะเบียนคนไข้ & เวชระเบียน (EMR)</h3>
    <div class="d-flex gap-2">
      <button class="btn btn-primary fw-bold rounded-pill shadow-sm" onclick="openNewPatientModal()">
        <i class="fa-solid fa-user-plus me-1"></i> ลงทะเบียนคนไข้ใหม่
      </button>
      <button class="btn btn-outline-danger fw-bold rounded-pill px-4" onclick="closePage('page-emr')">กลับ</button>
    </div>
  </div>

  <div class="container-fluid px-4">
    <div class="row g-3">
      <div class="col-lg-4">
        <div class="bg-white p-3 rounded-4 shadow-sm border h-100">
          <div class="input-group mb-3">
            <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-search text-muted"></i></span>
            <input type="text" class="form-control border-start-0 bg-light" placeholder="ค้นหา HN, ชื่อ, เบอร์โทร..." id="emr-search-input" oninput="filterEMRPatients()">
          </div>
          <div class="list-group list-group-flush pe-2" id="emr-patient-list" style="max-height: 75vh; overflow-y: auto;">
            </div>
        </div>
      </div>

      <div class="col-lg-8" id="emr-detail-view" style="display: none;">
        <div class="bg-white p-4 rounded-4 shadow-sm border h-100 d-flex flex-column">
          <div class="alert alert-danger d-flex align-items-center fw-bold" role="alert" id="emr-allergy-alert" style="display: none !important;">
            <i class="fa-solid fa-triangle-exclamation fa-2x me-3"></i>
            <div>
              <div class="fs-5">ระวัง! คนไข้มีประวัติแพ้ยา / โรคประจำตัว</div>
              <div id="emr-allergy-text" class="fw-normal mt-1">-</div>
            </div>
          </div>

          <div class="row mb-4 align-items-center border-bottom pb-3">
            <div class="col-md-6">
              <h3 class="fw-bold text-dark m-0" id="emr-patient-name">-</h3>
              <div class="text-muted mt-2">
                <span class="badge bg-primary fs-6 me-2" id="emr-patient-hn">-</span>
                <i class="fa-solid fa-phone"></i> <span id="emr-patient-phone">-</span> | 
                <i class="fa-solid fa-cake-candles"></i> <span id="emr-patient-dob">-</span>
              </div>
            </div>
            <div class="col-md-6 text-end">
              <button class="btn btn-success fw-bold rounded-3 shadow-sm" onclick="openAddEMRModal()"><i class="fa-solid fa-notes-medical me-1"></i> บันทึกประวัติการรักษา</button>
            </div>
          </div>

          <h5 class="fw-bold text-secondary mb-3"><i class="fa-solid fa-file-medical text-info"></i> ประวัติการรักษา (Treatment History)</h5>
          <div id="emr-history-container" class="d-flex flex-column gap-3 flex-grow-1 pe-2" style="overflow-y: auto;">
            </div>
        </div>
      </div>

      <div class="col-lg-8" id="emr-empty-view">
        <div class="bg-light p-4 rounded-4 border h-100 d-flex flex-column justify-content-center align-items-center text-muted">
          <i class="fa-solid fa-folder-open fa-5x mb-3 opacity-25"></i>
          <h4>กรุณาเลือกคนไข้เพื่อดูประวัติ</h4>
        </div>
      </div>

    </div>
  </div>
</div>

<div class="modal fade" id="modal-add-emr" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content rounded-4 border-0 shadow-lg">
      <div class="modal-header bg-success text-white rounded-top-4">
        <h5 class="modal-title fw-bold"><i class="fa-solid fa-notes-medical me-2"></i>บันทึกประวัติการรักษาใหม่</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-4">
        <input type="hidden" id="add-emr-patient-id">
        <div class="mb-3">
          <label class="form-label fw-bold">อาการสำคัญ (Symptoms)</label>
          <textarea class="form-control bg-light" id="add-emr-symptoms" rows="2" placeholder="เช่น คนไข้มีสิวอุดตันบริเวณคาง"></textarea>
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold">การวินิจฉัย (Diagnosis)</label>
          <textarea class="form-control bg-light" id="add-emr-diagnosis" rows="2" placeholder="เช่น สิวอักเสบระดับ 2"></textarea>
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold text-primary">หัตถการ / การรักษา (Treatment)</label>
          <textarea class="form-control border-primary" id="add-emr-treatment" rows="3" placeholder="เช่น กดสิว, ฉีดมาเด้ 1 เข็ม"></textarea>
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold text-muted">หมายเหตุ / นัดครั้งต่อไป</label>
          <input type="text" class="form-control" id="add-emr-notes" placeholder="เช่น นัดดูอาการอีก 1 สัปดาห์">
        </div>
      </div>
      <div class="modal-footer bg-light rounded-bottom-4">
        <button type="button" class="btn btn-secondary fw-bold" data-bs-dismiss="modal">ยกเลิก</button>
        <button type="button" class="btn btn-success fw-bold" onclick="saveEMR()"><i class="fa-solid fa-save me-1"></i> บันทึกข้อมูลรักษา</button>
      </div>
    </div>
  </div>
</div>

<script>
  let currentViewingPatient = null;

  // 🌟 ถูกย้ายมารวมไว้ที่ shop.html (เป็นศูนย์กลาง)
  // แต่หน้า EMR ใช้ filterEMRPatients เพื่อกรองหน้าจอทันที
  function filterEMRPatients() {
    let kw = document.getElementById('emr-search-input').value.toLowerCase();
    const container = document.getElementById('emr-patient-list');
    container.innerHTML = '';
    
    let filtered = window.clinicPatientsList.filter(p => p.hn_code.toLowerCase().includes(kw) || p.first_name.toLowerCase().includes(kw) || p.phone.includes(kw));

    if(filtered.length === 0) {
      container.innerHTML = '<div class="text-center text-muted p-3">ไม่พบข้อมูลคนไข้</div>';
      return;
    }

    filtered.forEach(p => {
      container.innerHTML += `
        <button class="list-group-item list-group-item-action p-3 rounded-3 mb-2 border shadow-sm" onclick="viewPatientEMR(${p.id})">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <h6 class="mb-0 fw-bold text-dark">${p.prefix}${p.first_name} ${p.last_name}</h6>
            <span class="badge bg-primary">${p.hn_code}</span>
          </div>
          <small class="text-muted"><i class="fa-solid fa-phone me-1"></i> ${p.phone}</small>
        </button>
      `;
    });
  }

  function viewPatientEMR(id) {
    currentViewingPatient = window.clinicPatientsList.find(p => p.id === id);
    if(!currentViewingPatient) return;

    document.getElementById('emr-empty-view').style.display = 'none';
    document.getElementById('emr-detail-view').style.display = 'block';

    document.getElementById('emr-patient-name').innerText = `${currentViewingPatient.prefix}${currentViewingPatient.first_name} ${currentViewingPatient.last_name}`;
    document.getElementById('emr-patient-hn').innerText = currentViewingPatient.hn_code;
    document.getElementById('emr-patient-phone').innerText = currentViewingPatient.phone;
    document.getElementById('emr-patient-dob').innerText = currentViewingPatient.birthdate || 'ไม่ระบุ';

    let allergyStr = "";
    if(currentViewingPatient.allergy && currentViewingPatient.allergy !== '-') allergyStr += "แพ้ยา: " + currentViewingPatient.allergy + "<br>";
    if(currentViewingPatient.congenital_disease && currentViewingPatient.congenital_disease !== '-') allergyStr += "โรคประจำตัว: " + currentViewingPatient.congenital_disease;

    if(allergyStr !== "") {
       document.getElementById('emr-allergy-alert').style.setProperty('display', 'flex', 'important');
       document.getElementById('emr-allergy-text').innerHTML = allergyStr;
    } else {
       document.getElementById('emr-allergy-alert').style.setProperty('display', 'none', 'important');
    }

    document.getElementById('emr-history-container').innerHTML = '<div class="text-center text-muted p-4"><i class="fa-solid fa-spinner fa-spin"></i> กำลังโหลดประวัติ...</div>';
    google.script.run.withSuccessHandler((records) => {
       const hBox = document.getElementById('emr-history-container');
       hBox.innerHTML = '';
       if(!records || records.length === 0) {
         hBox.innerHTML = '<div class="text-center text-muted p-4 border rounded-3 bg-light">ยังไม่มีประวัติการรักษา</div>';
         return;
       }
       records.forEach(r => {
         let dateObj = new Date(r.visit_date);
         let fDate = `${dateObj.getDate()}/${dateObj.getMonth()+1}/${dateObj.getFullYear()}`;
         hBox.innerHTML += `
            <div class="card border border-primary border-opacity-25 shadow-sm p-3 rounded-3">
              <div class="d-flex justify-content-between mb-2 border-bottom pb-2">
                <span class="badge bg-primary fs-6"><i class="fa-regular fa-calendar"></i> ${fDate}</span>
              </div>
              <p class="mb-1"><strong class="text-dark">อาการ:</strong> <span class="text-muted">${r.symptoms || '-'}</span></p>
              <p class="mb-1"><strong class="text-dark">วินิจฉัย:</strong> <span class="text-muted">${r.diagnosis || '-'}</span></p>
              <div class="bg-light p-2 rounded-2 mt-2">
                <strong class="text-primary">หัตถการ/การรักษา:</strong><br>
                <span class="text-dark fw-bold">${r.treatment || '-'}</span>
              </div>
              ${r.notes ? `<p class="mb-0 mt-2 small text-muted fst-italic">* ${r.notes}</p>` : ''}
            </div>
         `;
       });
    }).getEMR(currentTenantSheetId, id);
  }

  function openAddEMRModal() {
    if(!currentViewingPatient) return;
    document.getElementById('add-emr-patient-id').value = currentViewingPatient.id;
    document.getElementById('add-emr-symptoms').value = '';
    document.getElementById('add-emr-diagnosis').value = '';
    document.getElementById('add-emr-treatment').value = '';
    document.getElementById('add-emr-notes').value = '';
    new bootstrap.Modal(document.getElementById('modal-add-emr')).show();
  }

  function saveEMR() {
    const record = {
      patient_id: document.getElementById('add-emr-patient-id').value,
      doctor_id: currentStaff.pin, 
      symptoms: document.getElementById('add-emr-symptoms').value,
      diagnosis: document.getElementById('add-emr-diagnosis').value,
      treatment: document.getElementById('add-emr-treatment').value,
      notes: document.getElementById('add-emr-notes').value,
      images_json: "[]"
    };

    if(!record.treatment) return Swal.fire('ข้อมูลไม่ครบ', 'กรุณากรอก หัตถการ/การรักษา', 'warning');

    Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
    google.script.run.withSuccessHandler((res) => {
       if(res.status === 'success') {
         Swal.fire({icon: 'success', title: 'บันทึกประวัติเรียบร้อย', timer: 1000, showConfirmButton: false});
         bootstrap.Modal.getInstance(document.getElementById('modal-add-emr')).hide();
         viewPatientEMR(currentViewingPatient.id); 
       } else {
         Swal.fire('ผิดพลาด', res.message, 'error');
       }
    }).addEMR(currentTenantSheetId, record);
  }
</script>
