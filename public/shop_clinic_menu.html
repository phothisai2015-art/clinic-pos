<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Smart Clinic POS - Menu</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    * { font-family: 'Kanit', sans-serif; }
    body { background: linear-gradient(135deg, #f5f7fc 0%, #eef2f9 100%); margin: 0; min-height: 100vh; overflow-x: hidden; }
    
    /* Numpad Glassmorphism */
    #lock-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(15px); z-index: 9999; display: flex; justify-content: center; align-items: center; transition: opacity 0.4s ease; }
    .numpad-container { position: relative; z-index: 10; width: 90%; max-width: 380px; background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.8); box-shadow: 0 30px 60px rgba(0, 0, 0, 0.15); border-radius: 40px; padding: 40px 30px; animation: popIn 0.5s ease forwards; }
    @keyframes popIn { 0% { opacity: 0; transform: translateY(30px) scale(0.95); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
    .error-shake { animation: shakeError 0.4s ease-in-out; }
    @keyframes shakeError { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }
    
    .pin-display { display: flex; justify-content: center; gap: 15px; margin-bottom: 35px; height: 30px; }
    .pin-dot { width: 18px; height: 18px; border-radius: 50%; background: rgba(0, 0, 0, 0.1); transition: all 0.2s; }
    .pin-dot.filled { background: #3b82f6; transform: scale(1.3); box-shadow: 0 0 10px rgba(59, 130, 246, 0.5); }
    .pin-dot.bg-danger { background: #ef4444 !important; }

    .numpad-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .num-btn { background: rgba(255, 255, 255, 0.85); border: 1px solid rgba(255, 255, 255, 0.5); border-radius: 20px; height: 75px; font-size: 26px; font-weight: 800; color: #334155; cursor: pointer; transition: 0.2s; }
    .num-btn:active { transform: scale(0.95); }
    .num-btn-del { color: #ef4444; background: rgba(254, 242, 242, 0.8); }

    /* เมนูหลัก */
    .menu-card-btn { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 24px; padding: 30px 20px; text-align: center; transition: all 0.3s; box-shadow: 0 10px 20px rgba(0,0,0,0.02); display: flex; flex-direction: column; align-items: center; cursor: pointer; width: 100%; }
    .menu-card-btn:hover { transform: translateY(-8px); box-shadow: 0 20px 40px rgba(0,0,0,0.08); border-color: #cbd5e1; }
    .menu-icon-wrap { width: 70px; height: 70px; border-radius: 20px; display: flex; justify-content: center; align-items: center; font-size: 30px; margin-bottom: 15px; transition: 0.3s; }
    .menu-card-btn:hover .menu-icon-wrap { transform: scale(1.1) rotate(5deg); }
  </style>
</head>
<body>

  <div id="lock-screen">
    <div class="numpad-container" id="numpad-box">
      <div class="text-center">
        <h4 class="fw-bold text-primary mb-2"><i class="fa-solid fa-user-doctor mb-2 fa-2x"></i><br>กรุณาใส่รหัสพนักงาน</h4>
        <p class="text-muted small mb-4">ระบบล็อกอัตโนมัติเพื่อความปลอดภัย</p>
        <div class="pin-display" id="pin-display">
          <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
        </div>
      </div>
      <div class="numpad-grid">
        <button class="num-btn" onclick="pressNum('1')">1</button>
        <button class="num-btn" onclick="pressNum('2')">2</button>
        <button class="num-btn" onclick="pressNum('3')">3</button>
        <button class="num-btn" onclick="pressNum('4')">4</button>
        <button class="num-btn" onclick="pressNum('5')">5</button>
        <button class="num-btn" onclick="pressNum('6')">6</button>
        <button class="num-btn" onclick="pressNum('7')">7</button>
        <button class="num-btn" onclick="pressNum('8')">8</button>
        <button class="num-btn" onclick="pressNum('9')">9</button>
        <button class="num-btn num-btn-del" onclick="pressNum('del')"><i class="fa-solid fa-delete-left"></i></button>
        <button class="num-btn" onclick="pressNum('0')">0</button>
        <button class="num-btn" onclick="pressNum('clear')" style="color: #64748b; font-size: 16px;">C</button>
      </div>
    </div>
  </div>

  <div class="container py-5" style="max-width: 800px;">
    <div class="text-center mb-5">
      <h2 class="fw-bold text-dark"><i class="fa-solid fa-hospital text-primary me-2"></i> Smart Clinic POS </h2>
      <div class="d-inline-flex align-items-center bg-white px-4 py-2 mt-2 rounded-pill shadow-sm border">
        <div class="bg-success rounded-circle me-2" style="width: 10px; height: 10px;"></div>
        <span class="text-muted fw-bold small me-2">พนักงาน:</span> 
        <span id="display-staff-name" class="fw-bold text-primary">กำลังโหลด...</span>
      </div>
    </div>

    <div class="row g-4">
      <div class="col-6 col-md-6">
        <button class="menu-card-btn" onclick="window.location.href='/patients'">
          <div class="menu-icon-wrap bg-info bg-opacity-10 text-info"><i class="fa-solid fa-users-medical"></i></div>
          <h5 class="fw-bold mb-1">ประวัติคนไข้</h5>
          <span class="small text-muted">OPD Card & ลงทะเบียน</span>
        </button>
      </div>
      <div class="col-6 col-md-6">
        <button class="menu-card-btn" onclick="window.location.href='/queue'">
          <div class="menu-icon-wrap bg-warning bg-opacity-10 text-warning"><i class="fa-solid fa-clipboard-list"></i></div>
          <h5 class="fw-bold mb-1">กระดานคิว</h5>
          <span class="small text-muted">จัดการคิวรอตรวจ</span>
        </button>
      </div>
      <div class="col-6 col-md-6">
        <button class="menu-card-btn" onclick="window.location.href='/doctor'">
          <div class="menu-icon-wrap bg-danger bg-opacity-10 text-danger"><i class="fa-solid fa-user-doctor-message"></i></div>
          <h5 class="fw-bold mb-1">ห้องตรวจ</h5>
          <span class="small text-muted">วินิจฉัย & สั่งยา</span>
        </button>
      </div>
      <div class="col-6 col-md-6">
        <button class="menu-card-btn" onclick="window.location.href='/pos'">
          <div class="menu-icon-wrap bg-success bg-opacity-10 text-success"><i class="fa-solid fa-cash-register"></i></div>
          <h5 class="fw-bold mb-1">แคชเชียร์</h5>
          <span class="small text-muted">ชำระเงิน & จ่ายยา</span>
        </button>
      </div>
    </div>
    
    <div class="text-center mt-5">
      <button class="btn btn-outline-danger rounded-pill px-4" onclick="lockScreen()"><i class="fa-solid fa-lock me-2"></i>ล็อกหน้าจอ</button>
      <button class="btn btn-outline-secondary rounded-pill px-4 ms-2" onclick="window.location.href='/'"><i class="fa-solid fa-right-from-bracket me-2"></i>ออกจากระบบ</button>
    </div>
  </div>

  <script>
    let currentPin = "";
    let isCheckingPin = false;

    function pressNum(val) {
      if (isCheckingPin) return;
      if (val === 'clear') { currentPin = ""; } 
      else if (val === 'del') { currentPin = currentPin.slice(0, -1); } 
      else { if (currentPin.length < 4) currentPin += val; }
      
      updatePinDisplay();

      if (currentPin.length === 4) {
        isCheckingPin = true;
        setTimeout(() => checkPinCode(currentPin), 150);
      }
    }

    function updatePinDisplay() {
      let html = "";
      for(let i = 0; i < 4; i++) {
        html += (i < currentPin.length) ? '<div class="pin-dot filled"></div>' : '<div class="pin-dot"></div>';
      }
      document.getElementById('pin-display').innerHTML = html;
    }

    function checkPinCode(pin) {
      // ยิง API ไปเช็กรหัสที่ Node.js
      fetch('/api/login-pin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pin: pin })
      })
      .then(res => res.json())
      .then(data => {
        if (data.status === 'success') {
          // รหัสถูก!
          document.getElementById('display-staff-name').innerText = data.user.name;
          document.getElementById('lock-screen').style.opacity = '0';
          setTimeout(() => { document.getElementById('lock-screen').style.display = 'none'; }, 400);
          
          Swal.fire({ icon: 'success', title: 'เข้าใช้งานโดย: ' + data.user.name, toast: true, position: 'top-end', showConfirmButton: false, timer: 1500 });
          currentPin = ""; updatePinDisplay(); isCheckingPin = false;
        } else {
          // รหัสผิด!
          let numpad = document.getElementById('numpad-box');
          numpad.classList.add('error-shake');
          document.getElementById('pin-display').innerHTML = '<div class="pin-dot filled bg-danger" style="box-shadow: 0 0 15px rgba(239,68,68,0.6);"></div>'.repeat(4);
          
          setTimeout(() => { 
            numpad.classList.remove('error-shake'); 
            currentPin = ""; updatePinDisplay(); isCheckingPin = false; 
          }, 400);
        }
      });
    }

    function lockScreen() {
      currentPin = ""; updatePinDisplay();
      document.getElementById('lock-screen').style.display = 'flex';
      setTimeout(() => { document.getElementById('lock-screen').style.opacity = '1'; }, 10);
    }
  </script>
</body>
</html>
