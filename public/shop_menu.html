<script>

// 🌟 โหลดไฟล์เสียง "ปุ่มเกมส์" มารอไว้เลย (ใช้แค่เสียงเดียว)
const btnSound = new Audio('/sould/freesound_gamestudio-button-394464.mp3');
btnSound.volume = 1.0;

function playToneSound() {
  try {
    btnSound.currentTime = 0; // กลับไปเริ่มที่ 0 ทันที (แก้ปัญหาเสียงหน่วงเวลากดรัวๆ)
    btnSound.play().catch(e => console.warn("Audio play blocked:", e));
  } catch (e) {
    console.warn("Audio play error:", e);
  }
}


  
// ⚙️ Script สำหรับหน้าหลัก การล็อกอิน และแมวเดิน
let currentTenantSheetId = "";
let globalUsers = []; let currentStaff = { name: "Unknown", permissions: "" }; let currentPin = "";
let globalDaysRemaining = null; 

// ========================================================
// 🌟 ระบบ Real-time: เช็คการอนุมัติแพ็กเกจอัตโนมัติ
// ========================================================
let renewPollingInterval = null;

let shopLogoutTimeout;

function forceShopLogout() {
  localStorage.removeItem('saas_tenant_id'); 
  localStorage.removeItem('saas_shop_name'); 
  localStorage.removeItem('pos_lock_time');
  sessionStorage.removeItem('pos_active_staff');
  sessionStorage.removeItem('shop_owner_warned');
  sessionStorage.removeItem('pos_current_page');
  window.location.href = '/'; 
}

function checkMaxLockTimeExceeded() {
  let lockTime = localStorage.getItem('pos_lock_time');
  if (lockTime) {
    let diffHours = (Date.now() - parseInt(lockTime)) / (1000 * 60 * 60);
    if (diffHours >= 6) { 
      forceShopLogout();
      return true;
    }
  }
  return false;
}

// ดักจับเมื่อเปิดจอมือถือ/iPad กลับขึ้นมา หรือสลับ Tab กลับมา
document.addEventListener("visibilitychange", function() {
  if (!document.hidden) { 
    checkMaxLockTimeExceeded();
  }
});
// 🌟 ========================================================= 🌟

function startRenewPolling() {
  if (renewPollingInterval) clearInterval(renewPollingInterval);
  
  renewPollingInterval = setInterval(() => {
    if (!currentTenantSheetId) {
      clearInterval(renewPollingInterval);
      return;
    }
    google.script.run.withSuccessHandler(function(info) {
      if (info && !info.error) {
        globalDaysRemaining = info.daysRemaining;
        
        // 🌟 แก้ไขจุดที่หาตัวอักษรไม่เจอ
        let expDateEl = document.getElementById('setting-exp-date');
        let renewBtn = document.getElementById('btn-open-renew');

        if (expDateEl) {
           expDateEl.innerText = info.expireDate;
           // ค้นหาตำแหน่งบรรทัดแบบใหม่ (หาบรรทัดถัดไปแทน ป้องกันการหาไม่เจอ)
           let statusP = expDateEl.parentElement.nextElementSibling;
           if (statusP) {
              if (info.daysRemaining < 0) {
                 statusP.innerHTML = i18n[currentLang]['set_status_expired'] || 'หมดอายุแล้ว!';
              } else if (info.daysRemaining === 0) {
                 statusP.innerHTML = i18n[currentLang]['set_status_expire_today'] || 'หมดอายุวันนี้!';
              } else {
                 let colorClass = info.daysRemaining <= 7 ? 'text-danger' : 'text-warning';
                 statusP.innerHTML = (i18n[currentLang]['set_pkg_remaining']||'เหลือเวลา: ') + '<span id="setting-exp-days" class="fw-bold ' + colorClass + ' fs-5">' + info.daysRemaining + '</span><span class="ms-1 text-light">' + (i18n[currentLang]['set_pkg_days']||'วัน') + '</span>';
              }
           }
        }

        if (renewBtn) {
           if (info.renewStatus === 'PENDING') {
              renewBtn.disabled = true;
              renewBtn.innerHTML = `<i class="fa-solid fa-hourglass-half text-warning me-1 fa-spin"></i> <span>${i18n[currentLang]['set_renew_checking']||'กำลังตรวจสอบ...'}</span>`;
              renewBtn.className = "btn btn-outline-warning fw-bold rounded-pill shadow px-4 py-2";
           } else {
              renewBtn.disabled = false;
              renewBtn.innerHTML = `<i class="fa-solid fa-bolt text-danger me-1"></i> <span>${i18n[currentLang]['set_btn_renew_now']||'ต่ออายุทันที'}</span>`;
              renewBtn.className = "btn btn-warning fw-bold rounded-pill shadow px-4 py-2";
           }
        }

        // 🌟 ถ้าระบบไม่ได้เป็น PENDING แล้ว (แปลว่าแอดมินกดอนุมัติแล้ว)
        if (info.renewStatus !== 'PENDING') {
          clearInterval(renewPollingInterval); // หยุดเช็ค
          renewPollingInterval = null;

          // เด้ง Popup แจ้งเตือนทันที!
          if (info.renewNotified === 0) {
             Swal.fire({
                icon: 'success',
                title: i18n[currentLang]['swal_renew_success_title'] || '🎉 ต่ออายุระบบสำเร็จแล้ว!',
                html: `<div class="text-center">
                         <p class="fs-6 text-secondary mb-2">${i18n[currentLang]['swal_renew_success_desc1']||'แอดมินได้ทำการอนุมัติการชำระเงินเรียบร้อยแล้วครับ'}</p>
                         <div class="bg-light p-3 rounded-4 border my-3">
                           <div class="text-muted small">${i18n[currentLang]['swal_renew_success_desc2']||'วันหมดอายุใหม่ของคุณคือ'}</div>
                           <div class="fs-3 fw-bold text-success mt-1">${info.expireDate}</div>
                           <div class="badge bg-success rounded-pill px-3 py-1 mt-2">${i18n[currentLang]['swal_renew_success_desc3']||'ใช้งานได้อีก'} ${info.daysRemaining} วัน</div>
                         </div>
                       </div>`,
                confirmButtonColor: '#10b981',
                confirmButtonText: 'รับทราบ',
                allowOutsideClick: false
             }).then(() => {
                google.script.run.clearRenewNotify(currentTenantSheetId); // เคลียร์สถานะการแจ้งเตือน
				// 👇 🌟 เติมโค้ดส่วนนี้เข้าไป เพื่อปลดล็อกปุ่มและรีเฟรชหน้าต่าง 👇
                globalDaysRemaining = info.daysRemaining; 
                
                // 1. ปลดล็อกปุ่มเมนูให้กลับมากดได้ตามสิทธิ์ของพนักงาน
                if (currentStaff && currentStaff.permissions) {
                    applyPermissions(currentStaff.permissions);
                }
                
                // 2. ปิดหน้าต่างการตั้งค่า (ถ้าเปิดอยู่) แล้วกลับหน้าหลัก
                if (typeof closeSettingsPage === 'function') {
                    closeSettingsPage();
                }
                // 👆 ======================================== 👆
             });
          }
        }
      }
    }).getTenantInfoBySheetId(currentTenantSheetId);
  }, 3000); // ⏱️ แอบเช็คทุกๆ 3 วินาที
}

function toggleThemeMode() {
  const body = document.body; const icon = document.getElementById('theme-icon');
  body.classList.toggle('dark-theme');
  if(body.classList.contains('dark-theme')) { icon.className = 'fa-solid fa-sun'; localStorage.setItem('pos-theme-preference', 'dark'); } 
  else { icon.className = 'fa-solid fa-moon'; localStorage.setItem('pos-theme-preference', 'light'); }
}

let idleTimeout;
function resetIdleTimer() {
  clearTimeout(idleTimeout);
  
  // 🌟 [เพิ่มใหม่] ดึงค่าเวลาจาก Settings (ถ้ายังไม่เคยตั้งค่า ให้ใช้ 5 นาที)
  let timeoutMinutes = (typeof cachedShopSettings !== 'undefined' && cachedShopSettings.pin_timeout_minutes !== undefined)
    ? parseFloat(cachedShopSettings.pin_timeout_minutes)
    : 5;
    
  // ถ้าค่าเป็น 0 หรือน้อยกว่า แปลว่า "ปิดใช้งานการล็อกอัตโนมัติ"
  if (timeoutMinutes <= 0) return; 
  
  // แปลงนาที เป็น Milliseconds (1 นาที = 60000 ms)
  let timeoutMs = timeoutMinutes * 60 * 1000;

  if(document.getElementById('lock-screen') && document.getElementById('lock-screen').style.display === 'none') { 
    idleTimeout = setTimeout(() => { lockScreenManual(true); }, timeoutMs); 
  } 
}
window.onload = resetIdleTimer; document.onmousemove = resetIdleTimer; document.onkeypress = resetIdleTimer; document.ontouchstart = resetIdleTimer; document.onclick = resetIdleTimer;

// 🌟 ระบบดักจับการรีเฟรช F5 เพื่อจำหน้าล่าสุด
function hookPageNavigation() {
  if(typeof window.openPOSPage === 'function' && !window.openPOSPage.isHooked) {
    const _openPOS = window.openPOSPage;
    window.openPOSPage = function() { sessionStorage.setItem('pos_current_page', 'page-pos'); _openPOS(); };
    window.openPOSPage.isHooked = true;
  }
  if(typeof window.closePOSPage === 'function' && !window.closePOSPage.isHooked) {
    const _closePOS = window.closePOSPage;
    window.closePOSPage = function() { sessionStorage.setItem('pos_current_page', 'main-menu'); _closePOS(); };
    window.closePOSPage.isHooked = true;
  }
  if(typeof window.openProductsPage === 'function' && !window.openProductsPage.isHooked) {
    const _openProd = window.openProductsPage;
    window.openProductsPage = function() { sessionStorage.setItem('pos_current_page', 'page-products'); _openProd(); };
    window.openProductsPage.isHooked = true;
  }
  if(typeof window.closeProductsPage === 'function' && !window.closeProductsPage.isHooked) {
    const _closeProd = window.closeProductsPage;
    window.closeProductsPage = function() { sessionStorage.setItem('pos_current_page', 'main-menu'); _closeProd(); };
    window.closeProductsPage.isHooked = true;
  }
  if(typeof window.openDashboardPage === 'function' && !window.openDashboardPage.isHooked) {
    const _openDash = window.openDashboardPage;
    window.openDashboardPage = function() { sessionStorage.setItem('pos_current_page', 'page-dashboard'); _openDash(); };
    window.openDashboardPage.isHooked = true;
  }
  if(typeof window.closeDashboardPage === 'function' && !window.closeDashboardPage.isHooked) {
    const _closeDash = window.closeDashboardPage;
    window.closeDashboardPage = function() { sessionStorage.setItem('pos_current_page', 'main-menu'); _closeDash(); };
    window.closeDashboardPage.isHooked = true;
  }
  if(typeof window.openSettingsPage === 'function' && !window.openSettingsPage.isHooked) {
    const _openSet = window.openSettingsPage;
    window.openSettingsPage = function() { sessionStorage.setItem('pos_current_page', 'page-settings'); _openSet(); };
    window.openSettingsPage.isHooked = true;
  }
  if(typeof window.closeSettingsPage === 'function' && !window.closeSettingsPage.isHooked) {
    const _closeSet = window.closeSettingsPage;
    window.closeSettingsPage = function() { sessionStorage.setItem('pos_current_page', 'main-menu'); _closeSet(); };
    window.closeSettingsPage.isHooked = true;
  }
}

function initShopMenuScripts() {
  hookPageNavigation(); 

  
  if (typeof changeLanguage === 'function') {
    changeLanguage(currentLang);
  }

  const savedTheme = localStorage.getItem('pos-theme-preference'); const icon = document.getElementById('theme-icon');
  if(savedTheme === 'dark') { document.body.classList.add('dark-theme'); if(icon) icon.className = 'fa-solid fa-sun'; }

  google.script.run.withSuccessHandler(function(info) { document.getElementById('app-version-text').innerText = info.version; }).getAppInfo();

  const savedTenantId = localStorage.getItem('saas_tenant_id'); 
  if (!savedTenantId) {
      window.location.href = '/';
      return;
  }

  // 🌟 ดึงข้อมูลและจัดการสถานะ (ลบป๊อปอัพโหลดดิ้งผีหลอกแล้ว ให้เนียนกริบ)
  // 🌟 ดึงข้อมูลและจัดการสถานะแพ็กเกจ (เพิ่มระบบ Auto Polling)
  google.script.run.withSuccessHandler(function(info) {
        if (info && !info.error) {
          globalDaysRemaining = info.daysRemaining; 

          // 🌟 ถ้าระบบรออนุมัติ ให้หมุนเช็คเลย! (เผื่อลูกค้ากด F5)
          if (info.renewStatus === 'PENDING') {
              startRenewPolling();
          } else if (info.renewNotified === 0) {
              startRenewPolling();
          }

          if (info.daysRemaining < 0) {
            // แจ้งเตือนโดยใช้คำว่า 'แพ็กเกจ' แทน เพื่อหลบโค้ดปิดโหลดดิ้งอัตโนมัติ
            Swal.fire({ 
                icon: 'warning', 
                title: 'แพ็กเกจหมดอายุ', 
                text: 'กรุณาต่ออายุแพ็กเกจเพื่อกลับมาเปิดใช้งานระบบได้ตามปกติครับ', 
                confirmButtonText: '<i class="fa-solid fa-bolt"></i> ต่ออายุแพ็กเกจ',
                confirmButtonColor: '#3b82f6',
                showCancelButton: true,
                cancelButtonText: 'ไว้ทีหลัง',
                allowOutsideClick: false
            }).then((result) => {
                if (result.isConfirmed) {
                    if (typeof openSettingsPage === 'function') openSettingsPage();

function loadShopData(tenantId) {
  if(!tenantId) return;
  
  // 🌟 สร้างตัวนับจำนวนคิวโหลดข้อมูล
  let loadedCount = 0;
  const targetCount = 5; // เราจะดึงข้อมูล 5 อย่างพร้อมกัน: ตั้งค่า, พนักงาน, สินค้า, บิลขาย, ประวัติการใช้งาน

  // ฟังก์ชันเช็คว่าดึงข้อมูลครบหรือยัง
  function checkAllLoaded() {
    loadedCount++;
    
    // ดันหลอดโหลดให้วิ่งขึ้นตามข้อมูลที่ดึงเสร็จ (จาก 90% ดันไปเรื่อยๆ)
    let el = document.getElementById('sys-load-percent');
    if (el && loadedCount < targetCount) {
        el.innerText = (85 + Math.floor((loadedCount/targetCount)*10)) + '%';
    }

    // ถ้าดึงครบทั้ง 5 อย่างแล้ว -> ดันหลอดไป 100% แล้วโชว์หน้าจอ!
    if (loadedCount >= targetCount) {
      if (window.sysLoadInterval) clearInterval(window.sysLoadInterval);
      if (el) el.innerText = '100%';

      setTimeout(() => {
        if (Swal.isVisible() && Swal.getTitle() && Swal.getTitle().textContent.includes('ระบบ')) {
           Swal.close();
        }

        if(globalUsers.length === 0) {
          document.getElementById('first-time-setup-modal').style.display = 'flex';
        } else {
          const savedStaff = sessionStorage.getItem('pos_active_staff');
          if (savedStaff) {
            try {
              let user = JSON.parse(savedStaff);
              let validUser = globalUsers.find(u => u.pin === user.pin);
              if (validUser) {
                currentStaff = validUser; 
                document.getElementById('display-staff-name').innerText = validUser.name; 
                document.getElementById('display-staff-name').removeAttribute('data-i18n'); 
                applyPermissions(validUser.permissions);
                document.getElementById('lock-screen').style.display = 'none';
                resetIdleTimer();

                setTimeout(() => {
                    let lastPage = sessionStorage.getItem('pos_current_page');
                    
                    // ถ้าระบบหมดอายุ ห้ามเด้งเปิดหน้าอื่นอัตโนมัติ ยกเว้นหน้าตั้งค่า
                    if (globalDaysRemaining < 0 && lastPage !== 'page-settings') {
                        lastPage = 'main-menu';
                    }

                    if(lastPage === 'page-pos' && validUser.permissions.includes('POS') && typeof openPOSPage === 'function') openPOSPage();
                    else if(lastPage === 'page-products' && validUser.permissions.includes('STOCK') && typeof openProductsPage === 'function') openProductsPage();
                    else if(lastPage === 'page-dashboard' && validUser.permissions.includes('DASH') && typeof openDashboardPage === 'function') openDashboardPage();
                    else if(lastPage === 'page-settings' && validUser.permissions.includes('ADMIN') && typeof openSettingsPage === 'function') openSettingsPage();
                }, 50);
              }
            } catch(e) { sessionStorage.removeItem('pos_active_staff'); }
          }
        }
      }, 300);
    }
  }

  // 📥 1. โหลดการตั้งค่าร้าน
  google.script.run.withSuccessHandler(function(settings) {
    cachedShopSettings = settings || {}; 
    if (typeof applyUISettings === 'function') applyUISettings(); 
    if(settings && settings.shop_logo) { 
        document.getElementById('display-shop-logo').src = settings.shop_logo; 
        document.getElementById('display-shop-logo').style.display = 'inline-block'; 
    }
    checkAllLoaded();
  }).getShopSettings(tenantId);

  // 📥 2. โหลดพนักงาน
  google.script.run.withSuccessHandler(function(users) { 
    globalUsers = users || []; 
    checkAllLoaded();
  }).getUsers(tenantId);

  // 📥 3. โหลดคลังสินค้าทั้งหมด (Preload เตรียมไว้ให้หน้า POS และ Products)
  google.script.run.withSuccessHandler(function(products) {
    globalProducts = products || [];
    window.globalProducts = globalProducts;
    checkAllLoaded();
  }).getProducts(tenantId);

  // 📥 4. โหลดประวัติบิล (Preload เตรียมไว้ให้ Dashboard)
  google.script.run.withSuccessHandler(function(data) {
    posRawSalesData = data || [];
    checkAllLoaded();
  }).getDashboardData(tenantId);

  // 📥 5. โหลดประวัติการใช้งาน (Preload เตรียมไว้ให้หน้า Settings)
  google.script.run.withSuccessHandler(function(logs) {
    globalActivityLogs = logs || [];
    checkAllLoaded();
  }).getActivityLogs(tenantId);
}

// 🌟 เพิ่มตัวแปรกันการกดซ้ำตอนกำลังตรวจรหัส
let isCheckingPin = false;

function pressNum(val) {
  if (document.activeElement) document.activeElement.blur(); 

  // 🌟 ถ้าระบบกำลังนับถอยหลังตรวจ PIN อยู่ ให้ข้ามปุ่มที่กดเกินมาทันที
  if (isCheckingPin) return;

  if (val === 'clear') { 
    currentPin = ""; 
  } else if (val === 'del') { 
    currentPin = currentPin.slice(0, -1); 
  } else { 
    if (currentPin.length < 4) currentPin += val; 
  }
  
  updatePinDisplay(); 

  if (currentPin.length === 4) {
    isCheckingPin = true; // 🌟 ล็อกปุ่มทันที กันตั้ง Timer ซ้ำ
    setTimeout(() => {
      checkPinCode(currentPin);
    }, 150); 
  }
}

function updatePinDisplay() {
  let html = "";
  for(let i = 0; i < 4; i++) { if (i < currentPin.length) { html += '<div class="pin-dot filled"></div>'; } else { html += '<div class="pin-dot"></div>'; } }
  document.getElementById('pin-display').innerHTML = html;
}

function checkPinCode(pin) {
      // 🌟 บังคับแปลงเป็น String ให้ชัวร์ 100% ป้องกันพิมพ์แล้วข้อมูลไม่ตรง
      let user = globalUsers.find(u => String(u.pin).trim() === String(pin).trim());
      
      if(user) {
        isCheckingPin = false; 
        clearTimeout(shopLogoutTimeout);
        localStorage.removeItem('pos_lock_time');
        
        currentStaff = user; 
        document.getElementById('display-staff-name').innerText = user.name; 
        document.getElementById('display-staff-name').removeAttribute('data-i18n');
        applyPermissions(user.permissions);
        
        sessionStorage.setItem('pos_active_staff', JSON.stringify(user));

        document.getElementById('lock-screen').style.opacity = '0';
        setTimeout(() => { document.getElementById('lock-screen').style.display = 'none'; document.getElementById('numpad-box').style.animation = 'none'; }, 400);
        
        Swal.fire({ icon: 'success', title: (i18n[currentLang]['swal_welcome'] || 'ยินดีต้อนรับ ') + user.name, toast: true, position: 'top-end', showConfirmButton: false, timer: 1000 });

        google.script.run.logAction(currentTenantSheetId, user.name, "เข้าสู่ระบบ", "ล็อกอินสำเร็จ");
        currentPin = ""; updatePinDisplay(); resetIdleTimer();
      } else {
        // 🌟 รหัสผิด: ลบป๊อปอัพกากบาทออก! เปลี่ยนเป็นแค่จุดสีแดงสั่นๆ จะได้ไม่บล็อกหน้าจอ และพิมพ์ใหม่ได้ทันที
        let numpad = document.getElementById('numpad-box'); 
        numpad.classList.add('error-shake'); 
        
        // เปลี่ยนจุดเป็นสีแดงเตือนว่าผิด
        document.getElementById('pin-display').innerHTML = '<div class="pin-dot filled bg-danger" style="box-shadow: 0 0 15px rgba(239,68,68,0.6) !important;"></div>'.repeat(4);

        // ปลดล็อกให้พิมพ์ใหม่ได้ทันทีที่หน้าจอสั่นเสร็จ (400ms)
        setTimeout(() => { 
          numpad.classList.remove('error-shake'); 
          currentPin = ""; 
          updatePinDisplay(); 
          isCheckingPin = false; 
        }, 400);
      }
    }

function applyPermissions(perms) {
  let p = perms.toUpperCase();
  
  // ถ้าระบบหมดอายุ บังคับล็อกทุกเมนู (ให้เข้าได้แค่แอดมินหรือหน้าตั้งค่า)
  if (globalDaysRemaining < 0) {
    document.getElementById('btn-menu-booking').disabled = true; 
    document.getElementById('btn-menu-patient').disabled = true; 
    document.getElementById('btn-menu-pos').disabled = true; 
    document.getElementById('btn-menu-stock').disabled = true;
    document.getElementById('btn-menu-hr').disabled = true;
    document.getElementById('btn-menu-dash').disabled = true; 
  } else {
    // กำหนดสิทธิ์: ถ้าเป็น ADMIN จะกดได้ทุกปุ่ม หรือถ้ามีสิทธิ์เฉพาะตัวก็จะกดได้
    document.getElementById('btn-menu-booking').disabled = !p.includes('BOOKING') && !p.includes('ADMIN');

    document.getElementById('btn-menu-stock').disabled = !p.includes('STOCK') && !p.includes('ADMIN');
    document.getElementById('btn-menu-hr').disabled = !p.includes('HR') && !p.includes('ADMIN');
    document.getElementById('btn-menu-dash').disabled = !p.includes('DASH') && !p.includes('ADMIN'); 
  }
}

function initCats() {
  const cats = document.querySelectorAll('.detailed-cat'); 
  let isDragging = false; 
  let currentCat = null; 
  let offsetX = 0, offsetY = 0;

  function startDrag(e, cat) {
    if (e.type === 'mousedown') e.preventDefault();
    isDragging = true; 
    currentCat = cat;
    
    if (currentCat.walkInterval) clearInterval(currentCat.walkInterval);
    if (currentCat.actionTimeout) clearTimeout(currentCat.actionTimeout);
    currentCat.classList.remove('cat-resting');

    const computed = window.getComputedStyle(currentCat); 
    const startLeft = parseFloat(computed.left); 
    const startTop = parseFloat(computed.top);
    
    currentCat.style.left = startLeft + 'px'; 
    currentCat.style.top = startTop + 'px';
    currentCat.style.animation = 'none'; 
    currentCat.style.transition = 'none'; 
    currentCat.style.zIndex = '1000';

    let clientX = e.clientX !== undefined ? e.clientX : e.touches[0].clientX; 
    let clientY = e.clientY !== undefined ? e.clientY : e.touches[0].clientY;
    offsetX = clientX - startLeft; 
    offsetY = clientY - startTop;
  }

  function drag(e) {
    if (!isDragging || !currentCat) return; 
    e.preventDefault(); 
    let clientX = e.clientX !== undefined ? e.clientX : (e.touches.length > 0 ? e.touches[0].clientX : 0); 
    let clientY = e.clientY !== undefined ? e.clientY : (e.touches.length > 0 ? e.touches[0].clientY : 0);
    currentCat.style.left = (clientX - offsetX) + 'px'; 
    currentCat.style.top = (clientY - offsetY) + 'px';
  }

  function endDrag() {
    if (!currentCat) return;
    let cat = currentCat; 
    cat.style.zIndex = '1';
    isDragging = false; 
    currentCat = null;
    
    startCatBehavior(cat);
  }

  // 🌟 ระบบสลับพฤติกรรม (เดินทะแยงสุ่มขึ้น-ลง ↔ นอนลงพื้น)
  function startCatBehavior(cat) {
    if (cat.walkInterval) clearInterval(cat.walkInterval);
    if (cat.actionTimeout) clearTimeout(cat.actionTimeout);

    let directionX = cat.dataset.dir ? parseInt(cat.dataset.dir) : 1; 
    // 🎲 สุ่มทิศทางขึ้น-ลง (ความเร็วขึ้นลงสุ่มสลับระหว่าง -0.8 ถึง 0.8)
    let directionY = (Math.random() * 1.6 - 0.8); 
    
    cat.style.transform = `scaleX(${directionX})`;

    // 🎲 สุ่มระยะเวลาเดิน: 10 ถึง 20 วินาที
    let walkDuration = Math.floor(Math.random() * 10000) + 10000;

    cat.classList.remove('cat-resting');
    cat.walkInterval = setInterval(() => {
      if (document.getElementById('lock-screen') && document.getElementById('lock-screen').style.display === 'none') return;
      
      let currentLeft = parseFloat(cat.style.left); 
      let currentTop = parseFloat(cat.style.top);
      
      if (isNaN(currentLeft)) {
        const computed = window.getComputedStyle(cat);
        currentLeft = parseFloat(computed.left) || 0;
        currentTop = parseFloat(computed.top) || 0;
      }
      
      // ขยับแนวนอนและแนวตั้ง
      currentLeft += directionX * 1.5; 
      currentTop += directionY;

      // 🛑 คุมไม่ให้เดินหลุดขอบบน-ขอบล่างของหน้าจอเกินไป (ถ้าชนขอบบน/ล่าง ให้ชิ่งกลับ)
      let minTop = window.innerHeight * 0.08;
      let maxTop = window.innerHeight * 0.75;
      if (currentTop < minTop || currentTop > maxTop) {
        directionY = -directionY; // เด้งสลับทิศทางขึ้นลง
      }

      cat.style.left = currentLeft + 'px';
      cat.style.top = currentTop + 'px';

      // 🌟 เดินทะลุขอบจอขวา -> วาร์ปไปแอบฝั่งซ้าย + สุ่มความสูง/สุ่มทิศทางขึ้นลงใหม่
      if (directionX === 1 && currentLeft > window.innerWidth + 100) { 
        cat.style.left = '-120px';
        cat.style.top = (Math.floor(Math.random() * (window.innerHeight * 0.6)) + (window.innerHeight * 0.12)) + 'px';
        directionY = (Math.random() * 1.6 - 0.8);
      }
      
      // 🌟 เดินทะลุขอบจอซ้าย -> วาร์ปไปแอบฝั่งขวา + สุ่มความสูง/สุ่มทิศทางขึ้นลงใหม่
      if (directionX === -1 && currentLeft < -150) { 
        cat.style.left = (window.innerWidth + 50) + 'px';
        cat.style.top = (Math.floor(Math.random() * (window.innerHeight * 0.6)) + (window.innerHeight * 0.12)) + 'px';
        directionY = (Math.random() * 1.6 - 0.8);
      }
    }, 30);

    // เมื่อครบกำหนดเวลาเดิน ให้หยุดนอนลงพื้น
    cat.actionTimeout = setTimeout(() => {
      clearInterval(cat.walkInterval);
      cat.classList.add('cat-resting');

      // 🎲 สุ่มระยะเวลานอนพัก: 5 ถึง 20 วินาที
      let sleepDuration = Math.floor(Math.random() * 15000) + 5000;

      cat.actionTimeout = setTimeout(() => {
        // เมื่อตื่นมา สุ่มสลับทิศทางหันหน้า
        if (Math.random() > 0.5) {
          directionX = directionX * -1;
          cat.dataset.dir = directionX;
        }
        startCatBehavior(cat);
      }, sleepDuration);

    }, walkDuration);
  }

  cats.forEach((cat, index) => { 
    cat.ondragstart = function() { return false; }; 
    cat.addEventListener('mousedown', (e) => startDrag(e, cat)); 
    cat.addEventListener('touchstart', (e) => startDrag(e, cat), {passive: false}); 
    
    // สุ่มตำแหน่งเริ่มต้นให้อยู่นอกขอบจอ (ซ้าย หรือ ขวา)
    let startFromLeft = Math.random() > 0.5;
    let initialLeft = startFromLeft ? -120 : window.innerWidth + 20;
    let initialTop = Math.floor(Math.random() * (window.innerHeight * 0.6)) + (window.innerHeight * 0.15);
    
    let initialDir = startFromLeft ? 1 : -1;
    cat.dataset.dir = initialDir;
    
    cat.style.left = initialLeft + 'px';
    cat.style.top = initialTop + 'px';

    // ทยอยสุ่มเดินเข้าจอทีละตัว
    setTimeout(() => {
      startCatBehavior(cat);
    }, index * 1500 + Math.random() * 1000);
  });

  document.addEventListener('mousemove', drag); 
  document.addEventListener('touchmove', drag, {passive: false});
  document.addEventListener('mouseup', endDrag); 
  document.addEventListener('touchend', endDrag); 
  document.addEventListener('mouseleave', endDrag);
}
</script>
