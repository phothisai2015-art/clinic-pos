<style>
/* Numpad Glassmorphism และ Layout (เหมือนเดิม) */
.numpad-container { position: relative; z-index: 10; width: 90%; max-width: 380px; animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; background: rgba(255, 255, 255, 0.6) !important; backdrop-filter: blur(25px) saturate(120%) !important; -webkit-backdrop-filter: blur(25px) saturate(120%) !important; border: 1px solid rgba(255, 255, 255, 0.8) !important; box-shadow: 0 30px 60px rgba(0, 0, 0, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.9) !important; border-radius: 40px !important; padding: 40px 30px 45px 30px !important; }
body.dark-theme .numpad-container { background: rgba(30, 41, 59, 0.65) !important; border: 1px solid rgba(255, 255, 255, 0.1) !important; box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.05) !important; }
.numpad-header-wrap { text-align: center; }
@keyframes popIn { 0% { opacity: 0; transform: translateY(30px) scale(0.95); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
.error-shake { animation: shakeError 0.4s ease-in-out; }
@keyframes shakeError { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }

/* โครงสร้างเมนูหลัก (ปรับความกว้างให้รองรับ 6 ปุ่มสวยๆ) */
.main-container { max-width: 900px; margin: 0 auto; padding: 40px 20px; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; }

/* ปุ่มออกจากระบบมุมซ้ายล่าง */
.logout-shop-btn { position: fixed; bottom: 25px; left: 25px; z-index: 10000; background: rgba(255,255,255,0.8); backdrop-filter: blur(5px); border-color: #fca5a5; color: #ef4444; font-weight: bold; border-radius: 20px; padding: 10px 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); transition: all 0.2s; border: 1px solid; }

/* ปุ่มเมนูการ์ด 6 เมนู */
.menu-card-btn { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 24px; padding: 25px 15px; text-align: center; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: 0 10px 20px rgba(0,0,0,0.02); display: flex; flex-direction: column; align-items: center; cursor: pointer; height: 100%; }
.menu-card-btn:hover:not(:disabled) { transform: translateY(-8px); box-shadow: 0 20px 40px rgba(0,0,0,0.08); border-color: #cbd5e1; }
.menu-card-btn:disabled { background: #f8fafc; opacity: 0.6; cursor: not-allowed; filter: grayscale(100%); }
.menu-icon-wrap { width: 65px; height: 65px; border-radius: 20px; display: flex; justify-content: center; align-items: center; font-size: 28px; transition: transform 0.3s ease; }
.menu-card-btn:hover:not(:disabled) .menu-icon-wrap { transform: scale(1.1) rotate(5deg); }
body.dark-theme .menu-card-btn { background: #1e293b; border-color: #334155; }
body.dark-theme .menu-card-btn:hover:not(:disabled) { border-color: #475569; box-shadow: 0 20px 40px rgba(0,0,0,0.4); }

@keyframes pulse { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); } }
</style>

<div id="lock-screen">... (ซ่อนไว้เพื่อประหยัดพื้นที่ โค้ดส่วนนี้เหมือนเดิม 100%) ...</div>
<div id="first-time-setup-modal" style="display:none;">... (ซ่อนไว้ โค้ดส่วนนี้เหมือนเดิม) ...</div>

    <div class="col-6 col-md-4">

  </div>

  <div class="text-center mt-5 text-muted fw-bold small d-flex justify-content-center align-items-center gap-3">

    <span class="text-secondary opacity-25">|</span>
    <a href="#" onclick="lockScreenManual()" class="text-danger text-decoration-none hover-scale"><i class="fa-solid fa-lock me-1"></i> ล็อกหน้าจอ </a>
  </div>
</div>
