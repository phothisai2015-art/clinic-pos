<style>
  .clinic-nav-pills .nav-link { color: #64748b; font-weight: bold; border-radius: 12px; padding: 10px 20px; border: 1px solid transparent; margin-right: 8px; cursor: pointer; }
  .clinic-nav-pills .nav-link.active { background-color: #3b82f6; color: #fff; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3); }
  .pos-queue-card { transition: all 0.2s; cursor: pointer; border-left: 4px solid #cbd5e1; }
  .pos-queue-card.active { border-left-color: #3b82f6; background-color: #eff6ff !important; }
  .allergy-alert-box { background: #fff1f2; border-left: 5px solid #e11d48; border-radius: 12px; padding: 12px 20px; color: #9f1239; }
  .vitals-banner { background: #f0f9ff; border: 1px solid #bae6fd; border-radius: 12px; padding: 10px 15px; color: #0369a1; display: none; }
  .canvas-container { position: relative; border: 2px dashed #cbd5e1; border-radius: 16px; background: #f8fafc; overflow: hidden; display: flex; justify-content: center; align-items: center; min-height: 350px; }
  .custom-scrollbar::-webkit-scrollbar { width: 6px; } .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 10px; } .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
</style>

<div class="container-fluid py-4" style="max-width: 1500px; height: 100vh; display: flex; flex-direction: column;">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="fw-bold text-danger m-0"><i class="fa-solid fa-stethoscope me-2"></i> ห้องตรวจแพทย์ (Aesthetic EMR)</h3>
    <button class="btn btn-outline-danger fw-bold rounded-pill px-4" onclick="closeModule()"><i class="fa-solid fa-xmark me-2"></i> ปิดหน้านี้</button>
  </div>

  <div class="row g-4 flex-grow-1" style="min-height: 0;">
    <!-- 📋 ฝั่งซ้าย: คิวรอตรวจ -->
    <div class="col-lg-3 col-md-4 h-100">
      <div class="bg-white p-4 rounded-4 shadow-sm border h-100 d-flex flex-column">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h6 class="fw-bold m-0"><i class="fa-solid fa-users me-2 text-primary"></i> คิวรอตรวจ</h6>
          <span class="badge bg-primary rounded-pill" id="emrQueueCount">0 คิว</span>
        </div>
        <div id="emrQueueList" class="custom-scrollbar" style="overflow-y: auto; flex-grow: 1; padding-right: 5px;"></div>
      </div>
    </div>

    <!-- 👨‍⚕️ ฝั่งขวา: รายละเอียด EMR -->
    <div class="col-lg-9 col-md-8 h-100 d-flex flex-column custom-scrollbar" style="overflow-y: auto; overflow-x: hidden; padding-right: 5px;">
      
      <!-- ข้อมูลคนไข้ และ กล่องเตือนแพ้ยา -->
      <div class="bg-white p-3 rounded-4 shadow-sm border mb-3">
        <div class="row align-items-center">
          <div class="col-md-6 col-sm-12 mb-2 mb-md-0">
            <h4 class="fw-bold m-0 text-primary" id="hdr_name">กรุณาเลือกคิวคนไข้...</h4>
            <div class="d-flex flex-wrap gap-3 mt-2 small text-muted">
              <div><i class="fa-solid fa-address-card text-secondary me-1"></i> HN: <span id="hdr_hn" class="fw-bold text-dark">-</span></div>
              <div><i class="fa-solid fa-phone text-secondary me-1"></i> โทร: <span id="hdr_phone" class="fw-bold text-dark">-</span></div>
              <div><i class="fa-solid fa-calendar text-secondary me-1"></i> อายุ: <span id="hdr_age" class="fw-bold text-dark">-</span></div>
            </div>
          </div>
          <div class="col-md-6 col-sm-12">
            <div id="allergyAlert" class="allergy-alert-box align-items-center justify-content-between m-0 shadow-sm" style="display: none; padding: 10px 15px;">
              <div class="d-flex align-items-center">
                <i class="fa-solid fa-triangle-exclamation fa-2x me-3 text-danger"></i>
                <div>
                  <div class="fw-bold text-danger" style="font-size: 0.9rem;" id="allergyTitle">⚠️ ข้อควรระวังทางการแพทย์</div>
                  <div class="small text-danger fw-semibold" id="allergyDetails"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- แถบแสดง Vitals เบื้องต้น -->
      <div id="vitalsBanner" class="vitals-banner align-items-center justify-content-between mb-3 shadow-sm">
        <div class="d-flex align-items-center gap-4 w-100 justify-content-around">
          <div><i class="fa-solid fa-heart-pulse text-danger me-1"></i> ความดัน (BP): <b id="v_bp" class="fs-6 text-dark">-</b> mmHg</div>
          <div><i class="fa-solid fa-wave-square text-warning me-1"></i> ชีพจร (Pulse): <b id="v_pulse" class="fs-6 text-dark">-</b> /min</div>
          <div><i class="fa-solid fa-weight-scale text-primary me-1"></i> น้ำหนัก: <b id="v_weight" class="fs-6 text-dark">-</b> kg</div>
          <div><i class="fa-solid fa-ruler-vertical text-success me-1"></i> ส่วนสูง: <b id="v_height" class="fs-6 text-dark">-</b> cm</div>
        </div>
      </div>

      <ul class="nav nav-pills clinic-nav-pills mb-4" style="position: sticky; top: 0; z-index: 10; background: #f8fafc; padding: 10px 0;">
        <li class="nav-item"><button class="nav-link active" id="btn-tab-emr" onclick="switchTab('emr')"><i class="fa-solid fa-notes-medical me-1"></i> บันทึกการตรวจ (EMR)</button></li>
        <li class="nav-item"><button class="nav-link" id="btn-tab-gallery" onclick="switchTab('gallery')"><i class="fa-solid fa-images me-1"></i> รูปถ่าย/มาร์กหน้า</button></li>
      </ul>

      <div class="tab-content flex-grow-1">
        <!-- Tab 1: EMR -->
        <div class="tab-pane-custom" id="emr-content" style="display: block;">
          <div class="row g-4">
            
            <div class="col-lg-6 col-md-12">
              <div class="bg-white p-4 rounded-4 shadow-sm border mb-4">
                <h5 class="fw-bold text-primary mb-3"><i class="fa-solid fa-stethoscope me-2"></i> บันทึกเวชระเบียน</h5>
                <form id="emrForm" onsubmit="saveEMR(event)">
                  <!-- 🌟 เอาคำว่า required ออก และเพิ่ม rows="4" ให้กล่องสูงขึ้น -->
                  <div class="mb-3"><label class="form-label fw-bold small text-muted">อาการ (CC)</label><textarea id="emr_symptoms" class="form-control" rows="1"></textarea></div>
                  <div class="mb-3"><label class="form-label fw-bold small text-muted">วินิจฉัย (Dx)</label><textarea id="emr_diagnosis" class="form-control" rows="1"></textarea></div>
                  
                  <!-- กล่องหักสิทธิ์คอร์ส (จะถูกซ่อนไว้โดยค่าเริ่มต้น ถ้าไม่มีคอร์ส) -->
                  <div id="emr_deduct_section" class="mb-3 p-3 bg-light border border-success rounded-3" style="display: none;">
                    <label class="form-label fw-bold small text-success mb-2"><i class="fa-solid fa-wand-magic-sparkles"></i> โควตาคงเหลือ และ การหักสิทธิ์</label>
                    <div class="input-group input-group-sm mb-2">
                      <select id="emr_course_select" class="form-select border-success">
                        <option value="">-- รอเลือกคนไข้ --</option>
                      </select>
                      <input type="number" id="emr_course_qty" class="form-control border-success" placeholder="จำนวน" style="max-width: 80px;" step="0.1" min="0.1">
                      <button type="button" class="btn btn-success fw-bold" onclick="deductCourseInline()"><i class="fa-solid fa-check"></i> ใช้งาน</button>
                    </div>
                    <!-- กล่องแสดงรายการที่หมอกดหักไปแล้ว (พักข้อมูล) -->
                    <textarea id="emr_treatment" class="form-control bg-white text-success fw-bold" rows="2" placeholder="รายการหัตถการ/คอร์สที่เลือก จะมาแสดงตรงนี้อัตโนมัติ..." readonly></textarea>
                  </div>

                  <!-- บันทึกการรักษา (4 ช่อง) -->
                  <div class="mb-3 border p-3 rounded-3">
                    <label class="form-label fw-bold small text-primary mb-2"><i class="fa-solid fa-syringe"></i> บันทึกรายละเอียดหัตถการ</label>
                    <div class="row g-2">
                      <div class="col-6"><input type="text" id="emr_area" class="form-control form-control-sm" placeholder="บริเวณที่ทำ (Area)"></div>
                      <div class="col-6"><input type="text" id="emr_brand" class="form-control form-control-sm" placeholder="ยี่ห้อตัวยา/เครื่องมือ"></div>
                      <div class="col-6"><input type="text" id="emr_lot" class="form-control form-control-sm" placeholder="เลขลอต (Lot No.)"></div>
                      <div class="col-6"><input type="text" id="emr_setting" class="form-control form-control-sm" placeholder="พลังงาน/ช็อต (Settings)"></div>
                    </div>
                  </div>

                  <!-- สั่งจ่ายยากลับบ้าน (Prescription) -->
                  <div class="mb-3 border border-primary p-3 rounded-3 bg-white">
                    <label class="form-label fw-bold small text-primary mb-2"><i class="fa-solid fa-pills"></i> สั่งจ่ายยา / สกินแคร์ (Prescription)</label>
                    <div class="input-group input-group-sm mb-2">
                      <select id="emr_med_select" class="form-select border-primary">
                        <option value="">-- โหลดรายการยา... --</option>
                      </select>
                      <input type="number" id="emr_med_qty" class="form-control border-primary" placeholder="จำนวน" style="max-width: 80px;" min="1">
                      <input type="text" id="emr_med_sig" class="form-control border-primary" placeholder="วิธีใช้ (เช่น เช้า-เย็น)">
                      <button type="button" class="btn btn-primary fw-bold" onclick="addMedicationInline()"><i class="fa-solid fa-plus"></i></button>
                    </div>
                    <textarea id="emr_med_list_display" class="form-control bg-light text-primary fw-bold" rows="2" placeholder="รายการยาที่สั่งจะถูกสรุปไว้ตรงนี้..." readonly></textarea>
                  </div>

                  <!-- ส่วนสรุปและนัดหมาย (3 ช่อง) -->
                  <div class="mb-3 border p-3 rounded-3 bg-light">
                    <label class="form-label fw-bold small text-secondary mb-2"><i class="fa-solid fa-clipboard-check"></i> สรุปและนัดหมาย</label>
                    <div class="mb-2">
                      <input type="text" id="emr_side_effect" class="form-control form-control-sm" placeholder="อาการข้างเคียงหลังทำ (เช่น ไม่มี, บวมเล็กน้อย, ช้ำแดง)">
                    </div>
                    <div class="row g-2 mb-2">
                      <div class="col-md-5"><label class="small text-muted" style="font-size: 0.7rem;">วันนัดถัดไป</label><input type="date" id="emr_next_appointment_date" class="form-control form-control-sm"></div>
                      <div class="col-md-7"><label class="small text-muted" style="font-size: 0.7rem;">หมายเหตุนัด</label><input type="text" id="emr_next_appointment_note" class="form-control form-control-sm" placeholder="ระบุเหตุผลการนัด"></div>
                    </div>
                    <div class="mt-2">
                      <label class="small text-muted" style="font-size: 0.7rem;">แพทย์ผู้ทำหัตถการ (อัตโนมัติ)</label>
                      <input type="text" id="emr_doctor_name" class="form-control form-control-sm bg-white fw-bold text-primary" readonly>
                    </div>
                  </div>

                  <button type="submit" class="btn btn-primary w-100 rounded-pill fw-bold shadow-sm py-2"><i class="fa-solid fa-floppy-disk me-1"></i> บันทึกเวชระเบียน</button>
                </form>
              </div>
            </div>
            
            <div class="col-lg-6 col-md-12">
              <div class="bg-white p-4 rounded-4 shadow-sm border mb-4 h-100">
                <h5 class="fw-bold mb-3"><i class="fa-solid fa-clock-rotate-left text-warning me-2"></i> ประวัติย้อนหลัง</h5>
                <!-- 🌟 ขยายความสูงของกล่องประวัติให้ยาวเต็มหน้าจอ -->
                <div class="timeline custom-scrollbar" id="emrTimeline" style="height: calc(100vh - 250px); min-height: 500px; overflow-y: auto; padding-right: 5px;"><div class="text-muted text-center py-4">รอเลือกคนไข้...</div></div>
              </div>
            </div>
            
          </div>
        </div>

        <!-- Tab 2: Gallery -->
        <div class="tab-pane-custom" id="gallery-content" style="display: none;">
          <div class="bg-white p-4 rounded-4 shadow-sm border mb-4">
            <h5 class="fw-bold text-primary mb-3"><i class="fa-solid fa-camera me-2"></i> มาร์กจุดตำแหน่งรักษา</h5>
            <div class="row">
              <div class="col-md-6 offset-md-3 text-center">
                <div class="d-flex justify-content-center gap-2 mb-3">
                  <button class="btn btn-sm btn-outline-secondary rounded-pill px-3 fw-bold" onclick="loadTemplate('front')">หน้าตรง</button>
                  <button class="btn btn-sm btn-outline-secondary rounded-pill px-3 fw-bold" onclick="loadTemplate('side')">ด้านข้าง</button>
                  <button class="btn btn-sm btn-outline-secondary rounded-pill px-3 fw-bold" onclick="loadTemplate('body')">ลำตัว</button>
                </div>

                <div class="canvas-container mb-3"><canvas id="faceCanvas" width="400" height="350"></canvas></div>
                <input type="file" id="canvasFileInput" class="d-none" accept="image/*" onchange="loadCanvasBg(this)">
                <button class="btn btn-sm btn-outline-primary rounded-pill" onclick="document.getElementById('canvasFileInput').click()"><i class="fa-solid fa-image"></i> โหลดรูปเอง</button>
                <button class="btn btn-sm btn-outline-danger rounded-pill mx-1" onclick="clearCanvas()"><i class="fa-solid fa-eraser"></i> ล้าง</button>
                <input type="color" id="drawColor" value="#e11d48" class="form-control form-control-color rounded-circle d-inline-block align-middle" style="width: 32px; height: 32px; padding: 2px;" title="เลือกสีปากกา">
                <button class="btn btn-sm btn-success rounded-pill" onclick="savePhotoToServer('MARKING')"><i class="fa-solid fa-floppy-disk"></i> บันทึก</button>
              </div>
            </div>
          </div>
          
          <div class="bg-white p-4 rounded-4 shadow-sm border mb-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h5 class="fw-bold text-secondary m-0"><i class="fa-solid fa-photo-film me-2"></i> คลังภาพย้อนหลัง</h5>
              <button class="btn btn-sm btn-primary rounded-pill fw-bold shadow-sm" onclick="openCompareMode()"><i class="fa-solid fa-code-compare me-1"></i> โหมดเปรียบเทียบ (Before/After)</button>
            </div>
            <div class="row g-3" id="patientPhotoGrid"><div class="text-center py-4 text-muted">รอเลือกคนไข้...</div></div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<script>
  var currentHN = ''; var currentQueueData = []; var canvas, ctx, isDrawing = false;
  var pendingDeductions = []; 
  var pendingMeds = []; 
  
  function initDoctorModule() {
    renderEmrQueue();
    if(window.emrQueueInterval) clearInterval(window.emrQueueInterval);
    window.emrQueueInterval = setInterval(renderEmrQueue, 5000);

    const staffElem = document.getElementById('display-staff-name');
    if (staffElem && document.getElementById('emr_doctor_name')) {
      document.getElementById('emr_doctor_name').value = staffElem.innerText;
    }
  }
  initDoctorModule();

  async function renderEmrQueue() {
    try {
      const res = await fetch('/api/queue');
      const data = await res.json();
      currentQueueData = data.data || [];
      const list = document.getElementById('emrQueueList');
      if(!list) return;
      document.getElementById('emrQueueCount').innerText = `${currentQueueData.length} คิว`;
      if (currentQueueData.length === 0) { list.innerHTML = `<div class="text-center py-4 text-muted">ไม่มีคิวรอตรวจ</div>`; return; }

      let html = '';
      currentQueueData.forEach(q => {
        const isActive = (q.hn === currentHN) ? 'active' : '';
        
        let typeBadge = q.is_walkin ? '<span class="badge bg-info text-white ms-1" style="font-size: 0.65rem;">Walk-in</span>' : '<span class="badge bg-success text-white ms-1" style="font-size: 0.65rem;">นัดหมาย</span>';
        
        let vitalsHtml = (q.bp || q.pulse || q.weight || q.height) 
            ? `<div class="mt-2 pt-2 border-top border-light small text-muted" style="font-size: 0.75rem;"><i class="fa-solid fa-heart-pulse text-danger me-1"></i> BP: <b>${q.bp||'-'}</b> | HR: <b>${q.pulse||'-'}</b> | W: <b>${q.weight||'-'}</b> | H: <b>${q.height||'-'}</b></div>` 
            : '';
            
        let noteBadge = (q.notes && q.notes !== 'Walk-in') 
            ? `<div class="mt-1 small fw-bold text-success" style="font-size: 0.75rem;"><i class="fa-solid fa-bullseye me-1"></i> ${q.notes}</div>` 
            : '';

        html += `<div class="card pos-queue-card ${isActive} mb-2 border-0 bg-light shadow-sm" onclick="selectPatient('${q.hn}')">
                  <div class="card-body p-3">
                    <h6 class="fw-bold text-primary m-0 mb-1">${q.name} ${typeBadge}</h6>
                    <small class="text-muted"><i class="fa-solid fa-address-card me-1"></i> ${q.hn}</small>
                    ${noteBadge}
                    ${vitalsHtml}
                  </div>
                 </div>`;
      });
      list.innerHTML = html;
    } catch(e) { console.error('Error rendering queue:', e); }
  }

  async function selectPatient(hn) {
    currentHN = hn;
    pendingDeductions = []; 
    pendingMeds = []; 
    
    document.getElementById('emr_treatment').value = ''; 
    document.getElementById('emr_med_list_display').value = ''; 
    document.getElementById('emr_med_qty').value = '';
    document.getElementById('emr_med_sig').value = '';
    
    Swal.showLoading();
    const res = await fetch(`/api/patients/${hn}`);
    const data = await res.json();
    const p = data.data;
    
    document.getElementById('hdr_name').innerText = p.full_name;
    document.getElementById('hdr_hn').innerText = p.id;
    document.getElementById('hdr_phone').innerText = p.phone || '-';
    
    let ageText = '-';
    if (p.dob) {
      const dob = new Date(p.dob);
      const ageDate = new Date(Date.now() - dob.getTime());
      ageText = Math.abs(ageDate.getUTCFullYear() - 1970) + ' ปี';
    }
    document.getElementById('hdr_age').innerText = ageText;
    
    let alertDetails = [];
    if (p.allergies && p.allergies !== '-' && p.allergies !== 'ไม่มี') {
      alertDetails.push(`<span class="text-danger fw-bold">แพ้ยา:</span> ${p.allergies}`);
    }
    if (p.congenital_disease && p.congenital_disease !== '-' && p.congenital_disease !== 'ไม่มี') {
      alertDetails.push(`<span class="text-danger fw-bold">โรคประจำตัว:</span> ${p.congenital_disease}`);
    }

    if (alertDetails.length > 0) {
      document.getElementById('allergyAlert').style.display = 'flex';
      document.getElementById('allergyDetails').innerHTML = alertDetails.join('<br>');
    } else { 
      document.getElementById('allergyAlert').style.display = 'none'; 
    }
    
    const queueInfo = currentQueueData.find(q => q.hn === hn);
    if (queueInfo && (queueInfo.bp || queueInfo.pulse || queueInfo.weight || queueInfo.height)) {
      document.getElementById('vitalsBanner').style.display = 'flex';
      document.getElementById('v_bp').innerText = queueInfo.bp || '-';
      document.getElementById('v_pulse').innerText = queueInfo.pulse || '-';
      document.getElementById('v_weight').innerText = queueInfo.weight || '-';
      document.getElementById('v_height').innerText = queueInfo.height || '-';
    } else {
      document.getElementById('vitalsBanner').style.display = 'none';
    }

    const invRes = await fetch('/api/inventory');
    const invData = await invRes.json();
    let medOptions = '<option value="">-- เลือกยา / สกินแคร์ --</option>';
    invData.data.forEach(item => {
      if (item.type === 'MEDICINE' || item.type === 'SKINCARE') {
        medOptions += `<option value="${item.id}" data-name="${item.name}" data-unit="${item.unit}" data-price="${item.price}">${item.name} (คลัง: ${item.stock})</option>`;
      }
    });
    document.getElementById('emr_med_select').innerHTML = medOptions;

    const cRes = await fetch(`/api/patients/${hn}/courses`);
    const cData = await cRes.json();
    let courseOptions = '<option value="">-- เลือกคอร์ส/หัตถการที่ต้องการใช้ --</option>';
    let hasCourse = false; 
    
    cData.data.forEach(c => {
      let remain = c.total_qty - c.used_qty;
      let displayName = c.product_name || c.product_id;
      let unitName = c.unit || 'ครั้ง';
      if(remain > 0) {
        hasCourse = true;
        courseOptions += `<option value="${c.id}" data-name="${displayName}" data-remain="${remain}">เหลือ ${remain} ${unitName} - ${displayName}</option>`;
      }
    });
    document.getElementById('emr_course_select').innerHTML = courseOptions;

    if (hasCourse) {
      document.getElementById('emr_deduct_section').style.display = 'block';
    } else {
      document.getElementById('emr_deduct_section').style.display = 'none';
    }

    loadEMRHistory(hn);
    loadPatientPhotos(hn);
    renderEmrQueue();
    Swal.close();
  }

  function deductCourseInline() {
    let sel = document.getElementById('emr_course_select');
    let qtyInput = document.getElementById('emr_course_qty');
    let courseId = sel.value;
    let qty = parseFloat(qtyInput.value);

    if(!courseId) return Swal.fire('แจ้งเตือน', 'กรุณาเลือกคอร์สหรือโปรโมชั่นก่อน', 'warning');
    if(!qty || qty <= 0) return Swal.fire('แจ้งเตือน', 'กรุณาระบุจำนวนที่ใช้', 'warning');

    let opt = sel.options[sel.selectedIndex];
    let remain = parseFloat(opt.getAttribute('data-remain'));
    let name = opt.getAttribute('data-name');

    if(qty > remain) return Swal.fire('Error', 'ไม่สามารถตัดเกินจำนวนคงเหลือได้', 'error');

    pendingDeductions.push({ course_id: courseId, deduct_amount: qty });

    opt.setAttribute('data-remain', remain - qty);
    opt.innerText = `เหลือ ${remain - qty} - ${name} (รอเซฟ)`;

    let tx = document.getElementById('emr_treatment');
    let newTxText = `- หักสิทธิ์: ${name} (ใช้ไป ${qty})`;
    tx.value = tx.value ? tx.value + `\n${newTxText}` : newTxText;

    qtyInput.value = ''; 
    
    Swal.fire({ icon: 'info', title: 'เพิ่มรายการแล้ว (จะถูกหักเมื่อกดบันทึกเวชระเบียน)', toast: true, position: 'top-end', timer: 2500, showConfirmButton: false });
  }

  function addMedicationInline() {
    let sel = document.getElementById('emr_med_select');
    let qtyInput = document.getElementById('emr_med_qty');
    let sigInput = document.getElementById('emr_med_sig');
    
    if(!sel.value) return Swal.fire('แจ้งเตือน', 'กรุณาเลือกรายการยาที่ต้องการสั่ง', 'warning');
    if(!qtyInput.value || qtyInput.value <= 0) return Swal.fire('แจ้งเตือน', 'กรุณาระบุจำนวนยา', 'warning');

    let opt = sel.options[sel.selectedIndex];
    let medObj = {
      product_id: sel.value,
      name: opt.getAttribute('data-name'),
      unit: opt.getAttribute('data-unit'),
      price: parseFloat(opt.getAttribute('data-price') || 0),
      qty: parseFloat(qtyInput.value),
      sig: sigInput.value || 'ตามแพทย์สั่ง'
    };

    pendingMeds.push(medObj);

    let displayBox = document.getElementById('emr_med_list_display');
    displayBox.value = pendingMeds.map((m, i) => `${i+1}. ${m.name} จำนวน ${m.qty} ${m.unit} - ${m.sig}`).join('\n');

    sel.value = ''; 
    qtyInput.value = ''; 
    sigInput.value = '';
  }

  function switchTab(t) {
    document.getElementById('btn-tab-emr').classList.remove('active'); document.getElementById('btn-tab-gallery').classList.remove('active');
    document.getElementById('emr-content').style.display = 'none'; document.getElementById('gallery-content').style.display = 'none';
    document.getElementById(`btn-tab-${t}`).classList.add('active'); document.getElementById(`${t}-content`).style.display = 'block';
    if(t==='gallery' && !canvas) {
      canvas = document.getElementById('faceCanvas'); ctx = canvas.getContext('2d'); clearCanvas();
      canvas.onmousedown = (e) => { isDrawing = true; ctx.beginPath(); ctx.moveTo(e.offsetX, e.offsetY); };
      canvas.onmousemove = (e) => { if(isDrawing){ ctx.lineTo(e.offsetX, e.offsetY); ctx.strokeStyle = document.getElementById('drawColor').value; ctx.lineWidth = 3; ctx.stroke(); }};
      canvas.onmouseup = () => isDrawing = false;
    }
  }

  function loadTemplate(type) {
    let url = '';
    if(type === 'front') url = 'https://via.placeholder.com/400x350/f1f5f9/94a3b8?text=Face+Front';
    if(type === 'side') url = 'https://via.placeholder.com/400x350/f1f5f9/94a3b8?text=Face+Side';
    if(type === 'body') url = 'https://via.placeholder.com/400x350/f1f5f9/94a3b8?text=Body+Structure';
    
    const img = new Image();
    img.crossOrigin = "Anonymous";
    img.onload = () => { clearCanvas(); ctx.drawImage(img, 0, 0, canvas.width, canvas.height); };
    img.src = url;
  }

  async function openCompareMode() {
    if(!currentHN) return Swal.fire('แจ้งเตือน', 'กรุณาเลือกคนไข้ก่อน', 'warning');
    const res = await fetch(`/api/patients/${currentHN}/photos`);
    const data = await res.json();
    const photos = data.data.filter(p => p.photo_type !== 'CONSENT');
    if(photos.length < 2) return Swal.fire('ข้อมูลไม่พอ', 'ต้องมีรูปภาพหรือรูปมาร์กหน้าอย่างน้อย 2 รูป', 'warning');
    
    let options = photos.map(p => `<option value="${p.image_path}">${p.photo_type} - ${new Date(p.created_at).toLocaleDateString('th-TH')}</option>`).join('');
    
    Swal.fire({
      title: '<h4 class="fw-bold text-primary m-0"><i class="fa-solid fa-code-compare me-2"></i>เปรียบเทียบภาพการรักษา</h4>',
      width: '80%',
      html: `
        <div class="row mt-3">
          <div class="col-6 border-end">
            <span class="badge bg-secondary mb-2 fs-6">Before / รูปอดีต</span>
            <select id="imgBefore" class="form-select mb-3 shadow-sm border-secondary" onchange="document.getElementById('previewBefore').src=this.value">${options}</select>
            <img id="previewBefore" src="${photos[photos.length-1].image_path}" class="img-fluid rounded border shadow-sm" style="height:400px; object-fit:contain; width:100%; background:#f8fafc;">
          </div>
          <div class="col-6">
            <span class="badge bg-success mb-2 fs-6">After / รูปปัจจุบัน</span>
            <select id="imgAfter" class="form-select mb-3 shadow-sm border-success" onchange="document.getElementById('previewAfter').src=this.value">${options}</select>
            <img id="previewAfter" src="${photos[0].image_path}" class="img-fluid rounded border shadow-sm" style="height:400px; object-fit:contain; width:100%; background:#f8fafc;">
          </div>
        </div>
      `,
      showCloseButton: true, showConfirmButton: false
    });
    document.getElementById('imgBefore').selectedIndex = photos.length - 1;
    document.getElementById('imgAfter').selectedIndex = 0;
  }

  async function saveEMR(e) {
    e.preventDefault(); if (!currentHN) return Swal.fire('แจ้งเตือน', 'กรุณาเลือกคิวก่อน', 'warning');
    
    let v_bp = document.getElementById('v_bp').innerText;
    let v_pulse = document.getElementById('v_pulse').innerText;
    let v_weight = document.getElementById('v_weight').innerText;
    let v_height = document.getElementById('v_height').innerText;

    let selectedTx = document.getElementById('emr_treatment').value;
    let area = document.getElementById('emr_area').value;
    let brand = document.getElementById('emr_brand').value;
    let lot = document.getElementById('emr_lot').value;
    let setting = document.getElementById('emr_setting').value;
    let sideEffect = document.getElementById('emr_side_effect').value;
    let doctorName = document.getElementById('emr_doctor_name').value;

    // 🌟 แก้ไขการจัดการช่องว่างให้เว้นบรรทัดเดียว (ป้องกันการเกิดช่องว่างยาวๆ)
    let finalTxArray = [];
    
    if(selectedTx) finalTxArray.push(selectedTx);
    
    let procedureDetails = [];
    if(area) procedureDetails.push(`บริเวณ: ${area}`);
    if(brand) procedureDetails.push(`ตัวยา/เครื่อง: ${brand}`);
    if(lot) procedureDetails.push(`Lot: ${lot}`);
    if(setting) procedureDetails.push(`Settings: ${setting}`);
    if(procedureDetails.length > 0) finalTxArray.push(`[รายละเอียด] ` + procedureDetails.join(' | '));

    if(pendingMeds.length > 0) {
       finalTxArray.push(`[สั่งจ่ายยา]\n` + pendingMeds.map(m => `- ${m.name} จำนวน ${m.qty} ${m.unit}`).join('\n'));
    }

    let summaryDetails = [];
    if(sideEffect) summaryDetails.push(`อาการข้างเคียง: ${sideEffect}`);
    if(doctorName) summaryDetails.push(`แพทย์ผู้ทำ: ${doctorName}`);
    if(summaryDetails.length > 0) finalTxArray.push(`[สรุป] ` + summaryDetails.join(' | '));

    // ใช้ \n แทน \n\n เพื่อลดช่องว่างเวลาแสดงผล
    let finalTreatmentDetails = finalTxArray.filter(Boolean).join('\n');

    const payload = {
      patient_id: currentHN, 
      symptoms: document.getElementById('emr_symptoms').value,
      diagnosis: document.getElementById('emr_diagnosis').value, 
      treatment_details: finalTreatmentDetails,
      next_appointment_date: document.getElementById('emr_next_appointment_date').value, 
      next_appointment_time: '10:00',
      next_appointment_note: document.getElementById('emr_next_appointment_note').value,
      bp: v_bp !== '-' ? v_bp : '', pulse: v_pulse !== '-' ? v_pulse : '',
      weight: v_weight !== '-' ? v_weight : '', height: v_height !== '-' ? v_height : '',
      prescribed_meds: pendingMeds 
    };

    try {
      Swal.fire({ title: 'กำลังบันทึกข้อมูล...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

      await fetch('/api/emr', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });

      if (pendingDeductions.length > 0) {
        const deductPromises = pendingDeductions.map(item => 
          fetch(`/api/courses/${item.course_id}/deduct`, { 
            method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify({deduct_amount: item.deduct_amount}) 
          })
        );
        await Promise.all(deductPromises); 
      }

      document.getElementById('emrForm').reset();
      document.getElementById('emr_med_list_display').value = ''; 
      
      const staffElem = document.getElementById('display-staff-name');
      if (staffElem) document.getElementById('emr_doctor_name').value = staffElem.innerText;

      pendingDeductions = []; 
      pendingMeds = []; 
      
      loadEMRHistory(currentHN); 
      renderEmrQueue();
      selectPatient(currentHN); 
      Swal.fire({ icon: 'success', title: 'บันทึกเรียบร้อย', toast: true, position: 'top-end', timer: 2000, showConfirmButton: false });
    } catch (err) {
      Swal.fire('Error', 'เกิดข้อผิดพลาดในการบันทึก', 'error');
    }
  }

  async function loadEMRHistory(hn) {
    const tl = document.getElementById('emrTimeline'); tl.innerHTML = '<div class="text-center py-4"><div class="spinner-border text-primary"></div></div>';
    try {
      const [res1, res2] = await Promise.all([fetch(`/api/emr/${hn}`), fetch('/api/appointments')]);
      const data = await res1.json(); const appts = (await res2.json()).data.filter(a => a.hn === hn);
      if (data.data.length === 0) return tl.innerHTML = '<div class="text-muted text-center py-4">ไม่มีประวัติ</div>';

      const todayStr = new Date().toISOString().split('T')[0];
      const emrsToday = data.data.filter(l => l.visit_date.startsWith(todayStr));
      const apptsToday = appts.filter(a => a.date === todayStr);

      let html = '';
      data.data.forEach((log, index) => {
         const dateStr = new Date(log.visit_date).toLocaleDateString('th-TH', { year:'numeric', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
         let paymentBtn = '';
         if (log.visit_date.startsWith(todayStr) && index === 0) {
           const latestAppt = apptsToday[apptsToday.length - 1];
           if (latestAppt && latestAppt.status === 'WAITING_PAYMENT') paymentBtn = `<button class="btn btn-sm btn-success rounded-pill px-3 shadow-sm mt-3" disabled><i class="fa-solid fa-check"></i> ส่งไปชำระเงินเรียบร้อยแล้ว</button>`;
           else if (latestAppt && latestAppt.status === 'PAID' && emrsToday.length <= apptsToday.length) paymentBtn = `<button class="btn btn-sm btn-secondary rounded-pill px-3 shadow-sm mt-3" disabled><i class="fa-solid fa-check-double"></i> ชำระเงินเสร็จสิ้น</button>`;
           else paymentBtn = `<button class="btn btn-sm btn-outline-success fw-bold rounded-pill px-3 shadow-sm mt-3" onclick="sendToPayment('${hn}', this)"><i class="fa-solid fa-hand-holding-dollar"></i> ส่งไปชำระเงิน / รับยา</button>`;
         }
         
         let vitalsLog = (log.bp || log.pulse || log.weight || log.height)
               ? `<div class="small text-muted mt-2 px-2 py-1 bg-light rounded d-inline-block border"><i class="fa-solid fa-heart-pulse text-danger me-1"></i> BP: <b>${log.bp||'-'}</b> | HR: <b>${log.pulse||'-'}</b> | W: <b>${log.weight||'-'}</b> | H: <b>${log.height||'-'}</b></div>`
               : '';

         let formattedTx = log.treatment_details ? log.treatment_details.replace(/\n/g, '<br>') : '-';
         
         // 🌟 ป้องกันกรณีเป็นค่าว่างให้แสดงขีด (-) แทน
         let dxDisplay = log.diagnosis ? log.diagnosis : '-';
         let ccDisplay = log.symptoms ? log.symptoms : '-';

         html += `<div class="border-start border-3 border-primary ps-3 pb-3 mb-4">
                    <span class="fw-bold text-primary">${dateStr} น.</span>
                    <div class="fw-bold mt-2">Dx: ${dxDisplay}</div>
                    <div class="small text-muted mt-1">CC: ${ccDisplay}</div>
                    <div class="small text-muted mt-1">Tx:<br>${formattedTx}</div>
                    ${vitalsLog}
                    <br>${paymentBtn}
                  </div>`;
      });
      tl.innerHTML = html;
    } catch(e) {}
  }

  async function sendToPayment(hn, btn) {
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> ส่ง...'; 
    btn.disabled = true;
    try {
      const res = await fetch(`/api/pos/send/${hn}`, { method: 'PUT' });
      const data = await res.json();
      
      if (data.status === 'success') {
        Swal.fire({ icon: 'success', title: 'ส่งไปการเงินสำเร็จ', toast: true, position: 'top-end', timer: 1500, showConfirmButton: false });
        
        currentHN = '';
        document.getElementById('hdr_name').innerText = 'กรุณาเลือกคิวคนไข้...';
        document.getElementById('hdr_hn').innerText = '-';
        document.getElementById('hdr_phone').innerText = '-';
        document.getElementById('hdr_age').innerText = '-';
        document.getElementById('emrTimeline').innerHTML = '<div class="text-muted text-center py-4">รอเลือกคนไข้...</div>';
        
        document.getElementById('emr_deduct_section').style.display = 'none';
        document.getElementById('vitalsBanner').style.display = 'none';
        document.getElementById('allergyAlert').style.display = 'none';
        
        renderEmrQueue();
      } else {
        Swal.fire('แจ้งเตือน', data.message, 'warning');
        btn.innerHTML = 'ส่งไปชำระเงิน / รับยา'; 
        btn.disabled = false;
        renderEmrQueue();
      }
    } catch(e) {
      Swal.fire('Error', 'เชื่อมต่อระบบล้มเหลว', 'error');
      btn.innerHTML = 'ส่งไปชำระเงิน / รับยา'; 
      btn.disabled = false;
    }
  }

  function clearCanvas() { if(ctx) { ctx.fillStyle = "#ffffff"; ctx.fillRect(0,0,canvas.width,canvas.height); } }
  function loadCanvasBg(input) { if(input.files && input.files[0]) { const reader=new FileReader(); reader.onload=(e)=>{ const img=new Image(); img.onload=()=>ctx.drawImage(img,0,0,canvas.width,canvas.height); img.src=e.target.result; }; reader.readAsDataURL(input.files[0]); } }
  
  async function savePhotoToServer(type, customData = null) {
    if (!currentHN) return Swal.fire('แจ้งเตือน', 'กรุณาเลือกคิวก่อน', 'warning');
    let base64Data = customData;
    
    if (!base64Data) {
      if (type === 'BEFORE') {
        base64Data = document.getElementById('beforeImgPreview').src;
        if (base64Data.includes('placeholder')) return Swal.fire('แจ้งเตือน', 'อัปโหลดรูปก่อนบันทึก', 'warning');
      } else {
        base64Data = canvas.toDataURL('image/png');
      }
    }

    Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
    try {
      await fetch('/api/patients/photos', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ patient_id: currentHN, photo_type: type, image_data: base64Data }) });
      Swal.fire({ icon: 'success', title: 'บันทึกเรียบร้อย', toast: true, position: 'top-end', timer: 1500, showConfirmButton: false });
      loadPatientPhotos(currentHN);
    } catch(e) {}
  }

  async function loadPatientPhotos(hn) {
    const grid = document.getElementById('patientPhotoGrid');
    try {
      const res = await fetch(`/api/patients/${hn}/photos`);
      const data = await res.json();
      if(data.data.length === 0) return grid.innerHTML = '<div class="text-center py-4 text-muted">ไม่มีรูปภาพ</div>';
      
      let html = '';
      data.data.forEach(p => {
        let typeBadge = '';
        if(p.photo_type === 'BEFORE') typeBadge = '<span class="badge bg-secondary">BEFORE</span>';
        else if(p.photo_type === 'CONSENT') typeBadge = '<span class="badge bg-danger">ลายเซ็นยินยอม (CONSENT)</span>';
        else typeBadge = '<span class="badge bg-primary">MARKING</span>';
        
        let dateStr = new Date(p.created_at).toLocaleDateString('th-TH');

        html += `<div class="col-md-3 col-6"><div class="bg-light p-2 text-center rounded-3 position-relative"><button class="btn btn-sm btn-danger position-absolute top-0 end-0 m-2 rounded-circle" onclick="deletePhoto(${p.id})"><i class="fa-solid fa-trash fa-xs"></i></button><img src="${p.image_path}" class="img-fluid rounded-3 mb-2 border" style="height:150px; object-fit:contain; width:100%; cursor:pointer; background:#fff;" onclick="window.open('${p.image_path}')"><div class="small">${typeBadge}</div><div class="text-muted" style="font-size: 0.7rem;">${dateStr}</div></div></div>`;
      });
      grid.innerHTML = html;
    } catch(e) {}
  }

  async function deletePhoto(id) {
    if ((await Swal.fire({ title: 'ลบรูปภาพ?', showCancelButton: true })).isConfirmed) {
      await fetch(`/api/patients/photos/${id}`, { method: 'DELETE' }); loadPatientPhotos(currentHN);
    }
  }
</script>
