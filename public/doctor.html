<style>
  .clinic-nav-pills .nav-link { color: #64748b; font-weight: bold; border-radius: 12px; padding: 10px 20px; border: 1px solid transparent; margin-right: 8px; cursor: pointer; }
  .clinic-nav-pills .nav-link.active { background-color: #3b82f6; color: #fff; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3); }
  .pos-queue-card { transition: all 0.2s; cursor: pointer; border-left: 4px solid #cbd5e1; }
  .pos-queue-card.active { border-left-color: #3b82f6; background-color: #eff6ff !important; }
  .allergy-alert-box { background: #fff1f2; border-left: 5px solid #e11d48; border-radius: 12px; padding: 12px 20px; color: #9f1239; display: none; }
  .canvas-container { position: relative; border: 2px dashed #cbd5e1; border-radius: 16px; background: #f8fafc; overflow: hidden; display: flex; justify-content: center; align-items: center; min-height: 350px; }
  .custom-scrollbar::-webkit-scrollbar { width: 6px; } .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 10px; } .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
</style>

<div class="container-fluid py-4" style="max-width: 1500px; height: 100vh; display: flex; flex-direction: column;">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="fw-bold text-danger m-0"><i class="fa-solid fa-stethoscope me-2"></i> ห้องตรวจแพทย์ (EMR)</h3>
    <button class="btn btn-outline-danger fw-bold rounded-pill px-4" onclick="closeModule()"><i class="fa-solid fa-xmark me-2"></i> ปิดหน้านี้</button>
  </div>

  <div class="row g-4 flex-grow-1" style="min-height: 0;">
    <!-- 📋 ฝั่งซ้าย: คิวรอตรวจ (มีป้าย Vitals) -->
    <div class="col-lg-3 col-md-4 h-100">
      <div class="bg-white p-4 rounded-4 shadow-sm border h-100 d-flex flex-column">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h6 class="fw-bold m-0"><i class="fa-solid fa-users me-2 text-primary"></i> คิวรอตรวจ</h6>
          <span class="badge bg-primary rounded-pill" id="emrQueueCount">0 คิว</span>
        </div>
        <div id="emrQueueList" class="custom-scrollbar" style="overflow-y: auto; flex-grow: 1; padding-right: 5px;"></div>
      </div>
    </div>

    <!-- 👨‍⚕️ ฝั่งขวา: รายละเอียด EMR -->
    <div class="col-lg-9 col-md-8 h-100 d-flex flex-column custom-scrollbar" style="overflow-y: auto; overflow-x: hidden; padding-right: 5px;">
      
      <!-- ข้อมูลคนไข้แบบย่อส่วน (ให้หมอดูง่ายๆ) -->
      <div class="bg-white p-3 rounded-4 shadow-sm border mb-3 d-flex justify-content-between align-items-center">
        <div>
          <h5 class="fw-bold m-0 text-primary" id="hdr_name">กรุณาเลือกคิวคนไข้...</h5>
          <div class="small text-muted mt-1"><i class="fa-solid fa-address-card me-1"></i> HN: <span id="hdr_hn">-</span></div>
        </div>
      </div>

      <div id="allergyAlert" class="allergy-alert-box align-items-center justify-content-between mb-3 shadow-sm">
        <div class="d-flex align-items-center"><i class="fa-solid fa-triangle-exclamation fa-2x me-3 text-danger"></i><div><div class="fw-bold fs-6" id="allergyTitle">⚠️ ข้อมูลแพ้ยา</div><div class="small text-danger fw-semibold" id="allergyDetails"></div></div></div>
      </div>

      <ul class="nav nav-pills clinic-nav-pills mb-4" style="position: sticky; top: 0; z-index: 10; background: #f8fafc; padding: 10px 0;">
        <li class="nav-item"><button class="nav-link active" id="btn-tab-emr" onclick="switchTab('emr')"><i class="fa-solid fa-notes-medical me-1"></i> บันทึกการตรวจ (EMR)</button></li>
        <li class="nav-item"><button class="nav-link" id="btn-tab-gallery" onclick="switchTab('gallery')"><i class="fa-solid fa-images me-1"></i> รูปถ่าย/มาร์กหน้า</button></li>
      </ul>

      <div class="tab-content flex-grow-1">
        <!-- Tab 1: EMR -->
        <div class="tab-pane-custom" id="emr-content" style="display: block;">
          <div class="row g-4">
            <div class="col-md-5">
              <div class="bg-white p-4 rounded-4 shadow-sm border mb-4">
                <h5 class="fw-bold text-primary mb-3"><i class="fa-solid fa-stethoscope me-2"></i> บันทึกเวชระเบียน</h5>
                <form id="emrForm" onsubmit="saveEMR(event)">
                  <div class="mb-3"><label class="form-label fw-bold small text-muted">อาการ (CC)</label><textarea id="emr_symptoms" class="form-control" rows="2" required></textarea></div>
                  <div class="mb-3"><label class="form-label fw-bold small text-muted">วินิจฉัย (Dx)</label><textarea id="emr_diagnosis" class="form-control" rows="2" required></textarea></div>
                  <div class="mb-3"><label class="form-label fw-bold small text-muted">หัตถการ/ยา (Tx)</label><textarea id="emr_treatment" class="form-control" rows="2"></textarea></div>
                  <div class="row g-2 mb-3">
                    <div class="col-md-5"><label class="small text-primary fw-bold">วันนัดถัดไป</label><input type="date" id="emr_next_appointment_date" class="form-control"></div>
                    <div class="col-md-7"><label class="small text-primary fw-bold">หมายเหตุนัด</label><input type="text" id="emr_next_appointment_note" class="form-control"></div>
                  </div>
                  <button type="submit" class="btn btn-success w-100 rounded-pill fw-bold shadow-sm py-2"><i class="fa-solid fa-circle-plus me-1"></i> บันทึกการตรวจ</button>
                </form>
              </div>
            </div>
            <div class="col-md-7">
              <div class="bg-white p-4 rounded-4 shadow-sm border mb-4 h-100">
                <h5 class="fw-bold mb-3"><i class="fa-solid fa-clock-rotate-left text-warning me-2"></i> ประวัติย้อนหลัง</h5>
                <div class="timeline custom-scrollbar" id="emrTimeline" style="height: 500px; overflow-y: auto; padding-right: 5px;"><div class="text-muted text-center py-4">รอเลือกคนไข้...</div></div>
              </div>
            </div>
          </div>
        </div>

        <!-- Tab 2: Gallery -->
        <div class="tab-pane-custom" id="gallery-content" style="display: none;">
          <div class="bg-white p-4 rounded-4 shadow-sm border mb-4">
            <h5 class="fw-bold text-primary mb-3"><i class="fa-solid fa-camera me-2"></i> มาร์กจุดตำแหน่งรักษา</h5>
            <div class="row">
              <div class="col-md-6 offset-md-3 text-center">
                <div class="canvas-container mb-3"><canvas id="faceCanvas" width="400" height="350"></canvas></div>
                <input type="file" id="canvasFileInput" class="d-none" accept="image/*" onchange="loadCanvasBg(this)">
                <button class="btn btn-sm btn-outline-primary rounded-pill" onclick="document.getElementById('canvasFileInput').click()"><i class="fa-solid fa-image"></i> โหลดรูป</button>
                <button class="btn btn-sm btn-outline-danger rounded-pill mx-1" onclick="clearCanvas()"><i class="fa-solid fa-eraser"></i> ล้าง</button>
                <button class="btn btn-sm btn-success rounded-pill" onclick="savePhotoToServer('MARKING')"><i class="fa-solid fa-floppy-disk"></i> บันทึก</button>
              </div>
            </div>
          </div>
          <div class="bg-white p-4 rounded-4 shadow-sm border mb-4">
            <h5 class="fw-bold mb-3 text-secondary"><i class="fa-solid fa-photo-film me-2"></i> คลังภาพย้อนหลัง</h5>
            <div class="row g-3" id="patientPhotoGrid"><div class="text-center py-4 text-muted">รอเลือกคนไข้...</div></div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<script>
  var currentHN = ''; var canvas, ctx, isDrawing = false;
  
  function initDoctorModule() {
    renderEmrQueue();
    if(window.emrQueueInterval) clearInterval(window.emrQueueInterval);
    window.emrQueueInterval = setInterval(renderEmrQueue, 5000);
  }
  initDoctorModule();

  async function renderEmrQueue() {
    try {
      const res = await fetch('/api/queue');
      const data = await res.json();
      const list = document.getElementById('emrQueueList');
      if(!list) return;
      document.getElementById('emrQueueCount').innerText = `${data.data.length} คิว`;
      if (data.data.length === 0) { list.innerHTML = `<div class="text-center py-4 text-muted">ไม่มีคิวรอตรวจ</div>`; return; }

      let html = '';
      data.data.forEach(q => {
        const isActive = (q.hn === currentHN) ? 'active' : '';
        let typeBadge = q.is_walkin ? '<span class="badge bg-info text-white ms-1" style="font-size: 0.65rem;">Walk-in</span>' : '<span class="badge bg-success text-white ms-1" style="font-size: 0.65rem;">นัดหมาย</span>';
        let vitalsHtml = (q.bp || q.weight || q.height) ? `<div class="mt-2 pt-2 border-top border-light small text-muted" style="font-size: 0.75rem;"><i class="fa-solid fa-heart-pulse text-danger me-1"></i> BP: <b>${q.bp||'-'}</b> | W: <b>${q.weight||'-'}</b> | H: <b>${q.height||'-'}</b></div>` : '';
        
        html += `<div class="card pos-queue-card ${isActive} mb-2 border-0 bg-light shadow-sm" onclick="selectPatient('${q.hn}')">
                  <div class="card-body p-3">
                    <h6 class="fw-bold text-primary m-0 mb-1">${q.name} ${typeBadge}</h6>
                    <small class="text-muted"><i class="fa-solid fa-address-card me-1"></i> ${q.hn}</small>
                    ${vitalsHtml}
                  </div>
                 </div>`;
      });
      list.innerHTML = html;
    } catch(e) {}
  }

  async function selectPatient(hn) {
    currentHN = hn;
    Swal.showLoading();
    const res = await fetch(`/api/patients/${hn}`);
    const data = await res.json();
    const p = data.data;
    document.getElementById('hdr_name').innerText = p.full_name;
    document.getElementById('hdr_hn').innerText = p.id;
    
    if (p.allergies && p.allergies !== '-' && p.allergies !== 'ไม่มี') {
      document.getElementById('allergyAlert').style.display = 'flex';
      document.getElementById('allergyDetails').innerText = `แพ้ยา: ${p.allergies}`;
    } else { document.getElementById('allergyAlert').style.display = 'none'; }
    
    loadEMRHistory(hn);
    loadPatientPhotos(hn);
    renderEmrQueue();
    Swal.close();
  }

  function switchTab(t) {
    document.getElementById('btn-tab-emr').classList.remove('active'); document.getElementById('btn-tab-gallery').classList.remove('active');
    document.getElementById('emr-content').style.display = 'none'; document.getElementById('gallery-content').style.display = 'none';
    document.getElementById(`btn-tab-${t}`).classList.add('active'); document.getElementById(`${t}-content`).style.display = 'block';
    if(t==='gallery' && !canvas) {
      canvas = document.getElementById('faceCanvas'); ctx = canvas.getContext('2d'); clearCanvas();
      canvas.onmousedown = (e) => { isDrawing = true; ctx.beginPath(); ctx.moveTo(e.offsetX, e.offsetY); };
      canvas.onmousemove = (e) => { if(isDrawing){ ctx.lineTo(e.offsetX, e.offsetY); ctx.strokeStyle = document.getElementById('drawColor').value; ctx.lineWidth = 3; ctx.stroke(); }};
      canvas.onmouseup = () => isDrawing = false;
    }
  }

  async function saveEMR(e) {
    e.preventDefault(); if (!currentHN) return Swal.fire('แจ้งเตือน', 'กรุณาเลือกคิวก่อน', 'warning');
    const payload = {
      patient_id: currentHN, symptoms: document.getElementById('emr_symptoms').value,
      diagnosis: document.getElementById('emr_diagnosis').value, treatment_details: document.getElementById('emr_treatment').value,
      next_appointment_date: document.getElementById('emr_next_appointment_date').value, next_appointment_time: '10:00',
      next_appointment_note: document.getElementById('emr_next_appointment_note').value
    };
    try {
      await fetch('/api/emr', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      await fetch(`/api/queue/complete/${currentHN}`, { method: 'PUT' });
      document.getElementById('emrForm').reset();
      loadEMRHistory(currentHN); renderEmrQueue();
      Swal.fire({ icon: 'success', title: 'บันทึกเรียบร้อย', toast: true, position: 'top-end', timer: 2000, showConfirmButton: false });
    } catch (err) {}
  }

  async function loadEMRHistory(hn) {
    const tl = document.getElementById('emrTimeline'); tl.innerHTML = '<div class="text-center py-4"><div class="spinner-border text-primary"></div></div>';
    try {
      const [res1, res2] = await Promise.all([fetch(`/api/emr/${hn}`), fetch('/api/appointments')]);
      const data = await res1.json(); const appts = (await res2.json()).data.filter(a => a.hn === hn);
      if (data.data.length === 0) return tl.innerHTML = '<div class="text-muted text-center py-4">ไม่มีประวัติ</div>';

      const todayStr = new Date().toISOString().split('T')[0];
      const emrsToday = data.data.filter(l => l.visit_date.startsWith(todayStr));
      const apptsToday = appts.filter(a => a.date === todayStr);

      let html = '';
      data.data.forEach((log, index) => {
         const dateStr = new Date(log.visit_date).toLocaleDateString('th-TH', { year:'numeric', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
         let paymentBtn = '';
         if (log.visit_date.startsWith(todayStr) && index === 0) {
           const latestAppt = apptsToday[apptsToday.length - 1];
           if (latestAppt && latestAppt.status === 'WAITING_PAYMENT') paymentBtn = `<button class="btn btn-sm btn-success rounded-pill px-3 shadow-sm mt-3" disabled><i class="fa-solid fa-check"></i> ส่งไปชำระเงินเรียบร้อยแล้ว</button>`;
           else if (latestAppt && latestAppt.status === 'PAID' && emrsToday.length <= apptsToday.length) paymentBtn = `<button class="btn btn-sm btn-secondary rounded-pill px-3 shadow-sm mt-3" disabled><i class="fa-solid fa-check-double"></i> ชำระเงินเสร็จสิ้น</button>`;
           else paymentBtn = `<button class="btn btn-sm btn-outline-success fw-bold rounded-pill px-3 shadow-sm mt-3" onclick="sendToPayment('${hn}', this)"><i class="fa-solid fa-hand-holding-dollar"></i> ส่งไปชำระเงิน / รับยา</button>`;
         }
         html += `<div class="border-start border-3 border-primary ps-3 pb-3 mb-4"><span class="fw-bold text-primary">${dateStr} น.</span><div class="fw-bold mt-2">Dx: ${log.diagnosis}</div><div class="small text-muted mt-1">CC: ${log.symptoms}</div><div class="small text-muted mt-1">Tx: ${log.treatment_details}</div>${paymentBtn}</div>`;
      });
      tl.innerHTML = html;
    } catch(e) {}
  }

  async function sendToPayment(hn, btn) {
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> ส่ง...'; btn.disabled = true;
    try {
      const res = await fetch(`/api/pos/send/${hn}`, { method: 'PUT' });
      if ((await res.json()).status === 'success') {
        btn.className = 'btn btn-sm btn-success text-white fw-bold rounded-pill px-3 shadow-sm mt-3'; btn.innerHTML = '<i class="fa-solid fa-check"></i> ส่งไปชำระเงินเรียบร้อยแล้ว';
        Swal.fire({ icon: 'success', title: 'ส่งไปการเงินสำเร็จ', toast: true, position: 'top-end', timer: 1500, showConfirmButton: false });
      }
    } catch(e) {}
  }

  function clearCanvas() { if(ctx) { ctx.fillStyle = "#ffffff"; ctx.fillRect(0,0,canvas.width,canvas.height); } }
  function loadCanvasBg(input) { if(input.files && input.files[0]) { const reader=new FileReader(); reader.onload=(e)=>{ const img=new Image(); img.onload=()=>ctx.drawImage(img,0,0,canvas.width,canvas.height); img.src=e.target.result; }; reader.readAsDataURL(input.files[0]); } }
  
  async function savePhotoToServer(type) {
    if (!currentHN) return Swal.fire('แจ้งเตือน', 'กรุณาเลือกคิวก่อน', 'warning');
    Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
    try {
      await fetch('/api/patients/photos', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ patient_id: currentHN, photo_type: type, image_data: canvas.toDataURL('image/png') }) });
      Swal.fire({ icon: 'success', title: 'บันทึกรูปภาพเรียบร้อย', toast: true, position: 'top-end', timer: 1500, showConfirmButton: false });
      loadPatientPhotos(currentHN);
    } catch(e) {}
  }

  async function loadPatientPhotos(hn) {
    const grid = document.getElementById('patientPhotoGrid');
    try {
      const res = await fetch(`/api/patients/${hn}/photos`);
      const data = await res.json();
      if(data.data.length === 0) return grid.innerHTML = '<div class="text-center py-4 text-muted">ไม่มีรูปภาพ</div>';
      let html = '';
      data.data.forEach(p => {
        html += `<div class="col-md-3 col-6"><div class="bg-light p-2 text-center rounded-3 position-relative"><button class="btn btn-sm btn-danger position-absolute top-0 end-0 m-2 rounded-circle" onclick="deletePhoto(${p.id})"><i class="fa-solid fa-trash fa-xs"></i></button><img src="${p.image_path}" class="img-fluid rounded-3 mb-2" style="height:150px; object-fit:cover; width:100%; cursor:pointer;" onclick="window.open('${p.image_path}')"></div></div>`;
      });
      grid.innerHTML = html;
    } catch(e) {}
  }

  async function deletePhoto(id) {
    if ((await Swal.fire({ title: 'ลบรูปภาพ?', showCancelButton: true })).isConfirmed) {
      await fetch(`/api/patients/photos/${id}`, { method: 'DELETE' }); loadPatientPhotos(currentHN);
    }
  }
</script>
