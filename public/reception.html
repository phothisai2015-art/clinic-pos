<style>
  /* การตกแต่ง UI ให้ดูทันสมัยและน่าใช้งาน */
  .nav-pills-custom .nav-link { color: #64748b; font-weight: bold; border-radius: 12px; padding: 12px 24px; transition: 0.2s; border: 1px solid transparent; margin-right: 10px; cursor: pointer; }
  .nav-pills-custom .nav-link.active { background-color: #3b82f6; color: #fff; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3); }
  .nav-pills-custom .nav-link:hover:not(.active) { background-color: #f1f5f9; border-color: #cbd5e1; }

  .course-card { transition: 0.2s ease-in-out; border: 2px solid #e2e8f0; border-radius: 16px; background-color: #ffffff; height: 100%; display: flex; flex-direction: column; }
  .course-card:hover { border-color: #93c5fd; transform: translateY(-4px); box-shadow: 0 10px 25px rgba(0,0,0,0.08); }
  .course-card .card-body { flex-grow: 1; display: flex; flex-direction: column; }
  
  .allergy-alert { background: #fff1f2; border-left: 5px solid #e11d48; border-radius: 12px; padding: 12px 20px; color: #9f1239; display: none; }
  
  .custom-scrollbar::-webkit-scrollbar { width: 6px; }
  .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 10px; }
  .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
</style>

<div class="container-fluid py-4" style="max-width: 1400px; height: 100vh; display: flex; flex-direction: column;">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="fw-bold text-info m-0"><i class="fa-solid fa-clipboard-user me-2"></i> ลงทะเบียน & คัดกรองคนไข้</h3>
    <button class="btn btn-outline-danger fw-bold rounded-pill px-4 shadow-sm" onclick="closeModule()"><i class="fa-solid fa-xmark me-2"></i> ปิดหน้านี้</button>
  </div>

  <!-- 🌟 ระบบ Tab หลัก -->
  <ul class="nav nav-pills nav-pills-custom mb-4">
    <li class="nav-item">
      <button class="nav-link active" id="tabbtn-new" onclick="switchMainTab('new')">
        <i class="fa-solid fa-user-plus me-2"></i> ลงทะเบียนคนไข้ใหม่
      </button>
    </li>
    <li class="nav-item">
      <button class="nav-link" id="tabbtn-search" onclick="switchMainTab('search')">
        <i class="fa-solid fa-magnifying-glass me-2"></i> ค้นหา & สิทธิ์การรักษา
      </button>
    </li>
  </ul>

  <div class="tab-content flex-grow-1" style="min-height: 0;">
    
    <!-- ========================================== -->
    <!-- 📍 TAB 1: ลงทะเบียนคนไข้ใหม่ -->
    <!-- ========================================== -->
    <div id="tab-new" style="display: block; height: 100%; overflow-y: auto;" class="custom-scrollbar pr-2">
      <div class="bg-white p-5 rounded-4 shadow-sm border mx-auto" style="max-width: 900px;">
        <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
          <h4 class="fw-bold m-0 text-primary"><i class="fa-solid fa-address-card me-2"></i> สร้างประวัติคนไข้ใหม่</h4>
          <button class="btn btn-outline-primary fw-bold rounded-pill px-4 shadow-sm" onclick="readSmartCard()">
            <i class="fa-solid fa-id-card me-2"></i> ดึงข้อมูลจากบัตร ปชช.
          </button>
        </div>
        
        <form id="patientForm" onsubmit="savePatient(event)">
          <div class="row g-4">
            <div class="col-md-4">
              <label class="form-label fw-bold small text-muted">รหัสคนไข้ (HN)</label>
              <input type="text" id="p_hn" class="form-control bg-light" placeholder="ระบบสร้างอัตโนมัติ" readonly>
            </div>
            <div class="col-md-8">
              <label class="form-label fw-bold small text-muted">ชื่อ - นามสกุล *</label>
              <input type="text" id="p_name" class="form-control form-control-lg border-primary text-primary fw-bold" required>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-bold small text-muted">เลขบัตรประชาชน</label>
              <input type="text" id="p_idcard" class="form-control" maxlength="13" placeholder="ตัวเลข 13 หลัก">
            </div>
            <div class="col-md-4">
              <label class="form-label fw-bold small text-muted">เบอร์โทรศัพท์ *</label>
              <input type="tel" id="p_phone" class="form-control" required maxlength="10" placeholder="ตัวเลข 10 หลัก">
            </div>
            <div class="col-md-4">
              <label class="form-label fw-bold small text-muted">วันเกิด <span id="age_display" class="text-primary ms-1"></span></label>
              <input type="date" id="p_dob" class="form-control" onchange="calculateAge()">
            </div>
            <div class="col-md-12">
              <label class="form-label fw-bold small text-muted">โรคประจำตัว (Congenital Disease)</label>
              <input type="text" id="p_disease" class="form-control" placeholder="เช่น เบาหวาน, ความดัน">
            </div>
            <div class="col-md-12">
              <label class="form-label fw-bold small text-danger">ประวัติการแพ้ยา / สารเคมี (ระบุให้ชัดเจน)</label>
              <textarea id="p_allergies" class="form-control border-danger" rows="2" placeholder="เช่น อาหารทะเล, ยาชา, Penicillin"></textarea>
            </div>
            <div class="col-12 text-end mt-4">
              <button type="button" class="btn btn-light rounded-pill px-5 me-2 fw-bold shadow-sm py-2" onclick="clearForm()">ล้างฟอร์ม</button>
              <button type="submit" class="btn btn-primary rounded-pill px-5 fw-bold shadow-sm py-2"><i class="fa-solid fa-floppy-disk me-2"></i> บันทึกข้อมูล</button>
            </div>
          </div>
        </form>
      </div>
    </div>

    <!-- ========================================== -->
    <!-- 🔍 TAB 2: ค้นหา & จัดการสิทธิ์ -->
    <!-- ========================================== -->
    <div id="tab-search" style="display: none; height: 100%; flex-direction: column;">
      
      <!-- 1. ช่องค้นหา & สรุปข้อมูล (Header) -->
      <div class="bg-white p-4 rounded-4 shadow-sm border mb-4">
        <div class="row align-items-center">
          <div class="col-md-5 border-end pe-4">
            <h6 class="fw-bold text-primary mb-3"><i class="fa-solid fa-magnifying-glass me-2"></i> ค้นหาคนไข้ในระบบ</h6>
            <div class="input-group input-group-lg shadow-sm rounded-4 overflow-hidden">
              <input type="text" id="searchInput" class="form-control border-0 bg-light" placeholder="ระบุ HN, เบอร์โทร, ชื่อ..." onkeypress="if(event.key === 'Enter') searchPatient()">
              <button class="btn btn-primary px-4 fw-bold" onclick="searchPatient()">ค้นหา</button>
            </div>
          </div>
          
          <div class="col-md-7 ps-4">
            <div id="patientInfoDisplay" style="display: none;">
              <div class="d-flex justify-content-between align-items-start mb-2">
                <div>
                  <h4 class="fw-bold text-dark m-0 mb-1" id="disp_name">-</h4>
                  <div class="text-muted"><i class="fa-solid fa-address-card me-1 text-primary"></i> <span id="disp_hn" class="fw-bold">-</span> <span class="mx-2">|</span> <i class="fa-solid fa-phone me-1"></i> <span id="disp_phone">-</span></div>
                </div>
                <button class="btn btn-outline-info rounded-pill fw-bold btn-sm shadow-sm" onclick="openGeneralServiceModal()"><i class="fa-solid fa-stethoscope me-1"></i> ตรวจทั่วไป (ไม่ใช้คอร์ส)</button>
              </div>
              
              <!-- กล่องเตือนแพ้ยา -->
              <div id="allergyAlert" class="allergy-alert align-items-center justify-content-between mt-3 shadow-sm">
                <div class="d-flex align-items-center">
                  <i class="fa-solid fa-triangle-exclamation fa-2x me-3 text-danger"></i>
                  <div>
                    <div class="fw-bold fs-6">⚠️ ข้อมูลแพ้ยา & โรคประจำตัว</div>
                    <div class="small fw-semibold" id="allergyDetails"></div>
                  </div>
                </div>
              </div>
            </div>
            
            <div id="emptyPatientState" class="text-center text-muted py-3">
              <i class="fa-solid fa-user-check fa-2x mb-2 opacity-50"></i><br>ค้นหาคนไข้เพื่อดูสิทธิ์การรักษา
            </div>
          </div>
        </div>
      </div>

      <!-- 2. พื้นที่การ์ดสิทธิ์การรักษา -->
      <div class="bg-white p-4 rounded-4 shadow-sm border flex-grow-1 custom-scrollbar" style="overflow-y: auto;">
        <h5 class="fw-bold text-secondary mb-4"><i class="fa-solid fa-box-open me-2"></i> คอร์สและโปรโมชั่นของคนไข้</h5>
        
        <div id="patientCoursesGrid" class="row g-4">
           <div class="col-12 text-center text-muted py-5">กรุณาเลือกคนไข้ก่อน...</div>
        </div>
      </div>
      
    </div>
  </div>
</div>

<!-- ========================================== -->
<!-- 🩺 Modal: Vitals & ซักประวัติก่อนส่งแพทย์ -->
<!-- ========================================== -->
<div class="modal fade" id="vitalsModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content rounded-4 border-0 shadow-lg">
      <div class="modal-header bg-info text-white rounded-top-4 py-3">
        <h5 class="modal-title fw-bold"><i class="fa-solid fa-heart-pulse me-2"></i> ซักประวัติก่อนเข้าห้องตรวจ</h5>
        <button type="button" class="btn-close btn-close-white" onclick="closeVitalsModal()"></button>
      </div>
      <div class="modal-body p-4 bg-light">
        
        <div class="bg-white p-3 rounded-3 shadow-sm border mb-4 text-center">
          <span class="text-muted small fw-bold">บริการที่เลือกล่าสุด:</span>
          <h5 class="fw-bold text-primary m-0 mt-1" id="vitals_service_name">ปรึกษาแพทย์ทั่วไป</h5>
          <input type="hidden" id="vitals_action_val">
        </div>

        <h6 class="fw-bold text-secondary mb-3">คัดกรองสัญญาณชีพ (Vitals)</h6>
        <div class="row g-3 mb-4">
          <div class="col-6">
            <label class="small text-muted mb-1 fw-bold">SYS (ความดัน)</label>
            <input id="v_sys" type="number" class="form-control rounded-3 text-center border-primary" placeholder="mmHg">
          </div>
          <div class="col-6">
            <label class="small text-muted mb-1 fw-bold">DIA (ความดัน)</label>
            <input id="v_dia" type="number" class="form-control rounded-3 text-center border-primary" placeholder="mmHg">
          </div>
          <div class="col-4">
            <label class="small text-muted mb-1 fw-bold">ชีพจร (Pulse)</label>
            <input id="v_pulse" type="number" class="form-control rounded-3 text-center" placeholder="/min">
          </div>
          <div class="col-4">
            <label class="small text-muted mb-1 fw-bold">น้ำหนัก (kg)</label>
            <input id="v_weight" type="number" class="form-control rounded-3 text-center" placeholder="kg">
          </div>
          <div class="col-4">
            <label class="small text-muted mb-1 fw-bold">ส่วนสูง (cm)</label>
            <input id="v_height" type="number" class="form-control rounded-3 text-center" placeholder="cm">
          </div>
        </div>

        <div class="mb-2">
          <label class="form-label fw-bold small text-muted">อาการเบื้องต้น / ข้อความฝากถึงแพทย์ (Note)</label>
          <textarea id="v_note" class="form-control rounded-3" rows="2" placeholder="เช่น ต้องการปรึกษาเรื่องสิว, ต้องการมาร์กยาชา..."></textarea>
        </div>

      </div>
      <div class="modal-footer bg-white border-top-0 rounded-bottom-4 p-3">
        <button type="button" class="btn btn-light rounded-pill px-4 fw-bold" onclick="closeVitalsModal()">ยกเลิก</button>
        <button type="button" class="btn btn-info rounded-pill px-4 fw-bold text-white shadow-sm" onclick="sendToDoctor()"><i class="fa-solid fa-person-walking-arrow-right me-1"></i> ส่งคิวไปห้องแพทย์</button>
      </div>
    </div>
  </div>
</div>

<script>
  var currentHN = '';
  var allInventoryList = [];
  var allBillsList = [];
  var vitalsModalInstance = null;

  document.querySelectorAll('body > #vitalsModal').forEach(m => m.remove()); // ป้องกันป๊อปอัปซ้ำ[cite: 4]

  function switchMainTab(tab) {
    document.getElementById('tabbtn-new').classList.remove('active');
    document.getElementById('tabbtn-search').classList.remove('active');
    document.getElementById('tabbtn-' + tab).classList.add('active');

    document.getElementById('tab-new').style.display = 'none';
    document.getElementById('tab-search').style.display = 'none';
    document.getElementById('tab-' + tab).style.display = 'block';
  }

  // ==========================================
  // ส่วนที่ 1: ระบบจัดการคนไข้ใหม่ (Tab 1)
  // ==========================================
  async function savePatient(e) {
    e.preventDefault();
    const payload = {
      id: document.getElementById('p_hn').value,
      full_name: document.getElementById('p_name').value, 
      id_card: document.getElementById('p_idcard').value,
      phone: document.getElementById('p_phone').value, 
      dob: document.getElementById('p_dob').value,
      congenital_disease: document.getElementById('p_disease').value, 
      allergies: document.getElementById('p_allergies').value
    };
    
    try {
      const res = await fetch('/api/patients', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) }); //[cite: 1]
      const data = await res.json();
      
      if (data.status === 'success') {
        Swal.fire({ icon: 'success', title: 'บันทึกสำเร็จ', text: 'กำลังสลับไปยังหน้าจัดการสิทธิ์...', timer: 1500, showConfirmButton: false });
        if(!payload.id) payload.id = data.patient_id; 
        
        setTimeout(() => {
          document.getElementById('searchInput').value = payload.id;
          switchMainTab('search');
          searchPatient();
        }, 1500);
      } else {
        Swal.fire({ icon: 'warning', title: 'ข้อมูลซ้ำซ้อน!', html: data.message }); //[cite: 3]
      }
    } catch(e) { Swal.fire('Error', 'ไม่สามารถเชื่อมต่อฐานข้อมูลได้', 'error'); }
  }

  function readSmartCard() {
    Swal.fire({ title: 'เชื่อมต่อเครื่องอ่านบัตร...', didOpen: () => Swal.showLoading() });
    setTimeout(() => { 
      clearForm(); 
      document.getElementById('p_name').value = 'สมชาย รักชาติ'; 
      document.getElementById('p_idcard').value = '1100200300401'; 
      document.getElementById('p_phone').value = '0891234567'; 
      document.getElementById('p_dob').value = '1985-10-25'; 
      Swal.fire({ icon: 'success', title: 'ดึงข้อมูลสำเร็จ', toast: true, position: 'top-end', timer: 2000, showConfirmButton: false }); 
    }, 1000);
  }

  function clearForm() {
    document.getElementById('patientForm').reset();
    document.getElementById('p_hn').value = '';
    document.getElementById('age_display').innerText = '';
  }

  function calculateAge() {
    const dobStr = document.getElementById('p_dob').value;
    if (!dobStr) return document.getElementById('age_display').innerText = '';
    const age = Math.abs(new Date(Date.now() - new Date(dobStr).getTime()).getUTCFullYear() - 1970);
    document.getElementById('age_display').innerText = `(อายุ ${age} ปี)`;
  }

  // ==========================================
  // ส่วนที่ 2: ค้นหา & จัดการสิทธิ์การรักษา (Tab 2)
  // ==========================================
  async function searchPatient() {
    const text = document.getElementById('searchInput').value.trim();
    if (!text) return Swal.fire('แจ้งเตือน', 'กรุณาระบุข้อมูลค้นหา', 'warning');
    Swal.showLoading();
    try {
      const res = await fetch(`/api/patients?search=${encodeURIComponent(text)}`); //[cite: 3]
      const data = await res.json();
      
      if (data.data.length === 0) {
        Swal.fire('ไม่พบข้อมูล', 'กรุณากลับไปลงทะเบียนใหม่ที่แท็บด้านซ้าย', 'info');
      } else if (data.data.length === 1) {
        loadPatientData(data.data[0]);
        Swal.close();
      } else {
        let html = '<div class="list-group text-start mt-3 custom-scrollbar" style="max-height:300px; overflow-y:auto;">';
        data.data.forEach(p => { html += `<button class="list-group-item list-group-item-action py-3" onclick="selectFromList('${p.id}')"><h6 class="mb-1 fw-bold text-primary">${p.full_name}</h6><small>${p.id} | โทร: ${p.phone}</small></button>`; });
        Swal.fire({ title: 'พบหลายรายการ', html: html+'</div>', showConfirmButton: false, showCloseButton: true });
      }
    } catch(e) {}
  }
  
  async function selectFromList(hn) {
    Swal.showLoading();
    const res = await fetch(`/api/patients/${hn}`);
    const data = await res.json();
    loadPatientData(data.data);
    Swal.close();
  }

  async function loadPatientData(p) {
    currentHN = p.id;
    document.getElementById('emptyPatientState').style.display = 'none';
    document.getElementById('patientInfoDisplay').style.display = 'block';
    
    document.getElementById('disp_name').innerText = p.full_name;
    document.getElementById('disp_hn').innerText = p.id;
    document.getElementById('disp_phone').innerText = p.phone;

    // ระบบเตือนแพ้ยา[cite: 4]
    const alertBox = document.getElementById('allergyAlert');
    if (p.allergies && p.allergies !== '-' && p.allergies !== 'ไม่มี') {
      alertBox.style.display = 'flex';
      document.getElementById('allergyDetails').innerHTML = `แพ้: ${p.allergies}<br>โรค: ${p.congenital_disease || 'ไม่มี'}`;
    } else { alertBox.style.display = 'none'; }

    // โหลดคลังสินค้า, บิล และสิทธิ์
    document.getElementById('patientCoursesGrid').innerHTML = '<div class="text-center py-5"><div class="spinner-border text-primary"></div></div>';
    
    const [invRes, courseRes, billRes] = await Promise.all([ 
      fetch('/api/inventory'), fetch(`/api/patients/${p.id}/courses`), fetch(`/api/pos/bill/${p.id}`) 
    ]); //[cite: 3]
    
    allInventoryList = (await invRes.json()).data || [];
    let patientCourses = (await courseRes.json()).data || [];
    allBillsList = (await billRes.json()).data || [];

    renderPatientCourses(patientCourses);
  }

  function renderPatientCourses(courses) {
    const grid = document.getElementById('patientCoursesGrid');
    if(courses.length === 0) {
      grid.innerHTML = `<div class="col-12 text-center text-muted py-5"><i class="fa-solid fa-folder-open fa-3x mb-3 opacity-25"></i><br>ยังไม่มีประวัติการซื้อคอร์ส หรือโปรโมชั่น</div>`;
      return;
    }

    let html = '';
    // เรียงคอร์สใหม่ขึ้นก่อน
    courses.sort((a, b) => b.id - a.id).forEach(c => {
       let prodDef = allInventoryList.find(p => p.id === c.product_id);
       let displayName = c.product_name || c.product_id;
       let isPromo = prodDef && prodDef.type === 'PROMOTION';
       
       let isUnpaid = allBillsList.some(bill => bill.product_id === c.product_id && bill.status !== 'PAID');
       let payBadge = isUnpaid ? `<span class="badge bg-danger ms-2"><i class="fa-solid fa-money-bill me-1"></i> ค้างชำระ</span>` : `<span class="badge bg-success ms-2">ชำระครบแล้ว</span>`; //[cite: 4]

       if (isPromo) {
          let state = JSON.parse(c.bundle_state || '[]');
          if (state.length === 0) return; 
          let isAllUsed = state.every(item => item.total - item.used <= 0);

          let bundleHtml = state.map(ab => {
            let remain = ab.total - ab.used;
            return `<div class="d-flex justify-content-between mb-1 small border-bottom pb-1">
                      <span class="${remain <= 0 ? 'text-muted' : 'text-dark'}"><i class="fa-solid fa-check ${remain <= 0 ? 'text-muted' : 'text-primary'} me-1"></i> ${ab.name}</span>
                      <span class="${remain <= 0 ? 'text-muted' : 'text-primary fw-bold'}">เหลือ ${remain} / ${ab.total}</span>
                    </div>`;
          }).join('');

          let valStr = `OLD_BOX_${c.id}`;
          let cardStyle = isAllUsed ? 'opacity-50 bg-light border-secondary' : 'border-primary';
          let btnHtml = isAllUsed ? '' : `<button class="btn btn-outline-primary btn-sm w-100 fw-bold mt-3 rounded-pill" onclick="openVitalsModal('${valStr}', '${displayName} (กล่อง #${c.id})')"><i class="fa-solid fa-stethoscope me-1"></i> ส่งเข้าห้องแพทย์</button>`;

          html += `<div class="col-md-6"><div class="course-card ${cardStyle} shadow-sm">
                     <div class="card-body p-4">
                       <div class="d-flex justify-content-between align-items-start mb-2">
                         <div><span class="badge ${isAllUsed ? 'bg-secondary' : 'bg-primary'} mb-2">${isAllUsed ? 'ใช้ครบแล้ว' : 'กล่องสิทธิ์ #' + c.id}</span></div>
                         ${payBadge}
                       </div>
                       <h5 class="fw-bold ${isAllUsed ? 'text-secondary' : 'text-dark'} mb-3"><i class="fa-solid fa-gift ${isAllUsed ? 'text-secondary' : 'text-primary'} me-2"></i> ${displayName}</h5>
                       <div class="bg-light p-3 rounded-3 border flex-grow-1" style="font-size: 0.9rem;">${bundleHtml}</div>
                       ${btnHtml}
                     </div></div></div>`;
       } else {
          let remain = c.total_qty - c.used_qty;
          let isUsedUp = remain <= 0;
          let valStr = `OLD_${c.id}`;
          let cardStyle = isUsedUp ? 'opacity-50 bg-light border-secondary' : 'border-success';
          let btnHtml = isUsedUp ? '' : `<button class="btn btn-outline-success btn-sm w-100 fw-bold mt-3 rounded-pill" onclick="openVitalsModal('${valStr}', '${displayName} (คอร์ส #${c.id})')"><i class="fa-solid fa-stethoscope me-1"></i> ส่งเข้าห้องแพทย์</button>`;

          html += `<div class="col-md-4"><div class="course-card ${cardStyle} shadow-sm">
                     <div class="card-body p-4 text-center">
                       <div class="d-flex justify-content-between align-items-start w-100 mb-2">
                         <span class="badge ${isUsedUp ? 'bg-secondary' : 'bg-success'}">${isUsedUp ? 'ใช้ครบแล้ว' : 'คอร์สเดี่ยว #' + c.id}</span>
                         ${payBadge}
                       </div>
                       <h5 class="fw-bold ${isUsedUp ? 'text-secondary' : 'text-dark'} mt-2 mb-3"><i class="fa-solid fa-wand-magic-sparkles ${isUsedUp ? 'text-secondary' : 'text-success'} me-2"></i> ${displayName}</h5>
                       <div class="bg-light p-2 rounded-3 border w-100 mt-auto">
                          <div class="d-flex justify-content-between small px-2">
                            <span class="${isUsedUp ? 'text-muted' : 'text-dark'}">สิทธิ์คงเหลือ</span>
                            <span class="${isUsedUp ? 'text-muted' : 'text-success fw-bold fs-6'}">${remain} / ${c.total_qty}</span>
                          </div>
                       </div>
                       ${btnHtml}
                     </div></div></div>`;
       }
    });
    grid.innerHTML = html;
  }

  // ==========================================
  // ส่วนที่ 3: ระบบ Vitals Modal และการส่งคิวแพทย์
  // ==========================================
  function openGeneralServiceModal() {
    if(!currentHN) return Swal.fire('แจ้งเตือน', 'กรุณาเลือกคนไข้ก่อน', 'warning');
    openVitalsModal('', 'ปรึกษาแพทย์ / ตรวจทั่วไป');
  }

  function openVitalsModal(actionVal, serviceName) {
    document.getElementById('vitals_action_val').value = actionVal;
    document.getElementById('vitals_service_name').innerText = serviceName;
    
    // เคลียร์ค่าเก่า
    document.getElementById('v_sys').value = '';
    document.getElementById('v_dia').value = '';
    document.getElementById('v_pulse').value = '';
    document.getElementById('v_weight').value = '';
    document.getElementById('v_height').value = '';
    document.getElementById('v_note').value = '';

    const modalEl = document.getElementById('vitalsModal');
    if (modalEl.parentNode !== document.body) document.body.appendChild(modalEl);
    
    let existingModal = bootstrap.Modal.getInstance(modalEl);
    if (!existingModal) existingModal = new bootstrap.Modal(modalEl, { backdrop: 'static' });
    
    vitalsModalInstance = existingModal;
    vitalsModalInstance.show();
  }

  function closeVitalsModal() {
    if (vitalsModalInstance) vitalsModalInstance.hide();
    setTimeout(() => {
      document.querySelectorAll('.modal-backdrop').forEach(el => el.remove());
      document.body.classList.remove('modal-open');
      document.body.style.overflow = '';
      document.body.style.paddingRight = '';
    }, 150);
  }

  async function sendToDoctor() {
    let actionVal = document.getElementById('vitals_action_val').value;
    let serviceName = document.getElementById('vitals_service_name').innerText;
    let note = document.getElementById('v_note').value.trim();

    let btn = document.querySelector('#vitalsModal .btn-info');
    let originalBtnText = btn.innerHTML;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-1"></i> กำลังส่งคิว...'; 
    btn.disabled = true;

    try {
      let finalNote = [];
      if(actionVal) finalNote.push(`[บริการ] ${serviceName}`);
      else finalNote.push(`[บริการ] ปรึกษาแพทย์/ทั่วไป`);
      if(note) finalNote.push(`[อาการ] ${note}`);

      let payload = {
        patient_id: currentHN,
        bp: (document.getElementById('v_sys').value || document.getElementById('v_dia').value) ? `${document.getElementById('v_sys').value}/${document.getElementById('v_dia').value}` : '', 
        pulse: document.getElementById('v_pulse').value, 
        weight: document.getElementById('v_weight').value, 
        height: document.getElementById('v_height').value,
        notes: finalNote.join(' | ')
      };

      // ส่งคิวไปยัง API ส่งเข้าห้องแพทย์ (ใช้โค้ดดั้งเดิมในระบบ[cite: 3])
      await fetch('/api/queue/send-doctor', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      
      closeVitalsModal();
      btn.innerHTML = originalBtnText; 
      btn.disabled = false;
      
      Swal.fire({ icon: 'success', title: 'ส่งคนไข้ไปห้องตรวจเรียบร้อย!', text: 'สามารถติดตามคิวได้ที่หน้าจอห้องแพทย์', timer: 2000, showConfirmButton: false });
      
    } catch (e) {
      btn.innerHTML = originalBtnText; btn.disabled = false;
      Swal.fire('Error', 'เกิดข้อผิดพลาดในการส่งคิว', 'error');
    }
  }
</script>
