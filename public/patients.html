<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>ประวัติคนไข้ - Clinic POS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <style>
    body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; }
    .sidebar { width: 250px; background: #1e293b; min-height: 100vh; color: white; }
    .nav-link { color: #cbd5e1; transition: 0.3s; margin-bottom: 5px; border-radius: 8px; }
    .nav-link:hover, .nav-link.active { background: #3b82f6; color: white; }
    .content-area { flex-grow: 1; padding: 30px; height: 100vh; overflow-y: auto; }
    .card { border: none; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .allergy-badge { background-color: #fee2e2; color: #ef4444; border: 1px solid #fca5a5; }
  </style>
</head>
<body class="d-flex">

  <!-- เมนูด้านข้าง (Sidebar) -->
  <div class="sidebar p-3 d-none d-md-block">
    <div class="text-center mb-4 mt-2">
      <h4 class="fw-bold text-white"><i class="fa-solid fa-hospital-user text-primary"></i> Clinic POS</h4>
    </div>
    <ul class="nav flex-column">
      <li class="nav-item"><a class="nav-link" href="/dashboard"><i class="fa-solid fa-chart-pie me-2"></i> เมนูหลัก</a></li>
      <li class="nav-item"><a class="nav-link active" href="/patients"><i class="fa-solid fa-users me-2"></i> ประวัติคนไข้</a></li>
      <li class="nav-item"><a class="nav-link" href="/queue"><i class="fa-solid fa-clipboard-list me-2"></i> ระบบคิว</a></li>
      <li class="nav-item"><a class="nav-link" href="/doctor"><i class="fa-solid fa-stethoscope me-2"></i> ห้องตรวจ</a></li>
      <li class="nav-item"><a class="nav-link" href="/pos"><i class="fa-solid fa-cash-register me-2"></i> แคชเชียร์/ห้องยา</a></li>
    </ul>
  </div>

  <!-- พื้นที่ทำงานหลัก -->
  <div class="content-area">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h3 class="fw-bold text-dark"><i class="fa-solid fa-users text-primary me-2"></i> จัดการประวัติคนไข้</h3>
      <button class="btn btn-primary fw-bold px-4 rounded-pill shadow-sm" onclick="openAddModal()">
        <i class="fa-solid fa-user-plus me-1"></i> ลงทะเบียนคนไข้ใหม่
      </button>
    </div>

    <!-- กล่องค้นหา -->
    <div class="card p-3 mb-4">
      <div class="input-group">
        <span class="input-group-text bg-white border-end-0"><i class="fa-solid fa-search text-muted"></i></span>
        <input type="text" id="searchInput" class="form-control border-start-0" placeholder="ค้นหาด้วย ชื่อ-สกุล, รหัส HN หรือ เบอร์โทรศัพท์..." onkeyup="searchPatients()">
      </div>
    </div>

    <!-- ตารางแสดงข้อมูล -->
    <div class="card p-0 overflow-hidden">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th class="ps-4">รหัส HN</th>
            <th>ชื่อ - นามสกุล</th>
            <th>เบอร์โทรศัพท์</th>
            <th>ประวัติแพ้ยา</th>
            <th>กรุ๊ปเลือด</th>
            <th class="text-center">จัดการ</th>
          </tr>
        </thead>
        <tbody id="patientTableBody">
          <!-- ข้อมูลคนไข้จะถูกดึงมาใส่ตรงนี้ด้วย JavaScript -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- Modal สำหรับลงทะเบียนคนไข้ใหม่ -->
  <div class="modal fade" id="addPatientModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content rounded-4 border-0">
        <div class="modal-header bg-light border-0 rounded-top-4">
          <h5 class="modal-title fw-bold text-primary"><i class="fa-solid fa-address-card me-2"></i> ลงทะเบียนคนไข้ใหม่</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4">
          <form id="patientForm">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label fw-bold text-muted small">รหัสคนไข้ (HN) <span class="text-danger">*</span></label>
                <div class="input-group">
                  <input type="text" class="form-control fw-bold text-primary" id="hnCode" required>
                  <button class="btn btn-outline-secondary" type="button" onclick="generateHN()" title="สร้างเลขอัตโนมัติ"><i class="fa-solid fa-rotate"></i></button>
                </div>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-bold text-muted small">เลขบัตรประจำตัวประชาชน</label>
                <input type="text" class="form-control" id="idCard" placeholder="13 หลัก (ใส่หรือไม่ใส่ก็ได้)" maxlength="13">
              </div>
              <div class="col-md-6">
                <label class="form-label fw-bold text-muted small">ชื่อ - นามสกุล <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="patientName" placeholder="เช่น นายสมชาย ใจดี" required>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-bold text-muted small">เบอร์โทรศัพท์ <span class="text-danger">*</span></label>
                <input type="tel" class="form-control" id="patientPhone" placeholder="08XXXXXXXX" required>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-bold text-muted small">กรุ๊ปเลือด</label>
                <select class="form-select" id="bloodGroup">
                  <option value="-">ไม่ระบุ</option>
                  <option value="A">A</option><option value="B">B</option>
                  <option value="O">O</option><option value="AB">AB</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-bold text-muted small">โรคประจำตัว</label>
                <input type="text" class="form-control" id="disease" placeholder="เช่น เบาหวาน, ความดัน (ถ้าไม่มีเว้นว่าง)">
              </div>
              <div class="col-12">
                <label class="form-label fw-bold text-danger small"><i class="fa-solid fa-triangle-exclamation"></i> ประวัติแพ้ยา (สำคัญ)</label>
                <textarea class="form-control allergy-badge fw-bold" id="allergies" rows="2" placeholder="ระบุชื่อยาที่แพ้ (ถ้ามี)"></textarea>
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer border-0 bg-light rounded-bottom-4">
          <button type="button" class="btn btn-secondary px-4 rounded-pill" data-bs-dismiss="modal">ยกเลิก</button>
          <button type="button" class="btn btn-primary px-4 fw-bold rounded-pill" onclick="savePatient()">บันทึกข้อมูล</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ดึงข้อมูลเมื่อเปิดหน้าเว็บ
    document.addEventListener("DOMContentLoaded", loadPatients);

    // เปิด Modal และเคลียร์ค่าเก่า
    function openAddModal() {
      document.getElementById('patientForm').reset();
      generateHN(); // สร้าง HN อัตโนมัติให้เลย
      var myModal = new bootstrap.Modal(document.getElementById('addPatientModal'));
      myModal.show();
    }

    // สร้างรหัส HN อัตโนมัติ (เช่น HN-20231015-1234)
    function generateHN() {
      const d = new Date();
      const dateStr = d.getFullYear().toString() + (d.getMonth()+1).toString().padStart(2,'0') + d.getDate().toString().padStart(2,'0');
      const randomStr = Math.floor(1000 + Math.random() * 9000);
      document.getElementById('hnCode').value = `HN-${dateStr}-${randomStr}`;
    }

    // ฟังก์ชันดึงข้อมูลคนไข้ (และค้นหา)
    function loadPatients(searchQuery = '') {
      fetch(`/api/patients?search=${searchQuery}`)
        .then(res => res.json())
        .then(data => {
          const tbody = document.getElementById('patientTableBody');
          tbody.innerHTML = '';
          
          if(data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted py-4">ไม่พบข้อมูลคนไข้</td></tr>`;
            return;
          }

          data.forEach(patient => {
            // เช็คว่ามีประวัติแพ้ยาหรือไม่ เพื่อแสดงป้ายสีแดงเตือน
            const allergyDisplay = patient.allergies && patient.allergies !== '-' 
              ? `<span class="badge bg-danger rounded-pill px-3 py-2"><i class="fa-solid fa-triangle-exclamation"></i> ${patient.allergies}</span>` 
              : `<span class="text-muted">-</span>`;

            tbody.innerHTML += `
              <tr>
                <td class="ps-4 fw-bold text-primary">${patient.hn_code}</td>
                <td class="fw-bold text-dark">${patient.name}</td>
                <td>${patient.phone}</td>
                <td>${allergyDisplay}</td>
                <td><span class="badge bg-secondary">${patient.blood_group || '-'}</span></td>
                <td class="text-center">
                  <button class="btn btn-sm btn-outline-primary rounded-circle"><i class="fa-solid fa-pen"></i></button>
                  <button class="btn btn-sm btn-success rounded-pill px-3 ms-1"><i class="fa-solid fa-stethoscope"></i> ส่งตรวจ</button>
                </td>
              </tr>
            `;
          });
        })
        .catch(err => console.error(err));
    }

    // ฟังก์ชันค้นหาเมื่อพิมพ์
    function searchPatients() {
      const query = document.getElementById('searchInput').value;
      loadPatients(query);
    }

    // ฟังก์ชันบันทึกข้อมูล
    function savePatient() {
      const payload = {
        hn_code: document.getElementById('hnCode').value.trim(),
        name: document.getElementById('patientName').value.trim(),
        phone: document.getElementById('patientPhone').value.trim(),
        id_card: document.getElementById('idCard').value.trim() || '-',
        blood_group: document.getElementById('bloodGroup').value,
        congenital_disease: document.getElementById('disease').value.trim() || '-',
        allergies: document.getElementById('allergies').value.trim() || '-'
      };

      if(!payload.hn_code || !payload.name || !payload.phone) {
        return Swal.fire('ข้อมูลไม่ครบ', 'กรุณากรอกรหัส HN, ชื่อ และเบอร์โทรศัพท์ให้ครบถ้วน', 'warning');
      }

      fetch('/api/patients', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(data => {
        if(data.status === 'success') {
          Swal.fire({ icon: 'success', title: 'ลงทะเบียนสำเร็จ', showConfirmButton: false, timer: 1500 });
          bootstrap.Modal.getInstance(document.getElementById('addPatientModal')).hide();
          loadPatients(); // รีเฟรชตาราง
        } else {
          Swal.fire('เกิดข้อผิดพลาด', data.message, 'error');
        }
      });
    }
  </script>
</body>
</html>
