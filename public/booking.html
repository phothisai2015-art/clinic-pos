<script>
  var currentHN = '';
  var canvas, ctx, isDrawing = false;
  var currentCanvasBg = null; // 🌟 เพิ่มตัวแปรจำรูปพื้นหลังเวลาล้าง Canvas
  var screeningModalInstance = null;
  var allInventoryForScreening = [];
  var allCoursesForScreening = [];
  var allBillsForScreening = [];

  // 🌟 ฟังก์ชันตัวช่วย: ป้องกันระบบพังเวลาหาช่อง HTML ไม่เจอ
  function setVal(id, val) { const el = document.getElementById(id); if (el) el.value = val; }
  function getVal(id) { const el = document.getElementById(id); return el ? el.value : ''; }
  function setHtml(id, val) { const el = document.getElementById(id); if (el) el.innerHTML = val; }
  function setText(id, val) { const el = document.getElementById(id); if (el) el.innerText = val; }

  document.querySelectorAll('body > #screeningModal').forEach(m => m.remove());

  // 🌟 บังคับให้โหลด HTML เสร็จก่อน ค่อยเริ่มดึงข้อมูล (แก้บั๊กจอขาว/ปุ่มพัง)
  document.addEventListener('DOMContentLoaded', () => {
     initPatientModule();
  });

  function initPatientModule() {
    renderEmrQueue();
    if(window.emrQueueInterval) clearInterval(window.emrQueueInterval);
    window.emrQueueInterval = setInterval(renderEmrQueue, 5000);

    let target = sessionStorage.getItem('targetHN');
    if (target) {
      setTimeout(() => {
        setVal('searchInput', target);
        searchPatient();
        sessionStorage.removeItem('targetHN');
      }, 300);
    }
  }

  async function renderEmrQueue() {
    try {
      const res = await fetch('/api/queue');
      const data = await res.json();
      const list = document.getElementById('emrQueueList');
      if(!list) return;

      const queueData = data.data || [];
      setText('emrQueueCount', `${queueData.length} คิว`);
      
      if (queueData.length === 0) {
        list.innerHTML = `<div class="text-center py-4 text-muted"><i class="fa-solid fa-bed-pulse fa-2x mb-2 opacity-50"></i><br>ไม่มีคนไข้รอตรวจ</div>`;
        return;
      }

      let html = '';
      queueData.forEach(q => {
        const isActive = (q.hn === currentHN) ? 'active' : '';
        html += `
          <div class="card pos-queue-card ${isActive} mb-2 border-0 bg-light" onclick="selectQueueFromList('${q.hn}')">
            <div class="card-body p-3 d-flex justify-content-between align-items-center">
              <div>
                <h6 class="fw-bold text-primary m-0 mb-1">${q.name}</h6>
                <small class="text-muted"><i class="fa-solid fa-address-card me-1"></i> ${q.hn}</small>
              </div>
              <div class="text-end">
                <span class="badge bg-warning text-dark"><i class="fa-solid fa-user-clock me-1"></i> รอตรวจ</span>
              </div>
            </div>
          </div>
        `;
      });
      list.innerHTML = html;
    } catch(e) {}
  }

  function selectQueueFromList(hn) {
    setVal('searchInput', hn);
    searchPatient();
  }

  function switchPatientTab(tabName) {
    if ((tabName === 'emr' || tabName === 'gallery') && !currentHN) {
      Swal.fire({ icon: 'warning', title: 'ยังไม่ได้เลือกคนไข้' });
      return;
    }
    ['reg', 'emr', 'gallery'].forEach(t => {
      const btn = document.getElementById(`btn-tab-${t}`);
      const content = document.getElementById(`${t}-content`);
      if (btn) btn.classList.remove('active');
      if (content) content.style.display = 'none';
    });
    
    const activeBtn = document.getElementById(`btn-tab-${tabName}`);
    const activeContent = document.getElementById(`${tabName}-content`);
    if (activeBtn) activeBtn.classList.add('active');
    if (activeContent) activeContent.style.display = 'block';
    
    if (tabName === 'gallery') setTimeout(initCanvas, 100);
  }

  function updateTabState() {
    const emrBtn = document.getElementById('btn-tab-emr');
    const galleryBtn = document.getElementById('btn-tab-gallery');
    if (currentHN) {
      if(emrBtn) emrBtn.classList.remove('disabled-tab');
      if(galleryBtn) galleryBtn.classList.remove('disabled-tab');
    } else {
      if(emrBtn) emrBtn.classList.add('disabled-tab');
      if(galleryBtn) galleryBtn.classList.add('disabled-tab');
    }
  }

  async function searchPatient() {
    const text = getVal('searchInput').trim();
    if (!text) return Swal.fire('แจ้งเตือน', 'กรุณาพิมพ์ข้อความ', 'warning');

    Swal.fire({ title: 'กำลังค้นหา...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
    try {
      const res = await fetch(`/api/patients?search=${text}`);
      const data = await res.json();
      
      if (!data.data || data.data.length === 0) {
        Swal.fire('ไม่พบข้อมูล', 'สามารถเพิ่มเป็นคนไข้ใหม่ได้', 'info');
      } else if (data.data.length === 1) {
        Swal.close();
        loadPatientProfile(data.data[0]);
      } else {
        let html = '<div class="list-group text-start mt-3" style="max-height:300px; overflow-y:auto;">';
        data.data.forEach(p => {
           html += `<button class="list-group-item list-group-item-action py-3" onclick="selectFromList('${p.id}')">
                      <div class="d-flex w-100 justify-content-between"><h6 class="mb-1 fw-bold text-primary">${p.full_name}</h6><small>${p.id}</small></div>
                      <small class="text-muted"><i class="fa-solid fa-phone me-1"></i>${p.phone}</small>
                    </button>`;
        });
        html += '</div>';
        Swal.fire({ title: 'พบหลายรายการ', html: html, showConfirmButton: false, showCloseButton: true });
      }
    } catch (err) { Swal.fire('Error', 'ไม่สามารถค้นหาข้อมูลได้', 'error'); }
  }

  async function selectFromList(hn) {
    Swal.showLoading();
    const res = await fetch(`/api/patients/${hn}`);
    const data = await res.json();
    loadPatientProfile(data.data);
    Swal.close();
  }

  function loadPatientProfile(p) {
    currentHN = p.id;
    setVal('p_hn', p.id);
    setVal('p_name', p.full_name || '');
    setVal('p_idcard', p.id_card || '');
    setVal('p_phone', p.phone || '');
    setVal('p_dob', p.dob || '');
    calculateAge();
    setVal('p_disease', p.congenital_disease || '');
    setVal('p_allergies', p.allergies || '');

    const alertBox = document.getElementById('allergyAlert');
    if (alertBox) {
      if (p.allergies && p.allergies.trim() !== '' && p.allergies !== '-' && p.allergies !== 'ไม่มี') {
        alertBox.style.display = 'flex';
        setText('allergyTitle', `⚠️ ข้อมูลแพ้ยา (${p.id}: ${p.full_name})`);
        setText('allergyDetails', `แพ้ยา: ${p.allergies} | โรคประจำตัว: ${p.congenital_disease || 'ไม่มี'}`);
      } else {
        alertBox.style.display = 'none';
      }
    }

    setHtml('emrCurrentPatient', `ลงประวัติให้: <span class="text-primary fw-bold">${p.full_name} (${p.id})</span>`);
    setHtml('photoCurrentPatient', `คนไข้: <span class="text-primary fw-bold">${p.full_name} (${p.id})</span>`);
    
    updateTabState();
    loadEMRHistory(p.id);
    loadPatientPhotos(p.id);

    renderEmrQueue();

    if(getVal('searchInput')) {
      switchPatientTab('emr');
    }
  }

  async function savePatient(e) {
    e.preventDefault();
    
    // 🌟 เพิ่ม Validation กันพลาด (เหมือนใน reception.html)
    const id_card_val = getVal('p_idcard').trim();
    const phone_val = getVal('p_phone').trim();

    if (id_card_val.length !== 13) return Swal.fire('ข้อมูลไม่ถูกต้อง', 'กรุณากรอกเลขบัตรประจำตัวประชาชนให้ครบ 13 หลัก', 'warning');
    if (phone_val.length !== 10) return Swal.fire('ข้อมูลไม่ถูกต้อง', 'กรุณากรอกเบอร์โทรศัพท์ให้ครบ 10 หลัก', 'warning');

    const payload = {
      id: getVal('p_hn'),
      full_name: getVal('p_name'),
      id_card: id_card_val,
      phone: phone_val,
      dob: getVal('p_dob'),
      congenital_disease: getVal('p_disease'),
      allergies: getVal('p_allergies')
    };

    try {
      const res = await fetch('/api/patients', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      const data = await res.json();
      if (data.status === 'success') {
        Swal.fire('สำเร็จ', 'บันทึกข้อมูลเรียบร้อยแล้ว', 'success');
        if(!payload.id) payload.id = data.patient_id; 
        loadPatientProfile(payload);
      } else {
        Swal.fire({ icon: 'warning', title: 'ข้อมูลซ้ำซ้อน!', html: data.message, confirmButtonColor: '#3b82f6' });
      }
    } catch (err) { Swal.fire('Error', 'ไม่สามารถเชื่อมต่อ Server ได้', 'error'); }
  }

  async function saveEMR(e) {
    e.preventDefault();
    if (!currentHN) return Swal.fire('แจ้งเตือน', 'กรุณาค้นหาคนไข้', 'warning');

    const payload = {
      patient_id: currentHN,
      doctor_id: sessionStorage.getItem('currentUserId') || 1, 
      symptoms: getVal('emr_symptoms'),
      diagnosis: getVal('emr_diagnosis'),
      treatment_details: getVal('emr_treatment'),
      next_appointment_date: getVal('emr_next_appointment_date'),
      next_appointment_time: getVal('emr_next_appointment_time'),
      next_appointment_note: getVal('emr_next_appointment_note')
    };

    try {
      const res = await fetch('/api/emr', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      const data = await res.json();
      if (data.status === 'success') {
        const emrForm = document.getElementById('emrForm');
        if (emrForm) emrForm.reset();
        setVal('emr_next_appointment_time', '10:00'); 
        
        await fetch(`/api/queue/complete/${currentHN}`, { method: 'PUT' });
        
        loadEMRHistory(currentHN);
        renderEmrQueue();

        Swal.fire({ icon: 'success', title: 'บันทึกการตรวจเรียบร้อย', toast: true, position: 'top-end', timer: 2000, showConfirmButton: false });
      }
    } catch (err) {
      Swal.fire('Error', 'เกิดข้อผิดพลาดในการบันทึก EMR', 'error');
    }
  }

  async function loadEMRHistory(hn) {
    const timeline = document.getElementById('emrTimeline');
    if(!timeline) return;
    timeline.innerHTML = '<div class="text-center py-4"><div class="spinner-border text-primary" role="status"></div></div>';
    
    try {
      const res = await fetch(`/api/emr/${hn}`);
      const data = await res.json();
      
      if (!data.data || data.data.length === 0) {
        timeline.innerHTML = '<div class="text-muted text-center py-4">ยังไม่มีประวัติการรักษา</div>';
        return;
      }

      let html = '';
      data.data.forEach((log, index) => {
         const dateObj = new Date(log.visit_date);
         const dateStr = dateObj.toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
         
         let paymentBtnHtml = '';

         if (index === 0) {
           if (log.payment_status === 'SENT' || log.payment_status === 'WAITING_PAYMENT') {
             paymentBtnHtml = `
              <div class="mt-3">
                <button class="btn btn-sm btn-success text-white fw-bold rounded-pill px-3 shadow-sm" disabled>
                  <i class="fa-solid fa-check me-1"></i> ส่งไปชำระเงินเรียบร้อยแล้ว
                </button>
              </div>`;
           } else if (log.payment_status === 'PAID') {
             paymentBtnHtml = `
              <div class="mt-3">
                <button class="btn btn-sm btn-secondary text-white fw-bold rounded-pill px-3 shadow-sm" disabled>
                  <i class="fa-solid fa-check-double me-1"></i> ชำระเงินเสร็จสิ้น
                </button>
              </div>`;
           } else {
             paymentBtnHtml = `
              <div class="mt-3">
                <button class="btn btn-sm btn-outline-success fw-bold rounded-pill px-3 shadow-sm" onclick="sendToPayment('${hn}', this)">
                  <i class="fa-solid fa-hand-holding-dollar me-1"></i> ส่งไปชำระเงิน / รับยา
                </button>
              </div>`;
           }
         }
         
         let docName = log.doctor_name ? log.doctor_name : 'ไม่ระบุผู้ตรวจ';
         let vitalsLog = (log.bp || log.pulse || log.weight || log.height) ? `<div class="small text-muted mt-2 px-2 py-1 bg-light rounded d-inline-block border"><i class="fa-solid fa-heart-pulse text-danger me-1"></i> BP: <b>${log.bp||'-'}</b> | HR: <b>${log.pulse||'-'}</b> | W: <b>${log.weight||'-'}</b> | H: <b>${log.height||'-'}</b></div>` : '';
         let formattedTx = log.treatment_details ? log.treatment_details.replace(/\n/g, '<br>') : '-';

         html += `
          <div class="border-start border-3 border-primary ps-3 pb-3 mb-4">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <span class="fw-bold text-primary"><i class="fa-solid fa-calendar-day me-1"></i> ${dateStr} น.</span>
              <span class="badge bg-light text-dark border shadow-sm"><i class="fa-solid fa-user-doctor me-1 text-primary"></i> ${docName}</span>
            </div>
            <div class="fw-bold text-dark mt-2">วินิจฉัย: ${log.diagnosis || '-'}</div>
            <div class="small text-muted mt-1"><span class="fw-bold">อาการ (CC):</span> ${log.symptoms || '-'}</div>
            <div class="small text-muted mt-1"><span class="fw-bold">หัตถการ:</span> ${log.treatment_details || '-'}</div>
            ${vitalsLog}
            ${paymentBtnHtml}
          </div>`;
      });
      timeline.innerHTML = html;
    } catch (err) {
      timeline.innerHTML = '<div class="text-danger text-center py-4">โหลดประวัติไม่สำเร็จ</div>';
    }
  }

  async function sendToPayment(hn, btnElement) {
    const originalHtml = btnElement.innerHTML;
    btnElement.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-1"></i> กำลังส่ง...';
    btnElement.disabled = true;

    try {
      const res = await fetch(`/api/pos/send/${hn}`, { method: 'PUT' });
      const data = await res.json();
      
      if (data.status === 'success') {
        btnElement.classList.remove('btn-outline-success');
        btnElement.classList.add('btn-success', 'text-white');
        btnElement.innerHTML = '<i class="fa-solid fa-check me-1"></i> ส่งไปชำระเงินเรียบร้อยแล้ว';
        Swal.fire({ icon: 'success', title: 'ส่งไปการเงินสำเร็จ', toast: true, position: 'top-end', timer: 1500, showConfirmButton: false });
      } else {
        btnElement.innerHTML = originalHtml;
        btnElement.disabled = false;
        Swal.fire('Error', data.message, 'error');
      }
    } catch (e) {
      btnElement.innerHTML = originalHtml;
      btnElement.disabled = false;
      Swal.fire('Error', 'ไม่สามารถเชื่อมต่อระบบได้', 'error');
    }
  }

  function clearForm() {
    currentHN = '';
    const pForm = document.getElementById('patientForm');
    const eForm = document.getElementById('emrForm');
    if (pForm) pForm.reset();
    if (eForm) eForm.reset();
    
    setVal('p_hn', '');
    setText('age_display', '');
    const alertBox = document.getElementById('allergyAlert');
    if (alertBox) alertBox.style.display = 'none';
    setHtml('emrCurrentPatient', 'กรุณาเลือกคนไข้...');
    setHtml('photoCurrentPatient', 'เลือกคนไข้...');
    setHtml('emrTimeline', '<div class="text-muted text-center py-4">กรุณาเลือกคนไข้...</div>');
    setHtml('patientPhotoGrid', '<div class="text-center py-4 text-muted">กรุณาเลือกคนไข้...</div>');
    
    renderEmrQueue();
    switchPatientTab('reg');
    updateTabState();
  }

  function readSmartCard() {
    Swal.fire({ title: 'เชื่อมต่อเครื่องอ่านบัตร...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
    setTimeout(() => {
      clearForm();
      setVal('p_name', 'สมชาย รักชาติ');
      setVal('p_idcard', '1100200300401');
      setVal('p_phone', '0891234567');
      setVal('p_dob', '1985-10-25');
      calculateAge();
      Swal.fire({ icon: 'success', title: 'ดึงข้อมูลจากบัตรสำเร็จ!', toast: true, position: 'top-end', timer: 2000, showConfirmButton: false });
    }, 1000);
  }

  function initCanvas() {
    canvas = document.getElementById('faceCanvas');
    if (!canvas) return;
    ctx = canvas.getContext('2d');
    clearCanvas();
    canvas.onmousedown = startDrawing;
    canvas.onmousemove = draw;
    canvas.onmouseup = stopDrawing;
    canvas.ontouchstart = (e) => { startDrawing(e.touches[0]); };
    canvas.ontouchmove = (e) => { draw(e.touches[0]); e.preventDefault(); };
    canvas.ontouchend = stopDrawing;
  }
  
  function startDrawing(e) { isDrawing = true; const rect = canvas.getBoundingClientRect(); ctx.beginPath(); ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top); }
  function draw(e) { if (!isDrawing) return; const rect = canvas.getBoundingClientRect(); ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top); ctx.strokeStyle = document.getElementById('drawColor')?.value || '#e11d48'; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.stroke(); }
  function stopDrawing() { isDrawing = false; }
  
  // 🌟 ฟังก์ชันล้างรอยมาร์ก (วาดรูปพื้นหลังทับใหม่)
  function clearCanvas() { 
    if (!ctx) return; 
    ctx.fillStyle = "#ffffff"; 
    ctx.fillRect(0, 0, canvas.width, canvas.height); 
    if (currentCanvasBg) {
      ctx.drawImage(currentCanvasBg, 0, 0, canvas.width, canvas.height);
    }
  }
  
  function previewImage(input, previewId) { 
    if (input.files && input.files[0]) { 
       const reader = new FileReader(); 
       reader.onload = function(e) { 
         const el = document.getElementById(previewId);
         if (el) el.src = e.target.result; 
       }; 
       reader.readAsDataURL(input.files[0]); 
    } 
  }
  
  // 🌟 โหลดรูปจากไฟล์ที่อัปโหลด และจำรูปไว้
  function loadCanvasBg(input) { 
    if (input.files && input.files[0]) { 
      const reader = new FileReader(); 
      reader.onload = function(e) { 
        const img = new Image(); 
        img.onload = function() { 
          currentCanvasBg = img;
          clearCanvas(); 
        }; 
        img.src = e.target.result; 
      }; 
      reader.readAsDataURL(input.files[0]); 
    } 
  }

  async function savePhotoToServer(type) {
    if (!currentHN) return Swal.fire('แจ้งเตือน', 'กรุณาเลือกคนไข้ก่อน', 'warning');
    let base64Data = '';
    
    if (type === 'BEFORE') {
      const previewEl = document.getElementById('beforeImgPreview');
      if (!previewEl) return Swal.fire('แจ้งเตือน', 'ไม่พบช่องอัปโหลดรูปภาพ', 'error');
      base64Data = previewEl.src;
      if (base64Data.includes('placeholder')) return Swal.fire('แจ้งเตือน', 'อัปโหลดรูปก่อนบันทึก', 'warning');
    } else {
      if (!canvas) return;
      base64Data = canvas.toDataURL('image/png');
    }
    
    Swal.fire({ title: 'กำลังบันทึกรูปภาพ...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
    try {
      const res = await fetch('/api/patients/photos', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ patient_id: currentHN, photo_type: type, image_data: base64Data }) });
      const data = await res.json();
      if (data.status === 'success') {
        Swal.fire({ icon: 'success', title: 'บันทึกรูปภาพเรียบร้อย', toast: true, position: 'top-end', timer: 1500, showConfirmButton: false });
        loadPatientPhotos(currentHN);
      } else { Swal.fire('Error', data.message, 'error'); }
    } catch (err) { Swal.fire('Error', 'ไม่สามารถบันทึกได้', 'error'); }
  }

  async function loadPatientPhotos(hn) {
    const grid = document.getElementById('patientPhotoGrid');
    if(!grid) return;
    grid.innerHTML = '<div class="text-center py-4"><div class="spinner-border text-primary" role="status"></div></div>';
    try {
      const res = await fetch(`/api/patients/${hn}/photos`);
      const data = await res.json();
      if (!data.data || data.data.length === 0) { grid.innerHTML = '<div class="text-center py-4 text-muted">ยังไม่มีรูปภาพ</div>'; return; }
      let html = '';
      data.data.forEach(p => {
        const dateObj = new Date(p.created_at);
        const dateStr = dateObj.toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        const typeBadge = p.photo_type === 'BEFORE' ? '<span class="badge bg-secondary me-1">BEFORE</span>' : '<span class="badge bg-primary me-1">MARKING</span>';
        html += `
          <div class="col-md-3 col-6">
            <div class="photo-card bg-light p-2 text-center">
              <button class="btn btn-sm btn-danger position-absolute top-0 end-0 m-2 rounded-circle shadow-sm" style="width:28px; height:28px; padding:0; line-height:26px; z-index:10;" onclick="deletePhoto(${p.id})"><i class="fa-solid fa-trash fa-xs"></i></button>
              <img src="${p.image_path}" class="img-fluid rounded-3 mb-2" style="height: 180px; object-fit: cover; width: 100%; cursor: pointer;" onclick="window.open('${p.image_path}', '_blank')">
              <div class="d-flex justify-content-between align-items-center px-1">${typeBadge}<small class="text-muted" style="font-size: 0.75rem;">${dateStr}</small></div>
            </div>
          </div>`;
      });
      grid.innerHTML = html;
    } catch (err) { grid.innerHTML = '<div class="text-center py-4 text-danger">ไม่สามารถโหลดคลังภาพได้</div>'; }
  }

  async function deletePhoto(photoId) {
    const result = await Swal.fire({ title: 'ยืนยันลบรูปภาพ?', icon: 'warning', showCancelButton: true, confirmButtonText: 'ลบรูปภาพ' });
    if (result.isConfirmed) {
      Swal.fire({ title: 'กำลังลบ...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
      try {
        const res = await fetch(`/api/patients/photos/${photoId}`, { method: 'DELETE' });
        const data = await res.json();
        if (data.status === 'success') { Swal.fire({ icon: 'success', title: 'ลบสำเร็จ', toast: true, position: 'top-end', timer: 1500, showConfirmButton: false }); loadPatientPhotos(currentHN); }
      } catch (err) {}
    }
  }
  
  function calculateAge() {
    const dobStr = getVal('p_dob');
    if (!dobStr) { setText('age_display', ''); return; }
    
    const dob = new Date(dobStr);
    const diffMS = Date.now() - dob.getTime();
    const ageDate = new Date(diffMS);
    const age = Math.abs(ageDate.getUTCFullYear() - 1970);
    setText('age_display', `(อายุ ${age} ปี)`);
  }

  // ==========================================
  // 🌟 ระบบคัดกรองโปรโมชั่น (Screening)
  // ==========================================
  async function openScreeningModal() {
    if (!currentHN) return Swal.fire('แจ้งเตือน', 'กรุณาค้นหาหรือบันทึกประวัติคนไข้ก่อนส่งคิวครับ', 'warning');

    Swal.fire({ title: 'กำลังโหลดข้อมูลบริการ...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
    
    try {
      const [pdRes, courseRes, billRes] = await Promise.all([ 
        fetch('/api/inventory'), 
        fetch(`/api/patients/${currentHN}/courses`),
        fetch(`/api/pos/bill/${currentHN}`)
      ]);
      
      const pdData = await pdRes.json(); 
      const courseData = await courseRes.json();
      const billData = await billRes.json();
      
      allInventoryForScreening = pdData.status === 'success' ? pdData.data : [];
      allCoursesForScreening = courseData.status === 'success' ? courseData.data : [];
      allBillsForScreening = billData.status === 'success' ? billData.data : [];
      
      resetSelection();
      renderPromoCards();
      renderGeneralCards();
      renderActiveCourses(); 
      
      const modalEl = document.getElementById('screeningModal');
      if (!modalEl) return Swal.fire('Error', 'ไม่พบป๊อปอัป Screening', 'error');
      
      if (modalEl.parentNode !== document.body) { document.body.appendChild(modalEl); }
      let existingModal = bootstrap.Modal.getInstance(modalEl);
      if (!existingModal) existingModal = new bootstrap.Modal(modalEl, { backdrop: 'static' });
      screeningModalInstance = existingModal;
      
      Swal.close();
      setTimeout(() => {
        screeningModalInstance.show();
        switchServiceTab('promo');
      }, 200);

    } catch (e) { Swal.fire('Error', 'ไม่สามารถโหลดข้อมูลป๊อปอัปได้', 'error'); }
  }

  function switchServiceTab(tabName) {
    document.querySelectorAll('.nav-pills-custom .nav-link').forEach(el => el.classList.remove('active'));
    const activeBtn = document.getElementById(`tabbtn-${tabName}`);
    if (activeBtn) activeBtn.classList.add('active');
    
    ['promo', 'general', 'active'].forEach(t => {
       const el = document.getElementById(`tab-${t}`);
       if (el) el.style.display = 'none';
    });
    const displayEl = document.getElementById(`tab-${tabName}`);
    if (displayEl) displayEl.style.display = 'flex';
  }

  function renderPromoCards() {
    const container = document.getElementById('tab-promo');
    if(!container) return;
    let promos = allInventoryForScreening.filter(p => p.type === 'PROMOTION');
    
    if(promos.length === 0) return container.innerHTML = `<div class="col-12 text-center text-muted py-5">ไม่มีข้อมูลโปรโมชั่นในระบบ</div>`;

    let html = '';
    promos.forEach(p => {
      let bundleHtml = '';
      try {
        let bundles = JSON.parse(p.bundle_items || '[]');
        if (bundles.length > 0) {
          bundleHtml = bundles.map(b => `<div class="mb-1"><i class="fa-solid fa-check text-success me-1"></i> ${b.name} <span class="badge bg-secondary ms-1">x${b.qty}</span></div>`).join('');
        } else { bundleHtml = '<div class="text-muted small">- ไม่มีรายการของแถมย่อย</div>'; }
      } catch (e) { bundleHtml = ''; }

      let valStr = `NEW_${p.id}`;
      html += `
        <div class="col-md-6">
          <div class="card h-100 service-card" id="card_${valStr}" onclick="selectService('${valStr}', '${p.name}')">
            <div class="card-body p-3">
               <h6 class="fw-bold card-title text-dark mb-2"><i class="fa-solid fa-gift text-primary me-1"></i> ${p.name}</h6>
               <div class="bg-light p-2 rounded border" style="font-size: 0.8rem;">
                 <div class="fw-bold text-muted border-bottom pb-1 mb-2">สิ่งที่จะได้รับ:</div>
                 ${bundleHtml}
               </div>
            </div>
          </div>
        </div>`;
    });
    container.innerHTML = html;
  }

  function renderGeneralCards() {
    const container = document.getElementById('tab-general');
    if(!container) return;
    let generals = allInventoryForScreening.filter(p => p.type === 'COURSE' || p.type === 'INJECTABLE');
    
    if(generals.length === 0) return container.innerHTML = `<div class="col-12 text-center text-muted py-5">ไม่มีข้อมูลสินค้าทั่วไปที่ให้บริการได้</div>`;

    let html = '';
    generals.forEach(p => {
      let valStr = `NEW_${p.id}`;
      let badgeType = p.type === 'INJECTABLE' ? 'bg-danger' : 'bg-info text-dark';
      html += `
        <div class="col-md-4">
          <div class="card h-100 service-card" id="card_${valStr}" onclick="selectService('${valStr}', '${p.name}')">
            <div class="card-body p-3 text-center">
               <span class="badge ${badgeType} mb-2">${p.type}</span>
               <h6 class="fw-bold card-title text-dark m-0">${p.name}</h6>
            </div>
          </div>
        </div>`;
    });
    container.innerHTML = html;
  }

  function renderActiveCourses() {
    const container = document.getElementById('tab-active');
    if(!container) return;
    if(allCoursesForScreening.length === 0) return container.innerHTML = `<div class="col-12 text-center text-muted py-5"><i class="fa-solid fa-face-frown fa-2x mb-2 opacity-50"></i><br>คนไข้รายนี้ไม่มีประวัติคอร์สในระบบ</div>`;

    let html = '';
    let sortedCourses = [...allCoursesForScreening].sort((a, b) => b.id - a.id);
    
    sortedCourses.forEach(c => {
       let prodDef = allInventoryForScreening.find(p => p.id === c.product_id);
       let displayName = c.product_name || c.product_id;
       let isPromo = prodDef && prodDef.type === 'PROMOTION';
       
       let isUnpaid = allBillsForScreening.some(bill => bill.product_id === c.product_id && bill.status !== 'PAID');
       let payBadge = isUnpaid ? `<span class="badge bg-danger ms-2">ค้างชำระ</span>` : `<span class="badge bg-success ms-2">ชำระครบแล้ว</span>`;

       if (isPromo) {
          let state = JSON.parse(c.bundle_state || '[]');
          if (state.length === 0) return; 
          let isAllUsed = state.every(item => item.total - item.used <= 0);

          let bundleHtml = state.map(ab => {
            let remain = ab.total - ab.used;
            return `<div class="d-flex justify-content-between mb-1 small border-bottom pb-1">
                      <span class="${remain <= 0 ? 'text-muted' : 'text-dark'}"><i class="fa-solid fa-check ${remain <= 0 ? 'text-muted' : 'text-primary'} me-1"></i> ${ab.name}</span>
                      <span class="${remain <= 0 ? 'text-muted' : 'text-primary fw-bold'}">เหลือ ${remain} / ${ab.total}</span>
                    </div>`;
          }).join('');

          let valStr = `OLD_BOX_${c.id}`;
          let onclick = isAllUsed ? '' : `onclick="selectService('${valStr}', '${displayName}')"`;
          let cardStyle = isAllUsed ? 'opacity-50 bg-light border-secondary' : 'border-primary';

          html += `<div class="col-md-6"><div class="card h-100 service-card ${cardStyle}" id="card_${valStr}" ${onclick} style="${isAllUsed ? 'cursor:not-allowed;' : ''}">
                     <div class="card-body p-3">
                       <div class="d-flex justify-content-between align-items-start">
                         <div><span class="badge ${isAllUsed ? 'bg-secondary' : 'bg-primary'} mb-1">${isAllUsed ? 'ใช้ครบแล้ว' : 'กล่องสิทธิ์ #' + c.id}</span></div>
                         ${payBadge}
                       </div>
                       <h6 class="fw-bold ${isAllUsed ? 'text-secondary' : 'text-dark'} m-0 mt-1 mb-2"><i class="fa-solid fa-gift ${isAllUsed ? 'text-secondary' : 'text-primary'} me-1"></i> ${displayName}</h6>
                       <div class="bg-white p-2 rounded border" style="font-size: 0.85rem;">${bundleHtml}</div>
                     </div></div></div>`;
       } else {
          let remain = c.total_qty - c.used_qty;
          let isUsedUp = remain <= 0;
          let valStr = `OLD_${c.id}`;
          let onclick = isUsedUp ? '' : `onclick="selectService('${valStr}', '${displayName}')"`;
          let cardStyle = isUsedUp ? 'opacity-50 bg-light border-secondary' : 'border-success';

          html += `<div class="col-md-4"><div class="card h-100 service-card ${cardStyle}" id="card_${valStr}" ${onclick} style="${isUsedUp ? 'cursor:not-allowed;' : ''}">
                     <div class="card-body p-3">
                       <div class="d-flex justify-content-between align-items-start">
                         <div><span class="badge ${isUsedUp ? 'bg-secondary' : 'bg-success'} mb-1">${isUsedUp ? 'ใช้ครบแล้ว' : 'คอร์สเดี่ยว #' + c.id}</span></div>
                         ${payBadge}
                       </div>
                       <h6 class="fw-bold ${isUsedUp ? 'text-secondary' : 'text-dark'} m-0 mt-1 mb-2"><i class="fa-solid fa-wand-magic-sparkles ${isUsedUp ? 'text-secondary' : 'text-success'} me-1"></i> ${displayName}</h6>
                       <div class="bg-white p-2 rounded border" style="font-size: 0.85rem;">
                          <div class="d-flex justify-content-between small">
                            <span class="${isUsedUp ? 'text-muted' : 'text-dark'}"><i class="fa-solid fa-check ${isUsedUp ? 'text-muted' : 'text-success'} me-1"></i> ${displayName}</span>
                            <span class="${isUsedUp ? 'text-muted' : 'text-success fw-bold'}">เหลือ ${remain} / ${c.total_qty}</span>
                          </div>
                       </div>
                     </div></div></div>`;
       }
    });
    container.innerHTML = html;
  }

  function selectService(actionVal, actionName) {
    let currentVal = getVal('selected_action_val');
    if (currentVal === actionVal) {
      resetSelection();
    } else {
      document.querySelectorAll('.service-card').forEach(el => el.classList.remove('selected'));
      let cardEl = document.getElementById(`card_${actionVal}`);
      if(cardEl) cardEl.classList.add('selected');
      setVal('selected_action_val', actionVal);
      setText('selected_service_display', actionName);
      const displayEl = document.getElementById('selected_service_display');
      if (displayEl) displayEl.className = "text-primary fw-bold fs-5 mb-2 px-3 py-2 bg-primary bg-opacity-10 rounded-3 border border-primary text-center";
    }
  }

  function resetSelection() {
    document.querySelectorAll('.service-card').forEach(el => el.classList.remove('selected'));
    setVal('selected_action_val', '');
    setText('selected_service_display', "ปรึกษาแพทย์ / ตรวจทั่วไป");
    const displayEl = document.getElementById('selected_service_display');
    if (displayEl) displayEl.className = "text-danger fw-bold fs-5 mb-2 px-3 py-2 bg-danger bg-opacity-10 rounded-3 border border-danger text-center";
  }
  
  function closeScreeningModal() {
    if (screeningModalInstance) screeningModalInstance.hide();
    setTimeout(() => {
      document.querySelectorAll('.modal-backdrop').forEach(el => el.remove());
      document.body.classList.remove('modal-open');
      document.body.style.overflow = '';
      document.body.style.paddingRight = '';
    }, 150);
  }

  async function submitScreening() {
    let actionVal = getVal('selected_action_val');
    let selectedText = document.getElementById('selected_service_display')?.innerText || '';
    let note = getVal('scr_note').trim();

    let btn = document.querySelector('#screeningModal .btn-info');
    let originalBtnText = btn ? btn.innerHTML : '';
    if(btn) { btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-1"></i> กำลังส่งคิว...'; btn.disabled = true; }

    let serviceName = selectedText;

    try {
      if(actionVal && actionVal.startsWith('NEW_')) {
         let productId = actionVal.replace('NEW_', '');
         let resp = await fetch(`/api/patients/${currentHN}/assign-promo`, { 
           method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ product_id: productId }) 
         });
         let data = await resp.json();
         if(data.course_id) serviceName = `${selectedText} (กล่อง #${data.course_id})`;
      } else if (actionVal && actionVal.startsWith('OLD_BOX_')) {
         let boxId = actionVal.replace('OLD_BOX_', '');
         serviceName = `${selectedText} (กล่อง #${boxId})`;
      } else if (actionVal && actionVal.startsWith('OLD_')) {
         let cId = actionVal.replace('OLD_', '');
         serviceName = `${selectedText} (คอร์ส #${cId})`;
      }

      let finalNote = [];
      if(actionVal) finalNote.push(`[บริการ] ${serviceName}`);
      else finalNote.push(`[บริการ] ปรึกษาแพทย์/ทั่วไป`);
      if(note) finalNote.push(`[อาการ] ${note}`);

      const sys = getVal('scr_sys');
      const dia = getVal('scr_dia');
      let bpVal = (sys || dia) ? `${sys}/${dia}` : '';

      let payload = {
        patient_id: currentHN,
        bp: bpVal, 
        pulse: getVal('scr_pulse'), 
        weight: getVal('scr_weight'), 
        height: getVal('scr_height'),
        notes: finalNote.join(' | ')
      };

      await fetch('/api/queue/send-doctor', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      
      closeScreeningModal();
      clearForm();
      if(btn) { btn.innerHTML = originalBtnText; btn.disabled = false; }
      
      setVal('scr_sys', ''); setVal('scr_dia', ''); setVal('scr_pulse', ''); setVal('scr_weight', ''); setVal('scr_height', ''); setVal('scr_note', '');
      
      setTimeout(() => {
        Swal.fire({ icon: 'success', title: 'ส่งคนไข้ไปห้องตรวจเรียบร้อย!', toast: true, position: 'top-end', timer: 2000, showConfirmButton: false });
      }, 300);

    } catch (e) {
      if(btn) { btn.innerHTML = originalBtnText; btn.disabled = false; }
      Swal.fire('Error', 'เกิดข้อผิดพลาดในการส่งคิว', 'error');
    }
  }
</script>
