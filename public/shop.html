<script>
// ==========================================
// 🔗 ระบบเชื่อมต่อ API หลัก (จากโค้ดเดิมของคุณ)
// ==========================================
(function() {
  function callServerApi(prop, args, successCb, failureCb) {
    let url = ''; let options = { method: 'GET', headers: { 'Content-Type': 'application/json', 'Cache-Control': 'no-cache' }, cache: 'no-store' };
    switch(prop) {
      case 'getAppInfo': url = '/api/app-info'; break;
      case 'getShopSettings': url = '/api/settings/' + args[0]; break;
      case 'updateShopSettings': url = '/api/settings/update'; options.method = 'POST'; options.body = JSON.stringify({ tenantId: args[0], newSettings: args[1] }); break;
      case 'getUsers': url = '/api/users/' + args[0]; break;
      case 'saveUser': url = '/api/users/save'; options.method = 'POST'; options.body = JSON.stringify({ tenantId: args[0], user: args[1] }); break;
      case 'deleteUser': url = '/api/users/delete'; options.method = 'POST'; options.body = JSON.stringify({ tenantId: args[0], pin: args[1] }); break;
      case 'getProducts': url = '/api/products/' + args[0] + '?t=' + Date.now(); break;
      case 'addProduct': url = '/api/products/add'; options.method = 'POST'; options.body = JSON.stringify({ tenantId: args[0], product: args[1] }); break;
      case 'updateProduct': url = '/api/products/update'; options.method = 'POST'; options.body = JSON.stringify({ tenantId: args[0], product: args[1] }); break;
      case 'deleteProduct': url = '/api/products/delete'; options.method = 'POST'; options.body = JSON.stringify({ tenantId: args[0], id: args[1] }); break;
      case 'uploadImageToDrive': url = '/api/upload-image'; options.method = 'POST'; options.body = JSON.stringify({ tenantId: args[0], base64Data: args[1], fileName: args[2] }); break;
      case 'saveOrder': url = '/api/save-order'; options.method = 'POST'; options.body = JSON.stringify({ tenantId: args[0], payload: args[1] }); break;
      case 'voidOrder': url = '/api/void-order'; options.method = 'POST'; options.body = JSON.stringify({ tenantId: args[0], receiptId: args[1] }); break;
      case 'voidPartialItem': url = '/api/void-partial-item'; options.method = 'POST'; options.body = JSON.stringify({ tenantId: args[0], receiptId: args[1], itemIndex: args[2], returnQty: args[3] }); break;
      case 'getDashboardData': url = '/api/dashboard/' + args[0] + '?t=' + Date.now(); break;
      case 'updateBulkStock': url = '/api/update-bulk-stock'; options.method = 'POST'; options.body = JSON.stringify({ tenantId: args[0], payload: args[1] }); break;
      case 'deleteTestBills': url = '/api/delete-test-bills'; options.method = 'POST'; options.body = JSON.stringify({ tenantId: args[0], receiptIdsArray: args[1] }); break;
      case 'logAction': url = '/api/log-action'; options.method = 'POST'; options.body = JSON.stringify({ tenantId: args[0], staffName: args[1], action: args[2], detail: args[3] }); break;
      case 'getActivityLogs': url = '/api/activity-logs/' + args[0]; break;
      case 'getTenantInfoBySheetId': url = '/api/tenant-info/' + args[0]; break;
      case 'uploadQuickRenewSlip': url = '/api/upload-quick-renew-slip'; options.method = 'POST'; options.body = JSON.stringify({ email: args[0], shopName: args[1], pkgName: args[2], price: args[3], base64Data: args[4] }); break;
	  case 'getPackagePrices': url = '/api/package-prices'; break;
      case 'importExcelData': url = '/api/import-excel'; options.method = 'POST'; options.body = JSON.stringify({ tenantId: args[0], payload: args[1] }); break;
      case 'clearRenewNotify': url = '/api/clear-renew-notify'; options.method = 'POST'; options.body = JSON.stringify({ sheetId: args[0] }); break;
      default: if (successCb) successCb({ status: 'success' }); return;
    }
    fetch(url, options).then(res => res.json()).then(data => { if (successCb) successCb(data); }).catch(err => { if (failureCb) failureCb(err); });
  }
  function createGasRunner() {
    let _success = null; let _failure = null;
    const handler = {
      get(target, prop) {
        if (prop === 'withSuccessHandler') return function(cb) { _success = cb; return new Proxy({}, handler); };
        if (prop === 'withFailureHandler') return function(cb) { _failure = cb; return new Proxy({}, handler); };
        return function(...args) { callServerApi(prop, args, _success, _failure); };
      }
    }; return new Proxy({}, handler);
  }
  window.google = { script: { get run() { return createGasRunner(); } } };
})();
</script>

</style>
</head>
<body>

<button id="main-theme-btn" class="theme-toggle-btn" onclick="toggleThemeMode()" title="สลับโหมดมืด/สว่าง">
  <i id="theme-icon" class="fa-solid fa-moon"></i>
</button>

<!-- 🌟 กล่องสำหรับโหลด 6 ไฟล์ .html ย่อย -->
<div id="app-container"></div>

<script>
// ==========================================
// 🚀 ระบบโหลดหน้าเว็บย่อย (Modular Loader) 
// ==========================================
// 🚀 ระบบโหลดหน้าเว็บย่อย (Modular Loader) แบบโหลดพร้อมกัน
async function loadShopComponents() {
  const components = [
    '/shop/menu',
	'/shop/booking',
    '/shop/pos',
    '/shop/receipt',
    '/shop/products',
    '/shop/dashboard',
    '/shop/settings'
  ];

  const container = document.getElementById('app-container');

  try {
    // 🌟 เปลี่ยนมาใช้ Promise.all เพื่อยิง Request โหลดไฟล์ทั้ง 6 ตัวพร้อมกัน
    const fetchPromises = components.map(url => fetch(url).then(res => res.text()));
    const htmlResults = await Promise.all(fetchPromises);

    // นำ HTML ที่โหลดเสร็จแล้วทั้งหมดมาต่อกัน และนำไปใส่ใน container
    container.innerHTML = htmlResults.join('');
    
  } catch (error) {
    console.error("Error loading components:", error);
  }

  // 🌟 [สำคัญมาก] สั่งให้ Javascript ที่อยู่ใน HTML ที่ดึงมา ทำงานได้จริง
  executeScripts(container);

  // เริ่มการทำงานระบบหลังจากโหลดเสร็จ
  setTimeout(() => {
    if (typeof initShopMenuScripts === 'function') {
      initShopMenuScripts();
    }
  }, 300);
}

// ฟังก์ชันแปลงสคริปต์ที่ถูกแทรกผ่าน innerHTML ให้บราวเซอร์รัน
function executeScripts(container) {
  const scripts = container.querySelectorAll("script");
  scripts.forEach(oldScript => {
    const newScript = document.createElement("script");
    // คัดลอก Attributes ทั้งหมด
    Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
    // ใส่เนื้อหาโค้ดด้านใน
    newScript.appendChild(document.createTextNode(oldScript.innerHTML));
    // แทนที่สคริปต์เก่าด้วยสคริปต์ใหม่ที่ถูกสร้างขึ้น (ทำให้บราวเซอร์รันโค้ด)
    oldScript.parentNode.replaceChild(newScript, oldScript);
  });
}

// สั่งทำงานทันทีเมื่อเปิดหน้า
// สั่งทำงานทันทีเมื่อเปิดหน้า
document.addEventListener("DOMContentLoaded", () => {
  // 🌟 เด้งหน้าโหลดทันทีเสี้ยววินาทีแรกที่เข้าเว็บ ป้องกันจอขาว!
  Swal.fire({
    title: 'กำลังเตรียมระบบ...',
    html: 'ดาวน์โหลดโครงสร้างหน้าจอ... <b id="sys-load-percent" class="text-primary fs-3">0%</b>',
    allowOutsideClick: false,
    showConfirmButton: false,
    didOpen: () => {
      Swal.showLoading();
      let p = 0;
      window.sysLoadInterval = setInterval(() => {
        p += Math.floor(Math.random() * 5) + 2;
        if (p > 90) p = 90; // ค้างที่ 90 รอข้อมูลจากเซิร์ฟเวอร์
        let el = document.getElementById('sys-load-percent');
        if (el) el.innerText = p + '%';
      }, 30);
    }
  });
  
  // โหลดหน้าจอต่างๆ ตามหลัง (คนจะไม่เห็นจอขาวแล้ว)
  loadShopComponents();
});
</script>

</body>
</html>
