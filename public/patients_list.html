<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ฐานข้อมูลคนไข้ทั้งหมด</title>

  <!-- Libraries พื้นฐานที่จำเป็นต้องมี เพื่อให้หน้าเว็บไม่พัง -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- โค้ดดักจับ Token ไว้สื่อสารกับ API -->
  <script>
    const originalFetch = window.fetch;
    window.fetch = async function() {
        let [resource, config] = arguments;
        if (!config) { config = {}; }
        if (!config.headers) { config.headers = {}; }
        const userId = sessionStorage.getItem('currentUserId');
        if (userId) { config.headers['X-User-Id'] = userId; }
        return originalFetch(resource, config);
    };
  </script>

  <style>
  /* 🌟 บังคับฟอนต์ให้ทันสมัย (Sarabun) ทุกจุด */
  * { font-family: 'Sarabun', sans-serif; }

  .patient-table th { font-weight: bold; color: #64748b; font-size: 0.85rem; border-bottom: 2px solid #e2e8f0; padding: 12px; }
  .patient-table td { padding: 12px; vertical-align: middle; border-bottom: 1px dashed #e2e8f0; }
  .custom-scrollbar::-webkit-scrollbar { width: 6px; } 
  .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 10px; } 
  .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

  /* 🌙 โหมดกลางคืน (Dark Mode Sync) */
  body.dark-theme .bg-white { background-color: #1e293b !important; border-color: #334155 !important; }
  body.dark-theme .bg-light { background-color: #0f172a !important; border-color: #334155 !important; }
  body.dark-theme .text-dark { color: #f8fafc !important; }
  body.dark-theme .text-muted { color: #94a3b8 !important; }
  body.dark-theme .border { border-color: #334155 !important; }
  body.dark-theme .border-bottom { border-bottom-color: #334155 !important; }
  body.dark-theme .border-end { border-right-color: #334155 !important; }
  
  body.dark-theme .patient-table th { background-color: #0f172a !important; color: #cbd5e1 !important; border-bottom-color: #334155 !important; }
  body.dark-theme .patient-table td { border-bottom-color: #334155 !important; color: #f8fafc !important; }
  body.dark-theme .patient-table tbody tr:hover td { background-color: #334155 !important; }
  
  body.dark-theme .form-control, body.dark-theme .form-select { background-color: #0f172a !important; color: #f8fafc !important; border-color: #334155 !important; }
  body.dark-theme .form-control::placeholder { color: #64748b !important; }
  body.dark-theme .form-control:focus, body.dark-theme .form-select:focus { border-color: #3b82f6 !important; box-shadow: 0 0 0 0.25rem rgba(59, 130, 246, 0.25) !important; }
  body.dark-theme .form-control[readonly] { background-color: #1e293b !important; color: #94a3b8 !important; opacity: 0.8; }
  
  body.dark-theme .modal-content { background-color: #1e293b !important; color: #f8fafc !important; }
  body.dark-theme .modal-header, body.dark-theme .modal-footer { border-color: #334155 !important; }
  body.dark-theme .timeline { background-color: #1e293b !important; border-color: #334155 !important; }
  
  /* 🌙 SweetAlert2 โหมดกลางคืน (Dark Mode Sync) */
  body.dark-theme .swal2-popup { background-color: #1e293b !important; color: #f8fafc !important; border: 1px solid #334155 !important; box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5) !important; }
  body.dark-theme .swal2-title, body.dark-theme .swal2-html-container { color: #f8fafc !important; }
  body.dark-theme .swal2-close { color: #94a3b8 !important; }
  body.dark-theme .swal2-close:hover { color: #ef4444 !important; }
  body.dark-theme .swal2-icon.swal2-warning { border-color: #f59e0b !important; color: #f59e0b !important; }
  body.dark-theme .swal2-icon.swal2-info { border-color: #3b82f6 !important; color: #3b82f6 !important; }
  body.dark-theme .swal2-icon.swal2-error { border-color: #ef4444 !important; color: #ef4444 !important; }
  body.dark-theme .swal2-icon.swal2-success { border-color: #10b981 !important; color: #10b981 !important; }

  /* 🌟 แสงออร่าด้านหลัง (Ambient Orbs) */
  .ambient-orb { position: fixed; border-radius: 50%; filter: blur(80px); z-index: -1; opacity: 0.5; animation: floatOrb 20s infinite alternate ease-in-out; pointer-events: none; }
  .orb-1 { width: 400px; height: 400px; background: #bae6fd; top: -100px; left: -100px; }
  .orb-2 { width: 450px; height: 450px; background: #ddd6fe; bottom: -100px; right: -50px; animation-delay: -5s; }
  .orb-3 { width: 300px; height: 300px; background: #fbcfe8; top: 30%; left: 30%; animation-delay: -10s; opacity: 0.3; }
  
  body.dark-theme .orb-1 { background: #1e3a8a; opacity: 0.3; }
  body.dark-theme .orb-2 { background: #312e81; opacity: 0.4; }
  body.dark-theme .orb-3 { background: #4c1d95; opacity: 0.3; }
  
  @keyframes floatOrb { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(30px, 50px) scale(1.1); } }

  /* ปรับพื้นหลังกล่องให้เป็นกระจกฝ้าเพื่อให้เห็นแสงออร่า */
  .bg-white, .timeline {
      background-color: rgba(255, 255, 255, 0.85) !important;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
  }
  body.dark-theme .bg-white, 
  body.dark-theme .timeline {
      background-color: rgba(30, 41, 59, 0.85) !important;
  }
  </style>
</head>
<body class="bg-light">

<!-- 🌟 Ambient Orbs Background -->
<div class="ambient-orb orb-1"></div>
<div class="ambient-orb orb-2"></div>
<div class="ambient-orb orb-3"></div>

<div class="container-fluid py-4 px-lg-5" style="max-width: 1800px; height: 100vh; display: flex; flex-direction: column;">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="fw-bold text-dark m-0"><i class="fa-solid fa-users me-2"></i> ฐานข้อมูลคนไข้ทั้งหมด</h3>
    <button class="btn btn-outline-danger fw-bold rounded-pill px-4" onclick="window.location.href='/'"><i class="fa-solid fa-xmark me-2"></i> ปิดหน้านี้</button>
  </div>

  <div class="bg-white p-4 rounded-4 shadow-sm border flex-grow-1 d-flex flex-column" style="min-height: 0;">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="fw-bold m-0 text-primary"><i class="fa-solid fa-address-book me-2"></i> รายชื่อคนไข้ในระบบ</h5>
      <div class="input-group" style="width: 300px;">
        <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
        <input type="text" id="searchPatientList" class="form-control border-start-0 bg-light" placeholder="ค้นหา ชื่อ, เบอร์โทร, HN..." onkeyup="filterPatientList()">
      </div>
    </div>

    <div class="custom-scrollbar" style="overflow-y: auto; flex-grow: 1; padding-right: 5px;">
      <table class="table patient-table w-100 mb-0">
        <thead style="position: sticky; top: 0; background: white; z-index: 1;">
          <tr>
            <th width="10%">รหัสคนไข้ (HN)</th>
            <th width="15%">เลขบัตร ปชช.</th>
            <th width="20%">ชื่อ - นามสกุล</th>
            <th width="10%">เบอร์โทรศัพท์</th>
            <th width="10%">อายุ (วันเกิด)</th>
            <th width="15%">โรคประจำตัว / แพ้ยา</th>
            <th width="20%" class="text-center">จัดการข้อมูล</th>
          </tr>
        </thead>
        <tbody id="patientListBody">
          <tr><td colspan="5" class="text-center py-5 text-muted">กำลังโหลดข้อมูลคนไข้...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- 🌟 Modal ดูประวัติการรักษาแบบมีตัวกรอง -->
<div class="modal fade" id="historyModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-xl">
    <div class="modal-content rounded-4 border-0 shadow-lg">
      <div class="modal-header bg-primary text-white rounded-top-4 py-3">
        <h5 class="modal-title fw-bold m-0"><i class="fa-solid fa-clock-rotate-left me-2"></i> ประวัติการรักษา: <span id="historyModalName"></span></h5>
        <button type="button" class="btn-close btn-close-white" onclick="closeHistoryModal()"></button>
      </div>
      <div class="modal-body p-4 bg-light bg-opacity-50">
        
        <!-- ตัวกรองโปรโมชั่น -->
        <div class="mb-4 bg-white p-3 rounded-3 shadow-sm border border-primary">
          <label class="fw-bold text-primary small mb-2"><i class="fa-solid fa-filter me-1"></i> ตัวกรองโปรโมชั่น / คอร์ส</label>
          <select id="historyFilter" class="form-select border-primary bg-light fw-bold text-dark" onchange="renderHistoryTimeline()">
            <option value="ALL">-- ดูประวัติการรักษาทั้งหมด --</option>
          </select>
        </div>

        <div class="timeline custom-scrollbar bg-white p-4 border rounded-4 shadow-sm" id="historyTimeline" style="height: 65vh; min-height: 550px; overflow-y: auto;">
          <div class="text-center py-4 text-muted">กำลังโหลดข้อมูล...</div>
        </div>
        
      </div>
    </div>
  </div>
</div>

<script>
  var allPatients = [];
  var currentHistoryData = [];
  
  document.querySelectorAll('body > #historyModal').forEach(m => m.remove());

  function initPatientList() {
    loadAllPatients();
  }
  initPatientList();

  async function loadAllPatients() {
    try {
      const res = await fetch('/api/patients');
      const data = await res.json();
      if(data.status === 'success') {
        allPatients = data.data;
        // เรียงจากสมัครล่าสุดขึ้นก่อน
        allPatients.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
        renderPatientTable(allPatients);
      }
    } catch (e) { console.error(e); }
  }

  function renderPatientTable(items) {
    const tbody = document.getElementById('patientListBody');
    tbody.innerHTML = '';
    
    if(items.length === 0) {
      tbody.innerHTML = `<tr><td colspan="7" class="text-center py-5 text-muted">ไม่พบข้อมูลคนไข้</td></tr>`;
      return;
    }

    items.forEach(p => {
      // 1. จัดการข้อมูลแพ้ยาและโรคประจำตัวให้โชว์เป็น Badge สีสันสวยงาม
      let allergyBadge = (p.allergies && p.allergies !== '-' && p.allergies !== 'ไม่มี') 
        ? `<div class="badge bg-danger text-white mb-1"><i class="fa-solid fa-triangle-exclamation"></i> แพ้: ${p.allergies}</div>` 
        : '';
      let diseaseBadge = (p.congenital_disease && p.congenital_disease !== '-' && p.congenital_disease !== 'ไม่มี')
        ? `<div class="badge bg-warning text-dark"><i class="fa-solid fa-virus"></i> โรค: ${p.congenital_disease}</div>`
        : '';
      
      let healthInfo = (allergyBadge || diseaseBadge) ? `${allergyBadge}<br>${diseaseBadge}` : '<span class="text-muted small">ไม่มี</span>';

      // 2. คำนวณอายุจากวันเกิด
      let ageText = '-';
      let dobText = '';
      if (p.dob) {
        const dob = new Date(p.dob);
        const diff = Date.now() - dob.getTime();
        const age = Math.abs(new Date(diff).getUTCFullYear() - 1970);
        ageText = `${age} ปี`;
        dobText = `<br><small class="text-muted">${dob.toLocaleDateString('th-TH')}</small>`;
      }

      tbody.innerHTML += `
        <tr>
          <td class="fw-bold text-muted">${p.id}</td>
          <td class="text-secondary">${p.id_card || '-'}</td>
          <td class="fw-bold text-primary">${p.full_name}</td>
          <td>${p.phone}</td>
          <td><span class="fw-bold text-dark">${ageText}</span>${dobText}</td>
          <td>${healthInfo}</td>
          <td class="text-center">
            <button class="btn btn-sm btn-primary rounded-pill px-3 me-1 fw-bold shadow-sm" onclick="openHistoryModal('${p.id}', '${p.full_name}')"><i class="fa-solid fa-clock-rotate-left me-1"></i> ประวัติ</button>
            <button class="btn btn-sm btn-outline-info rounded-pill px-3 me-1 fw-bold" onclick="openEditPatient('${p.id}')"><i class="fa-solid fa-pen-to-square me-1"></i> แก้ไข</button>
            <button class="btn btn-sm btn-light text-danger rounded-circle" title="ลบข้อมูล" onclick="deletePatientData('${p.id}')"><i class="fa-solid fa-trash"></i></button>
          </td>
        </tr>
      `;
    });
  }

  function filterPatientList() {
    let search = document.getElementById('searchPatientList').value.toLowerCase();
    let filtered = allPatients.filter(p => 
      (p.full_name && p.full_name.toLowerCase().includes(search)) || 
      (p.id && p.id.toLowerCase().includes(search)) || 
      (p.phone && p.phone.includes(search))
    );
    renderPatientTable(filtered);
  }

// 🌟 ป๊อปอัปดูประวัติการรักษา (แก้ไขตัวกรองให้แม่นยำขึ้น ไม่ดึงคำขยะ)
  async function openHistoryModal(hn, name) {
    const modalEl = document.getElementById('historyModal');
    if (!modalEl) return;
    
    if (modalEl.parentNode !== document.body) {
      document.body.appendChild(modalEl);
    }
    
    let modalInstance = bootstrap.Modal.getInstance(modalEl);
    if (!modalInstance) {
      modalInstance = new bootstrap.Modal(modalEl, { backdrop: 'static' });
    }
    
    document.querySelectorAll('.modal-backdrop').forEach(el => el.remove());
    
    document.getElementById('historyModalName').innerText = `${name} (${hn})`;
    document.getElementById('historyTimeline').innerHTML = '<div class="text-center py-5"><div class="spinner-border text-primary"></div></div>';
    
    modalInstance.show();
    
    try {
      const res = await fetch(`/api/emr/${hn}`);
      const data = await res.json();
      currentHistoryData = data.data || [];
      
      // 🌟 ดึงรายชื่อโปรโมชั่น/คอร์สที่ "ทำจริง" เท่านั้น กรองคำทั่วไปออก
      let promos = new Set();
      currentHistoryData.forEach(log => {
        let cc = log.symptoms || '';
        
        // 1. ดึงจากโหมดโปรโมชั่น (ห้องแพทย์)
        if (cc.includes('มารับบริการโปรโมชั่น:')) {
          let pName = cc.replace('มารับบริการโปรโมชั่น:', '').trim();
          if (pName) promos.add(pName);
        } 
        // 2. ดึงจากจุดคัดกรอง (Reception / Booking)
        else if (cc.includes('[บริการ]')) {
          let parts = cc.split('|');
          let srvPart = parts.find(p => p.includes('[บริการ]'));
          if (srvPart) {
            let pName = srvPart.replace('[บริการ]', '').trim();
            // ข้ามบริการทั่วไปที่ไม่ใช่คอร์ส/โปร (แก้บั๊กคำขยะ)
            if (pName && !pName.includes('ปรึกษาแพทย์') && !pName.includes('ตรวจทั่วไป')) {
              pName = pName.replace(/\s*\(คอร์สเดิม\)$/, '').trim();
              if (pName) promos.add(pName);
            }
          }
        }
      });
      
      let filterHtml = '<option value="ALL">-- ดูประวัติการรักษาทั้งหมด --</option>';
      promos.forEach(p => {
        if (p) filterHtml += `<option value="${p}">เฉพาะคอร์ส/โปร: ${p}</option>`;
      });
      document.getElementById('historyFilter').innerHTML = filterHtml;
      
      renderHistoryTimeline();
      
    } catch(e) {
      document.getElementById('historyTimeline').innerHTML = '<div class="text-danger text-center py-5">โหลดข้อมูลล้มเหลว</div>';
    }
  }

// 🌟 แสดงผลไทม์ไลน์ตามตัวกรอง (แก้บั๊กชื่อคอร์สเดี่ยวปนกับโปรโมชั่นแบบ 100%)
  function renderHistoryTimeline() {
    const filter = document.getElementById('historyFilter').value;
    const container = document.getElementById('historyTimeline');
    
    let filtered = currentHistoryData;
    
    // 🌟 ถ้าไม่ใช่ ALL ให้ทำการกรองแบบเจาะจงชื่อ (Exact Match)
    if (filter !== 'ALL' && filter.trim() !== '') {
      filtered = currentHistoryData.filter(log => {
        let cc = log.symptoms || '';
        let extractedName = '';

        // สกัดชื่อบริการออกมาเทียบแบบเป๊ะๆ เพื่อตัดปัญหาคำซ้อนกัน
        if (cc.includes('มารับบริการโปรโมชั่น:')) {
          extractedName = cc.replace('มารับบริการโปรโมชั่น:', '').split('|')[0].trim();
        } 
        else if (cc.includes('[บริการ]')) {
          let srvPart = cc.split('|').find(p => p.includes('[บริการ]'));
          if (srvPart) {
            extractedName = srvPart.replace('[บริการ]', '').replace(/\s*\(คอร์สเดิม\)$/, '').trim();
          }
        }
        
        // เทียบชื่อให้ตรงเป๊ะ 100% (ร้อยไหม ก็ต้องร้อยไหม ไม่ใช่ โปรโมชั่นร้อยไหม)
        return extractedName === filter;
      });
    }
    
    if (filtered.length === 0) {
      container.innerHTML = '<div class="text-muted text-center py-5"><i class="fa-solid fa-folder-open fa-2x mb-3 opacity-50"></i><br>ไม่พบประวัติการรักษาในรายการที่เลือก</div>';
      return;
    }
    
    let html = '';
    filtered.forEach(log => {
       const dateStr = new Date(log.visit_date).toLocaleDateString('th-TH', { year:'numeric', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
       let vitalsLog = (log.bp || log.pulse || log.weight || log.height) ? `<div class="small text-muted mt-2 px-2 py-1 bg-light rounded d-inline-block border"><i class="fa-solid fa-heart-pulse text-danger me-1"></i> BP: <b>${log.bp||'-'}</b> | HR: <b>${log.pulse||'-'}</b> | W: <b>${log.weight||'-'}</b> | H: <b>${log.height||'-'}</b></div>` : '';
       let formattedTx = log.treatment_details ? log.treatment_details.replace(/\n/g, '<br>') : '-';
       
       // 🌟 1. เพิ่มตัวแปรดึงชื่อหมอ
       let docName = log.doctor_name ? log.doctor_name : 'ไม่ระบุผู้ตรวจ'; 
       
       // 🌟 2. ปรับโครงสร้าง HTML ให้มีกล่องโชว์ชื่อหมออยู่มุมขวา
       html += `
        <div class="border-start border-3 border-primary ps-3 pb-4 mb-3 position-relative">
          <div class="position-absolute top-0 start-0 translate-middle rounded-circle bg-primary" style="width: 12px; height: 12px; margin-top: 5px;"></div>
          <div class="d-flex justify-content-between align-items-center mb-1">
             <span class="fw-bold text-primary"><i class="fa-solid fa-calendar-day me-1"></i> ${dateStr} น.</span>
             <span class="badge bg-light text-dark border shadow-sm"><i class="fa-solid fa-user-doctor me-1 text-primary"></i> ${docName}</span>
          </div>
          <div class="fw-bold text-dark mt-2"><span class="text-muted">Dx:</span> ${log.diagnosis || '-'}</div>
          <div class="small text-muted mt-1"><span class="fw-bold">CC:</span> ${log.symptoms || '-'}</div>
          <div class="small text-muted mt-2 p-2 bg-light rounded border"><span class="fw-bold">Tx (การรักษา):</span><br>${formattedTx}</div>
          ${vitalsLog}
        </div>`;
    });
    container.innerHTML = html;
  }

  function closeHistoryModal() {
    const modalEl = document.getElementById('historyModal');
    if(modalEl) {
       let m = bootstrap.Modal.getInstance(modalEl);
       if(m) m.hide();
    }
    setTimeout(() => {
      document.querySelectorAll('.modal-backdrop').forEach(el => el.remove());
      document.body.classList.remove('modal-open');
      document.body.style.overflow = '';
      document.body.style.paddingRight = '';
    }, 150);
  }

  // 🌟 ป๊อปอัปแก้ไขข้อมูลคนไข้
  function openEditPatient(hn) {
    const p = allPatients.find(x => x.id === hn);
    if(!p) return;

    Swal.fire({
      title: '<h4 class="fw-bold text-primary mb-0"><i class="fa-solid fa-user-pen me-2"></i>แก้ไขข้อมูลคนไข้</h4>',
      width: '700px',
      html: `
        <div class="row g-3 text-start mt-2">
          <div class="col-md-6">
            <label class="form-label small fw-bold text-muted mb-1">รหัสคนไข้ (HN)</label>
            <input id="edit_hn" class="form-control bg-light" value="${p.id}" readonly>
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-bold text-muted mb-1">เลขบัตรประชาชน</label>
            <input id="edit_idcard" class="form-control" value="${p.id_card || ''}">
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-bold text-muted mb-1">ชื่อ - นามสกุล *</label>
            <input id="edit_name" class="form-control border-primary" value="${p.full_name}">
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-bold text-muted mb-1">เบอร์โทรศัพท์ *</label>
            <input id="edit_phone" class="form-control border-primary" value="${p.phone}">
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-bold text-muted mb-1">วันเกิด</label>
            <input type="date" id="edit_dob" class="form-control" value="${p.dob || ''}">
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-bold text-muted mb-1">โรคประจำตัว</label>
            <input id="edit_disease" class="form-control" value="${p.congenital_disease || ''}">
          </div>
          <div class="col-12">
            <label class="form-label small fw-bold text-danger mb-1">ประวัติการแพ้ยา</label>
            <textarea id="edit_allergies" class="form-control border-danger" rows="2">${p.allergies || ''}</textarea>
          </div>
        </div>
      `,
      showCancelButton: true,
      confirmButtonText: '<i class="fa-solid fa-floppy-disk me-1"></i> บันทึกการแก้ไข',
      cancelButtonText: 'ยกเลิก',
      confirmButtonColor: '#3b82f6',
      preConfirm: () => {
        return {
          id: document.getElementById('edit_hn').value,
          full_name: document.getElementById('edit_name').value,
          id_card: document.getElementById('edit_idcard').value,
          phone: document.getElementById('edit_phone').value,
          dob: document.getElementById('edit_dob').value,
          congenital_disease: document.getElementById('edit_disease').value,
          allergies: document.getElementById('edit_allergies').value
        }
      }
    }).then(async (result) => {
      if (result.isConfirmed) {
        if(!result.value.full_name || !result.value.phone) {
          return Swal.fire('ข้อมูลไม่ครบ', 'กรุณากรอกชื่อและเบอร์โทรศัพท์', 'error');
        }

        Swal.fire({ title: 'กำลังอัปเดตข้อมูล...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
        try {
          const res = await fetch('/api/patients', { 
            method: 'POST', 
            headers: { 'Content-Type': 'application/json' }, 
            body: JSON.stringify(result.value) 
          });
          const data = await res.json();
          if (data.status === 'success') {
            Swal.fire({ icon: 'success', title: 'อัปเดตสำเร็จ', toast: true, position: 'top-end', timer: 1500, showConfirmButton: false });
            loadAllPatients(); 
          }
        } catch (err) { Swal.fire('Error', 'ไม่สามารถบันทึกได้', 'error'); }
      }
    });
  }

  async function deletePatientData(hn) {
    if ((await Swal.fire({ title: 'ยืนยันลบประวัติคนไข้?', text: "ข้อมูลนี้จะถูกลบและกู้คืนไม่ได้", icon:'warning', showCancelButton: true, confirmButtonColor: '#e11d48' })).isConfirmed) {
      Swal.fire({ title: 'กำลังลบ...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
      try {
        await fetch(`/api/patients/${hn}`, { method: 'DELETE' });
        Swal.fire({ icon: 'success', title: 'ลบสำเร็จ', toast: true, position: 'top-end', timer: 1500, showConfirmButton: false });
        loadAllPatients();
      } catch (e) {
        Swal.fire('Error', 'เกิดข้อผิดพลาด', 'error');
      }
    }
  }
</script>
