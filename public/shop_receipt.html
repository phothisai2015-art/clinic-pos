<!-- ========================================================= -->
<!-- 🧾 ส่วนที่ 3: ใบเสร็จรับเงิน (Receipt)                       -->
<!-- ========================================================= -->
<div id="page-receipt" style="display: none; background: #525659; min-height: 100vh; position: absolute; top: 0; left: 0; width: 100%; z-index: 1060; padding: 40px 20px; overflow-y: auto;">
  <style>
    .receipt-paper { background: #ffffff !important; width: 100%; max-width: 380px; margin: 0 auto; padding: 30px; border-radius: 8px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); font-family: 'Sarabun', sans-serif; color: #000000 !important; }
    .receipt-paper * { color: #000000 !important; } 
    body.dark-theme .receipt-paper *, body.dark-theme .receipt-paper th, body.dark-theme .receipt-paper td, body.dark-theme .receipt-paper .text-muted, body.dark-theme .receipt-paper .text-danger, body.dark-theme .receipt-paper .fw-bold { color: #000000 !important; border-color: #000000 !important; }
    .receipt-header { text-align: center; margin-bottom: 20px; border-bottom: 2px dashed #000000 !important; padding-bottom: 15px; }
    .receipt-logo { max-width: 180px; margin-bottom: 10px; } 
    .receipt-title { font-size: 22px; font-weight: 800; margin: 0; }
    .receipt-table { width: 100%; font-size: 14px; margin-bottom: 20px; }
    .receipt-summary { border-top: 2px dashed #000000 !important; padding-top: 15px; font-size: 15px; }
    .receipt-total { font-size: 20px; font-weight: 800; margin-top: 15px; border-top: 2px solid #000000 !important; padding-top: 10px; border-bottom: 2px solid #000000 !important; padding-bottom: 10px;}
    @media print {
      @page { size: 58mm auto; margin: 0; }
      body * { visibility: hidden; }
      #page-receipt { background: white !important; padding: 0 !important; position: absolute; left: 0; top: 0; width: 58mm !important; }
      .receipt-paper, .receipt-paper * { visibility: visible; }
      .receipt-paper { width: 100% !important; max-width: 58mm !important; padding: 5px !important; box-shadow: none !important; margin: 0 !important; border-radius: 0 !important; font-size: 11px !important; }
      .receipt-title { font-size: 14px !important; } .receipt-total { font-size: 14px !important; }
      .no-print { display: none !important; }
      html, body { margin: 0; padding: 0; }
    }
  </style>

  <div class="d-flex justify-content-center gap-3 mb-4 no-print">
    <button class="btn btn-light fw-bold px-4 rounded-pill shadow-sm" onclick="closeReceipt()"><i class="fa-solid fa-arrow-left me-2"></i> <span data-i18n="rc_btn_back_pos">กลับหน้า POS</span></button>
    <button class="btn btn-primary fw-bold px-4 rounded-pill shadow-sm" onclick="window.print()"><i class="fa-solid fa-print me-2"></i> <span data-i18n="rc_btn_print">พิมพ์ใบเสร็จ</span></button>
  </div>

  <div class="receipt-paper" id="receipt-content">
    <div class="receipt-header">
      <img id="rc-logo" src="" class="receipt-logo" style="display: none;">
      <h2 class="receipt-title" id="rc-shop-name" data-i18n="rc_shop_name_default">ชื่อร้านค้า</h2>
      <p class="receipt-info" id="rc-shop-address" data-i18n="rc_shop_address_default">ที่อยู่ร้าน...</p>
      <p class="receipt-info" id="rc-shop-phone" data-i18n="rc_shop_phone_default">โทร: -</p>
      <div style="margin-top: 15px; font-size: 18px; font-weight: bold;" data-i18n="rc_title">ใบเสร็จรับเงิน / RECEIPT</div>
    </div>
    <div style="font-size: 13px; margin-bottom: 20px;">
      <div><span data-i18n="rc_no_label">เลขที่: </span><span id="rc-id" class="fw-bold">REC000000</span></div><div><span data-i18n="rc_date_label">วันที่: </span><span id="rc-date">01/01/2026 12:00</span></div>
      <div><span data-i18n="rc_cashier_label">พนักงาน (Cashier): </span><span id="rc-seller">-</span></div><div><span data-i18n="rc_customer_label">ลูกค้า: </span><span id="rc-customer">-</span></div>
    </div>
    <table class="receipt-table">
      <thead><tr><th width="50%" class="text-start" data-i18n="rc_table_item">รายการ</th><th width="20%" class="text-center" data-i18n="rc_table_qty">จำนวน</th><th width="30%" class="text-end" data-i18n="rc_table_total">รวม</th></tr></thead>
      <tbody id="rc-items"></tbody>
    </table>
    <div class="receipt-summary">
      <div class="d-flex justify-content-between fw-bold mb-1"><span data-i18n="rc_summary_total_qty">จำนวนรวมทั้งหมด</span><span id="rc-total-qty">0</span></div>
      <div class="d-flex justify-content-between fw-bold mb-1"><span data-i18n="rc_summary_subtotal">รวมเป็นเงิน</span><span id="rc-subtotal">0.00</span></div>
      <div class="d-flex justify-content-between fw-bold mb-1 text-danger" id="rc-discount-row" style="display: none;"><span data-i18n="rc_summary_discount">ส่วนลด</span><span id="rc-discount">0.00</span></div>
	  <!-- 🌟 ส่วนแสดง ยอดรับเงิน และ เงินทอน (อัปเดตแก้บัคโชว์ 0.00) -->
      <div class="justify-content-between fw-bold mb-1 d-none" id="rc-received-row"><span data-i18n="rc_summary_received">รับเงินมา</span><span id="rc-received">0.00</span></div>
      <div class="justify-content-between fw-bold mb-1 d-none" id="rc-change-row"><span data-i18n="rc_summary_change">เงินทอน</span><span id="rc-change">0.00</span></div>
      <div class="d-flex justify-content-between receipt-total">
        <span data-i18n="rc_summary_net">ยอดสุทธิ (NET)</span>
        <div class="text-end"><span id="rc-nettotal">0.00</span><div class="text-muted mt-1" style="font-size: 12px; font-weight: normal;"><span data-i18n="rc_payment_method">วิธีชำระ: </span><span id="rc-payment">-</span></div></div>
      </div>
    </div>
  </div>

  <script>
    function openReceipt(data, shopSettings) {
      if (typeof changeLanguage === 'function') changeLanguage(currentLang);
      document.getElementById('page-receipt').style.display = 'block'; window.scrollTo(0, 0);
      if(shopSettings) {
        document.getElementById('rc-shop-name').innerText = shopSettings.shop_name || i18n[currentLang]['rc_shop_name_default'];
        document.getElementById('rc-shop-address').innerText = shopSettings.shop_address || '';
        document.getElementById('rc-shop-phone').innerText = shopSettings.shop_phone ? i18n[currentLang]['rc_shop_phone_prefix'] + shopSettings.shop_phone : '';
        if(shopSettings.shop_logo) { document.getElementById('rc-logo').src = shopSettings.shop_logo; document.getElementById('rc-logo').style.display = 'inline-block'; } else { document.getElementById('rc-logo').style.display = 'none'; }
      }
      document.getElementById('rc-id').innerText = data.receiptId; document.getElementById('rc-date').innerText = data.date;
      document.getElementById('rc-seller').innerText = data.seller || '-'; document.getElementById('rc-customer').innerText = data.customer || '-';
      const tbody = document.getElementById('rc-items'); tbody.innerHTML = ''; let totalQty = 0; 
      data.items.forEach(item => {
        let total = item.price * item.qty; totalQty += item.qty; 
        tbody.innerHTML += `<tr><td class="text-start fw-bold">${item.name}<br><small class="text-muted fw-normal">${i18n[currentLang]['rc_item_price_prefix']} ${item.price.toLocaleString()}</small></td><td class="text-center">${item.qty} <span style="font-size: 10px;">${item.unit || (currentLang === 'th' ? 'ชิ้น' : 'pcs')}</span></td><td class="text-end fw-bold">${total.toLocaleString()}</td></tr>`;
      });
      document.getElementById('rc-total-qty').innerText = totalQty.toLocaleString() + ' ' + (currentLang === 'th' ? 'ชิ้น' : 'pcs'); 
      document.getElementById('rc-subtotal').innerText = data.subtotal.toLocaleString();
      if(data.discount > 0) { document.getElementById('rc-discount-row').style.display = 'flex'; document.getElementById('rc-discount').innerText = '-' + data.discount.toLocaleString(); } else { document.getElementById('rc-discount-row').style.display = 'none'; }
      
      document.getElementById('rc-nettotal').innerText = data.netTotal.toLocaleString(); 
      document.getElementById('rc-payment').innerText = data.payment;

      // 🌟 อัพเดทการแสดงผลรับเงินมาและเงินทอน (ใช้ classList เปิด/ปิด แทน)
      let rcReceivedRow = document.getElementById('rc-received-row');
      let rcChangeRow = document.getElementById('rc-change-row');

      if (data.received !== undefined && parseFloat(data.received) > 0) {
        rcReceivedRow.classList.remove('d-none');
        rcReceivedRow.classList.add('d-flex');
        document.getElementById('rc-received').innerText = parseFloat(data.received).toLocaleString();
        
        rcChangeRow.classList.remove('d-none');
        rcChangeRow.classList.add('d-flex');
        document.getElementById('rc-change').innerText = parseFloat(data.change).toLocaleString();
      } else {
        rcReceivedRow.classList.remove('d-flex');
        rcReceivedRow.classList.add('d-none');
        
        rcChangeRow.classList.remove('d-flex');
        rcChangeRow.classList.add('d-none');
      }
      // 👆 ========================================= 👆
    }
    function closeReceipt() { document.getElementById('page-receipt').style.display = 'none'; }
  </script>
</div>
